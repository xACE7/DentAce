<!DOCTYPE html>
<html lang="en" style="direction:ltr;">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Interactive Exam • Glowing Dark Theme</title>
<meta name="color-scheme" content="dark" />
<style>
  :root{
    --bg:#0b0b12;
    --text:#f6f7fb;
    --muted:#a6afc6;
    --card:rgba(255,255,255,0.05);
    --card-border:rgba(255,255,255,0.12);
    --glass:rgba(255,255,255,0.04);
    --glass-border:rgba(255,255,255,0.10);
    --glow-cyan:#06b6d4;
    --glow-cyan-outer:rgba(6,182,212,0.40);
    --glow-purple:#8b5cf6;
    --glow-purple-outer:rgba(139,92,246,0.35);
    --white-haze:rgba(255,255,255,0.08);
    --white-outer:rgba(255,255,255,0.15);
    --radius:16px;
    --gap:1.25rem;
    --pad:1.5rem;
    --ok:#22c55e;  /* green */
    --bad:#ef4444; /* red */
  }

  *{box-sizing:border-box}
  body{margin:0;font:16px/1.65 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto;color:var(--text);background:var(--bg);min-height:100dvh;}
  .wrap{max-width:1100px;margin:0 auto;padding:24px;}

  .titlebar{
    position: static;z-index:10;
    backdrop-filter:saturate(140%) blur(8px);
    background:linear-gradient(180deg,rgba(11,11,18,0.75),rgba(11,11,18,0.35));
    border-bottom:1px solid var(--glass-border);
  }
  .titlebar .inner{max-width:1100px;margin:0 auto;padding:16px 24px;display:grid;gap:8px;align-items:center;}
  .grad-text{
    font-weight:800;
    letter-spacing:.3px;
    background:linear-gradient(90deg,var(--glow-cyan),var(--glow-purple));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 0 10px var(--glow-cyan-outer), 0 0 14px var(--glow-purple-outer);
  }
  h1.grad-text{font-size:clamp(1.6rem,2vw+1rem,2.6rem);margin:0;text-align:center;}
  .subtitle{margin:0;text-align:center;color:var(--muted);font-size:0.95rem}

  .section-h{
    margin:28px 0 14px;
    padding:12px 16px;
    border-radius:var(--radius);
    background:var(--glass);
    border:1px solid var(--glass-border);
    box-shadow: 0 2px 10px var(--white-haze), 0 0 18px rgba(255,255,255,0.06), 0 0 30px var(--white-outer);
    text-align:center;
    font-weight:750;
    font-size:1.15rem;
  }
  .section-h .grad-text{font-size:1.3rem;}

  .grid{display:grid;gap:var(--gap)}
  @media (min-width:800px){
    .grid.mcq{grid-template-columns:repeat(2,minmax(0,1fr));}
    .grid.tf {grid-template-columns:repeat(3,minmax(0,1fr));}
  }

  /* Cards (no accent on the card itself) */
  .card{
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:var(--radius);
    padding:var(--pad);
    box-shadow: 0 2px 8px var(--white-haze), 0 0 0 1px rgba(255,255,255,0.02), 0 0 24px rgba(255,255,255,0.06);
    position:relative;
  }

  .qtitle{font-weight:650;margin:0 0 12px}
  .meta{color:var(--muted);font-size:0.88rem;margin-bottom:10px}

  .opts{display:grid;gap:10px}
  .opt-btn{
    all:unset;cursor:pointer;display:flex;gap:10px;align-items:center;
    padding:12px 14px;border-radius:12px;
    background:rgba(255,255,255,0.03);
    border:1px solid rgba(255,255,255,0.10);
    transition:transform .06s ease, background .15s ease, border-color .15s ease;
  }
  .opt-btn .key{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-weight:700;
    background:linear-gradient(90deg,var(--glow-cyan),var(--glow-purple));color:#0b0b12;
    box-shadow:0 0 10px var(--glow-cyan-outer),0 0 10px var(--glow-purple-outer) inset;
  }
  .opt-btn:hover{transform:translateY(-1px);border-color:rgba(255,255,255,0.22);}

  /* Accent line ONLY on the chosen/correct answer box, no background highlight */
  .opt-btn.correct{
    border-left:6px solid var(--ok);
    outline:none;
    background:rgba(255,255,255,0.03);
  }
  .opt-btn.wrong{
    border-left:6px solid var(--bad);
    outline:none;
    background:rgba(255,255,255,0.03);
  }
  .opt-btn[disabled]{opacity:.85;cursor:not-allowed;pointer-events:none;}

  .feedback{margin-top:10px;border-radius:12px;padding:10px 12px;border:1px dashed rgba(255,255,255,0.18);background:rgba(255,255,255,0.03);color:var(--muted);}
  .feedback[hidden]{display:none;}
  .feedback b{color:var(--text)}

  .answer{margin-top:10px;padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,0.14);background:rgba(255,255,255,0.04)}
  .answer[hidden]{display:none;}
  .btnrow{display:flex;gap:10px;flex-wrap:wrap}
  .ghost, .primary{
    all:unset;cursor:pointer;border-radius:12px;padding:10px 14px;font-weight:650;border:1px solid rgba(255,255,255,0.18);
    background:rgba(255,255,255,0.03);
  }
  .primary{background:linear-gradient(90deg,var(--glow-cyan),var(--glow-purple));color:#0b0b12;border-color:transparent;}

  .score{
    margin:16px 0;padding:12px 14px;border-radius:14px;
    background:var(--glass);border:1px solid var(--glass-border);box-shadow: 0 2px 10px var(--white-haze), 0 0 18px rgba(255,255,255,0.06), 0 0 30px var(--white-outer);
    display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
  }
  .score .part{color:var(--muted);font-weight:600}
  .score b{color:var(--text)}
</style>
</head>

<body>
  <header class="titlebar">
    <div class="inner">
      <h1 class="grad-text">🦷 Dentistry 3rd year</h1>
      <p class="subtitle">Test based on Lecture 9</p>
    </div>
  </header>

  <main class="wrap">

    <h2 class="section-h"><span class="grad-text">اللَّهُمَّ لا سَهْلَ إِلَّا مَا جَعَلْتَهُ سَهْلًا، وَأَنْتَ تَجْعَلُ الحَزْنَ إِذَا شِئْتَ سَهْلًا</span></h2>

    <section class="score" id="scoreTop">
      <div class="part">MCQs: <b><span id="sMcq">0</span>/30</b></div>
      <div class="part">True/False: <b><span id="sTf">0</span>/9</b></div>
      <div class="part">SAQs: <b><span id="sSaq">0</span>/6</b></div>
      <div class="part">Total: <b><span id="sTotal">0</span>/45</b></div>
      <div class="btnrow">
        <button class="ghost" id="resetAll">Reset</button>
      </div>
    </section>

    <h2 class="section-h"><span class="grad-text">MCQs</span></h2>
    <div class="grid mcq" id="mcqGrid"></div>

    <h2 class="section-h"><span class="grad-text">True / False</span></h2>
    <div class="grid tf" id="tfGrid"></div>

    <h2 class="section-h"><span class="grad-text">Short Answer Questions</span></h2>
    <div class="grid" id="saqGrid"></div>

    <section class="score" id="scoreBottom">
      <div class="part">MCQs: <b><span id="sMcq2">0</span>/30</b></div>
      <div class="part">True/False: <b><span id="sTf2">0</span>/9</b></div>
      <div class="part">SAQs: <b><span id="sSaq2">0</span>/6</b></div>
      <div class="part">Total: <b><span id="sTotal2">0</span>/45</b></div>
    </section>
  </main>

<script>
// ----------- Data -----------
const mcqs = [
  {
    q: "Who introduced Zinc Oxide and clove oil cement in 1890?",
    opts: ["Chisolm", "Fletcher", "Dr. Pierce", "Dennis Smith"],
    correct: 0,
    explain: "Zinc oxide and clove oil were introduced by Chisolm in 1890, whereas Fletcher introduced Silicate cement in 1873."
  },
  {
    q: "Which of the following is NOT a general use of dental cements?",
    opts: ["Denture base material", "Luting/cementation", "Pulp capping", "Restoration"],
    correct: 0,
    explain: "Dental cements are used for luting, lining, bases, restorations, and pulp capping, but not typically as a primary denture base material."
  },
  {
    q: "What is the primary ingredient in Zinc Oxide Eugenol (ZOE) powder?",
    opts: ["Zinc Oxide (69%)", "White Rosin (29.3%)", "Alumina (30%)", "Magnesium Oxide (10%)"],
    correct: 0,
    explain: "The principal ingredient of ZOE powder is Zinc Oxide at approximately 69.0%."
  },
  {
    q: "What is the function of White Rosin in ZOE powder?",
    opts: ["To reduce brittleness", "To act as an accelerator", "To improve compressive strength", "To act as a plasticizer"],
    correct: 0,
    explain: "White rosin (29.3%) is added to the powder specifically to reduce the brittleness of the set cement."
  },
  {
    q: "Which component acts as an accelerator in ZOE powder?",
    opts: ["Zinc Stearate", "White Rosin", "Olive Oil", "Phosphoric Acid"],
    correct: 0,
    explain: "Zinc Stearate (1.0%) acts as an accelerator in the ZOE powder formulation."
  },
  {
    q: "What is the approximate percentage of Eugenol in ZOE liquid?",
    opts: ["85%", "15%", "38%", "62%"],
    correct: 0,
    explain: "The liquid component of ZOE cement contains approximately 85% Eugenol."
  },
  {
    q: "What is the role of Olive Oil in the ZOE liquid?",
    opts: ["Plasticizer", "Accelerator", "Retarder", "Antimicrobial agent"],
    correct: 0,
    explain: "Olive oil (15%) acts as a plasticizer in the ZOE liquid."
  },
  {
    q: "The setting reaction of ZOE is best described as:",
    opts: ["Chelation (Acid-Base)", "Polymerization", "Oxidation", "Hydration only"],
    correct: 0,
    explain: "The reaction proceeds as an acid-base reaction to form a chelate (Zinc Eugenolate)."
  },
  {
    q: "What is the typical compressive strength range of unmodified ZOE cement?",
    opts: ["3 MPa to 55 MPa", "100 MPa to 150 MPa", "80 MPa to 90 MPa", "200+ MPa"],
    correct: 0,
    explain: "ZOE is a weak cement with a compressive strength ranging from 3 MPa up to 55 MPa."
  },
  {
    q: "Which dental cement is known to have an Obtundant effect on exposed dentin?",
    opts: ["Zinc Oxide Eugenol", "Zinc Phosphate", "Glass Ionomer", "Resin Cement"],
    correct: 0,
    explain: "ZOE is the least irritating and has an obtundant (sedative) effect on the pulp/dentin."
  },
  {
    q: "What is the standard film thickness for ZOE cement?",
    opts: ["25 microns", "40 microns", "100 microns", "10 microns"],
    correct: 0,
    explain: "The film thickness for ZOE is typically 25 microns, which is important for luting."
  },
  {
    q: "Which of the following is TRUE regarding the pH of ZOE?",
    opts: ["It is nearly neutral (6.6 - 8.0)", "It is highly acidic (3.5)", "It is highly alkaline (11.0)", "It fluctuates wildly"],
    correct: 0,
    explain: "ZOE is the least irritating cement with a pH ranging between 6.6 and 8.0."
  },
  {
    q: "How does particle size affect the setting time of ZOE?",
    opts: ["Smaller particles set faster", "Smaller particles set slower", "Particle size has no effect", "Larger particles set faster"],
    correct: 0,
    explain: "Smaller Zinc Oxide particles react more quickly, leading to a faster set."
  },
  {
    q: "What is the recommended Powder/Liquid ratio for ZOE?",
    opts: ["4:1 by weight", "1:1 by weight", "2:1 by weight", "1:4 by weight"],
    correct: 0,
    explain: "The manipulation instructions specify a P/L ratio of 4:1 by weight."
  },
  {
    q: "What is the effect of cooling the glass slab on ZOE setting time?",
    opts: ["Delays the setting time", "Accelerates the setting time", "No effect on setting time", "Increases the temperature of the mix"],
    correct: 0,
    explain: "Cooling the glass slab slows the chemical reaction, thereby delaying the setting time."
  },
  {
    q: "EBA-Alumina modified cements were introduced to improve which property?",
    opts: ["Mechanical properties", "Esthetics", "Adhesion", "Translucency"],
    correct: 0,
    explain: "EBA (Ethoxy Benzoic Acid) and Alumina are added to improve the mechanical properties (strength) of ZOE."
  },
  {
    q: "In Polymer Reinforced ZOE, what is used as an accelerator?",
    opts: ["Acetic Acid", "Zinc Acetate", "Zinc Stearate", "Thymol"],
    correct: 0,
    explain: "In polymer reinforced ZOE, Acetic Acid is used as an accelerator."
  },
  {
    q: "Which type of Zinc Phosphate cement is used for luting (Type I)?",
    opts: ["Fine grained", "Medium grained", "Coarse grained", "Resin modified"],
    correct: 0,
    explain: "Type I Zinc Phosphate is fine-grained, designed for luting with a film thickness of 25 microns or less."
  },
  {
    q: "What is the film thickness of Type II Zinc Phosphate cement?",
    opts: ["40 microns", "25 microns", "15 microns", "60 microns"],
    correct: 0,
    explain: "Type II Zinc Phosphate (medium grain) has a film thickness of 40 microns."
  },
  {
    q: "The liquid component of Zinc Phosphate cement consists primarily of:",
    opts: ["Phosphoric Acid (38.2%)", "Eugenol (85%)", "Polyacrylic Acid", "Acetic Acid"],
    correct: 0,
    explain: "The liquid is an aqueous solution of Phosphoric Acid (approx 38.2%)."
  },
  {
    q: "What is the function of water (36%) in Zinc Phosphate liquid?",
    opts: ["Controls the rate of reaction", "Increases strength", "Acts as a filler", "Reduces acidity"],
    correct: 0,
    explain: "Water content in the liquid controls the ionization of the acid and thus the rate of the reaction."
  },
  {
    q: "The set structure of Zinc Phosphate cement consists of:",
    opts: ["Unreacted ZnO in Zinc Aluminophosphate matrix", "Zinc Eugenolate matrix", "Glass particles in polysalt matrix", "Resin matrix"],
    correct: 0,
    explain: "The set cement is a cored structure of unreacted Zinc Oxide particles embedded in an amorphous matrix of Zinc Aluminophosphate."
  },
  {
    q: "What is the compressive strength of Zinc Phosphate cement after 1 day?",
    opts: ["103.5 MPa", "55 MPa", "20 MPa", "300 MPa"],
    correct: 0,
    explain: "Zinc Phosphate is stronger than ZOE, with a max strength around 103.5 MPa attained in the first day."
  },
  {
    q: "What is the pH of Zinc Phosphate cement 3 minutes after mixing?",
    opts: ["3.5 (Acidic)", "7.0 (Neutral)", "5.5 (Mildly Acidic)", "9.0 (Basic)"],
    correct: 0,
    explain: "Zinc Phosphate is highly acidic initially, with a pH of 3.5 just 3 minutes after mixing."
  },
  {
    q: "How does Zinc Phosphate adhere to the tooth structure?",
    opts: ["Mechanical interlocking", "Chemical bonding to Calcium", "Hybrid layer formation", "Ionic exchange"],
    correct: 0,
    explain: "Zinc Phosphate has no chemical bond; retention depends on mechanical interlocking of the set cement."
  },
  {
    q: "To prevent pulpal irritation under Zinc Phosphate, what should be used?",
    opts: ["Calcium Hydroxide liner", "Etchant", "Bonding agent only", "Nothing"],
    correct: 0,
    explain: "Due to its high acidity, a Calcium Hydroxide liner is recommended to protect the pulp if dentin thickness is low."
  },
  {
    q: "What is the standard setting time range for Zinc Phosphate cement?",
    opts: ["5 - 9 minutes", "1 - 2 minutes", "10 - 15 minutes", "20 - 30 minutes"],
    correct: 0,
    explain: "The setting time for Zinc Phosphate ranges from 5 to 9 minutes."
  },
  {
    q: "During manipulation of Zinc Phosphate, why is the mix spread over a large area?",
    opts: ["To dissipate exothermic heat", "To increase setting speed", "To mix the colors", "To reduce powder volume"],
    correct: 0,
    explain: "Mixing over a large area helps dissipate the exothermic heat generated by the acid-base reaction."
  },
  {
    q: "What is the total mixing time for Zinc Phosphate cement to obtain a luting consistency?",
    opts: ["1 min 15 sec", "30 seconds", "2 minutes", "45 seconds"],
    correct: 0,
    explain: "The standard mixing procedure involves adding increments over a total time of 1 minute and 15 seconds."
  },
  {
    q: "Which of the following describes the optical property of set Zinc Phosphate?",
    opts: ["Opaque", "Translucent", "Transparent", "Fluorescent"],
    correct: 0,
    explain: "Set Zinc Phosphate cement is opaque."
  }
];

const tfs = [
  {
    q: "Zinc Oxide Eugenol adheres chemically to enamel and dentin.",
    answer: false,
    explain: "ZOE does not adhere chemically; it relies on mechanical retention and has no chemical bond to tooth structure."
  },
  {
    q: "Zinc Phosphate cement reaction is exothermic.",
    answer: true,
    explain: "The reaction between Zinc Oxide and Phosphoric acid releases heat (exothermic), requiring a cool slab and wide spreading."
  },
  {
    q: "ZOE cement is stronger in compression than Zinc Phosphate cement.",
    answer: false,
    explain: "ZOE is much weaker (3-55 MPa) compared to Zinc Phosphate (103.5 MPa)."
  },
  {
    q: "Type II ZOE is used for permanent cementation.",
    answer: true,
    explain: "According to the ADA specification No. 30 listed in the lecture, Type II ZOE is for Permanent Cementation."
  },
  {
    q: "Cooling the glass slab delays the setting time of Zinc Phosphate cement.",
    answer: true,
    explain: "Cooling the slab slows the reaction, allowing more powder incorporation and a longer working time."
  },
  {
    q: "Zinc Stearate in ZOE powder acts as a retarder.",
    answer: false,
    explain: "Zinc Stearate (1.0%) acts as an ACCELERATOR, not a retarder."
  },
  {
    q: "The pH of Zinc Phosphate cement reaches neutral immediately after mixing.",
    answer: false,
    explain: "It is acidic (pH 3.5) at 3 minutes and takes 24-48 hours to reach neutrality."
  },
  {
    q: "Polymer reinforced ZOE contains Thymol as an antimicrobial agent.",
    answer: true,
    explain: "The liquid of polymer reinforced ZOE contains Eugenol, Acetic acid, and Thymol (antimicrobial)."
  },
  {
    q: "Zinc Phosphate powder should be added to the liquid in large increments all at once.",
    answer: false,
    explain: "It must be added in small increments (e.g., 1/2, 1/4, 1/8, 1/8) to control the reaction and heat."
  }
];

const saqs = [
  {
    q: "Define 'Obtundant' in the context of dental cements.",
    a: "An agent that reduces dentin sensitivity or has a sedative effect on the pulp (characteristic of ZOE)."
  },
  {
    q: "List the four types of ZOE according to ADA specification No. 30.",
    a: "1. Type I: Temporary Cementation<br>2. Type II: Permanent Cementation<br>3. Type III: Temporary filling and thermal base<br>4. Type IV: Cavity Liners"
  },
  {
    q: "Compare the Compressive Strength of Unmodified ZOE and Zinc Phosphate cement.",
    a: "<b>ZOE:</b> 3 - 55 MPa (Weak)<br><b>Zinc Phosphate:</b> ~103.5 MPa (Stronger)"
  },
  {
    q: "A patient requires a cement base in a deep cavity where the dentin thickness is very less. If you choose Zinc Phosphate, what precaution must be taken and why?",
    a: "A Calcium Hydroxide liner must be used to protect the pulp because Zinc Phosphate is highly acidic (pH 3.5) initially and can irritate the pulp."
  },
  {
    q: "List the composition of Zinc Phosphate Powder.",
    a: "1. Zinc Oxide (92%)<br>2. Magnesium Oxide (8.2%)"
  },
  {
    q: "Explain the effect of Powder-to-Liquid ratio on the setting time of cements.",
    a: "Higher Powder-to-Liquid ratio (more powder) leads to a FASTER setting time."
  }
];

// ----------- State -----------
const state = {
  mcq: Array(mcqs.length).fill(null), // null | selectedIndex
  tf: Array(tfs.length).fill(null),   // null | boolean
  saq: Array(saqs.length).fill(false) // self-marked
};

function shuffleIndices(n){
  const arr = Array.from({length:n}, (_,i)=>i);
  for(let i=n-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}

// ----------- Render MCQs -----------
const mcqGrid = document.getElementById('mcqGrid');
mcqs.forEach((item, idx)=>{
  const map = shuffleIndices(4);
  const visualToOriginal = map;
  const originalToVisual = Array(4);
  map.forEach((orig, v)=>{ originalToVisual[orig] = v; });
  const correctVisualIndex = originalToVisual[item.correct];

  const card = document.createElement('article');
  card.className='card qcard';
  card.dataset.type='mcq';
  card.dataset.index = idx;
  card.dataset.locked = 'false';
  card.innerHTML = `
    <p class="meta">Question ${idx+1} of ${mcqs.length}</p>
    <h3 class="qtitle">${item.q}</h3>
    <div class="opts">
      ${[0,1,2,3].map(v=>`
        <button class="opt-btn" data-v="${v}" aria-label="Answer option ${String.fromCharCode(65+v)}">
          <span class="key">${String.fromCharCode(65+v)}</span>
          <span class="label">${item.opts[ visualToOriginal[v] ]}</span>
        </button>
      `).join('')}
    </div>
    <div class="feedback" hidden></div>
  `;

  const buttons = card.querySelectorAll('.opt-btn');
  const feedback = card.querySelector('.feedback');

  function lock(){
    card.dataset.locked = 'true';
    buttons.forEach(b=>b.setAttribute('disabled',''));
  }

  buttons.forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(card.dataset.locked === 'true') return; // one attempt
      const v = Number(btn.dataset.v);
      state.mcq[idx] = v;

      // clear classes
      buttons.forEach(b=>b.classList.remove('correct','wrong'));

      // Always mark the correct option (green)
      const correctBtn = buttons[correctVisualIndex];
      correctBtn.classList.add('correct');

      if(v !== correctVisualIndex){
        // Mark chosen wrong option (red)
        btn.classList.add('wrong');
        feedback.hidden=false;
        feedback.innerHTML = `<b>Wrong ✖</b><br>Correct answer: <b>${String.fromCharCode(65+correctVisualIndex)}</b><br>${item.explain}`;
      }else{
        feedback.hidden=false;
        feedback.innerHTML = `<b>Correct ✔</b><br>Answer: <b>${String.fromCharCode(65+correctVisualIndex)}</b><br>${item.explain}`;
      }
      lock();
      recalc();
    });
  });

  mcqGrid.appendChild(card);
});

// ----------- Render True/False -----------
const tfGrid = document.getElementById('tfGrid');
tfs.forEach((item, idx)=>{
  const card = document.createElement('article');
  card.className='card qcard';
  card.dataset.type='tf';
  card.dataset.index = idx;
  card.dataset.locked = 'false';
  card.innerHTML = `
    <p class="meta">Statement ${idx+1} of ${tfs.length}</p>
    <h3 class="qtitle">${item.q}</h3>
    <div class="opts">
      <button class="opt-btn" data-v="true">
        <span class="key">T</span><span class="label">True</span>
      </button>
      <button class="opt-btn" data-v="false">
        <span class="key">F</span><span class="label">False</span>
      </button>
    </div>
    <div class="feedback" hidden></div>
  `;

  const buttons = card.querySelectorAll('.opt-btn');
  const feedback = card.querySelector('.feedback');

  function lock(){
    card.dataset.locked = 'true';
    buttons.forEach(b=>b.setAttribute('disabled',''));
  }

  buttons.forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(card.dataset.locked === 'true') return; // one attempt
      const val = btn.dataset.v === "true";
      state.tf[idx] = val;

      // clear classes
      buttons.forEach(b=>b.classList.remove('correct','wrong'));

      // Always mark the correct button (green)
      const correctBtn = Array.from(buttons).find(b => (b.dataset.v === (item.answer ? "true" : "false")));
      correctBtn.classList.add('correct');

      const isCorrect = (val === item.answer);
      if(!isCorrect){
        // mark chosen wrong (red)
        btn.classList.add('wrong');
        feedback.hidden=false;
        feedback.innerHTML = `<b>Wrong ✖</b><br>Correct answer: <b>${item.answer ? 'True' : 'False'}</b><br>${item.explain}`;
      }else{
        feedback.hidden=false;
        feedback.innerHTML = `<b>Correct ✔</b><br>Answer: <b>${item.answer ? 'True' : 'False'}</b><br>${item.explain}`;
      }

      lock();
      recalc();
    });
  });

  tfGrid.appendChild(card);
});

// ----------- Render SAQs -----------
const saqGrid = document.getElementById('saqGrid');
saqs.forEach((item, idx)=>{
  const card = document.createElement('article');
  card.className='card qcard';
  card.dataset.type='saq';
  card.dataset.index = idx;
  card.innerHTML = `
  <p class="meta">Question ${idx + 1} of ${saqs.length}</p>
  <h3 class="qtitle">${item.q}</h3>
  <textarea rows="4" placeholder="Type your answer..." style="width:100%;padding:12px;border-radius:12px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.14);color:var(--text);"></textarea>
  <div class="btnrow" style="margin-top:10px">
    <button class="primary" data-act="reveal">Reveal Answer</button>
    <button class="ghost" data-act="toggle">I was correct</button>
  </div>
  <div class="answer" hidden>${item.a}</div>
`;


  const revealBtn = card.querySelector('[data-act="reveal"]');
  const toggleBtn = card.querySelector('[data-act="toggle"]');
  const answer = card.querySelector('.answer');

  revealBtn.addEventListener('click', ()=>{
    answer.hidden = !answer.hidden;
    revealBtn.textContent = answer.hidden ? "Reveal Answer" : "Hide Answer";
  });

  toggleBtn.addEventListener('click', ()=>{
    const now = !state.saq[idx];
    state.saq[idx] = now;
    toggleBtn.textContent = now ? "✓ Counted as correct" : "I was correct";
    toggleBtn.style.outline = now ? "2px solid rgba(34,197,94,.7)" : "none";
    recalc();
  });

  saqGrid.appendChild(card);
});

// ----------- Score + Reset -----------
function recalc(){
  const mcqScore = state.mcq.reduce((s,v,i)=>{
    if(v===null) return s;
    const card = document.querySelector(`.qcard[data-type="mcq"][data-index="${i}"]`);
    const feedback = card.querySelector('.feedback').textContent;
    return s + (feedback.startsWith("Correct") ? 1 : 0);
  },0);
  const tfScore = state.tf.reduce((s,v,i)=>{
    if(v===null) return s;
    const card = document.querySelector(`.qcard[data-type="tf"][data-index="${i}"]`);
    const feedback = card.querySelector('.feedback').textContent;
    return s + (feedback.startsWith("Correct") ? 1 : 0);
  },0);
  const saqScore = state.saq.filter(Boolean).length;
  const total = mcqScore + tfScore + saqScore;

  const ids = ["sMcq","sTf","sSaq","sTotal","sMcq2","sTf2","sSaq2","sTotal2"];
  ids.forEach(id=>{
    const el = document.getElementById(id);
    if(!el) return;
    if(id.includes('Mcq')) el.textContent = mcqScore;
    if(id.includes('Tf')) el.textContent = tfScore;
    if(id.includes('Saq')) el.textContent = saqScore;
    if(id.includes('Total')) el.textContent = total;
  });
}

document.getElementById('resetAll').addEventListener('click', ()=>{
  document.querySelectorAll('.qcard .feedback').forEach(f=>{f.hidden=true; f.textContent=''; f.innerHTML='';});
  document.querySelectorAll('.opt-btn').forEach(b=>{
    b.classList.remove('correct','wrong');
    b.removeAttribute('disabled');
  });
  document.querySelectorAll('.qcard[data-type="mcq"], .qcard[data-type="tf"]').forEach(c=>{c.dataset.locked='false';});
  document.querySelectorAll('.qcard[data-type="saq"] textarea').forEach(t=>t.value="");
  document.querySelectorAll('.qcard[data-type="saq"] .answer').forEach(a=>a.hidden=true);
  document.querySelectorAll('.qcard[data-type="saq"] [data-act="reveal"]').forEach(b=>b.textContent="Reveal Answer");
  document.querySelectorAll('.qcard[data-type="saq"] [data-act="toggle"]').forEach(b=>{b.textContent="I was correct"; b.style.outline="none";});

  state.mcq.fill(null); state.tf.fill(null); state.saq.fill(false);
  recalc();
});

recalc();
</script>
