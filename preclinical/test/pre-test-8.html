<!DOCTYPE html>
<html lang="en" style="direction:ltr;">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Interactive Exam • Glowing Dark Theme</title>
<meta name="color-scheme" content="dark" />
<style>
  :root{
    --bg:#0b0b12;
    --text:#f6f7fb;
    --muted:#a6afc6;
    --card:rgba(255,255,255,0.05);
    --card-border:rgba(255,255,255,0.12);
    --glass:rgba(255,255,255,0.04);
    --glass-border:rgba(255,255,255,0.10);
    --glow-cyan:#06b6d4;
    --glow-cyan-outer:rgba(6,182,212,0.40);
    --glow-purple:#8b5cf6;
    --glow-purple-outer:rgba(139,92,246,0.35);
    --white-haze:rgba(255,255,255,0.08);
    --white-outer:rgba(255,255,255,0.15);
    --radius:16px;
    --gap:1.25rem;
    --pad:1.5rem;
    --ok:#22c55e;  /* green */
    --bad:#ef4444; /* red */
  }

  *{box-sizing:border-box}
  body{margin:0;font:16px/1.65 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto;color:var(--text);background:var(--bg);min-height:100dvh;}
  .wrap{max-width:1100px;margin:0 auto;padding:24px;}

  .titlebar{
    position: static;z-index:10;
    backdrop-filter:saturate(140%) blur(8px);
    background:linear-gradient(180deg,rgba(11,11,18,0.75),rgba(11,11,18,0.35));
    border-bottom:1px solid var(--glass-border);
  }
  .titlebar .inner{max-width:1100px;margin:0 auto;padding:16px 24px;display:grid;gap:8px;align-items:center;}
  .grad-text{
    font-weight:800;
    letter-spacing:.3px;
    background:linear-gradient(90deg,var(--glow-cyan),var(--glow-purple));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 0 10px var(--glow-cyan-outer), 0 0 14px var(--glow-purple-outer);
  }
  h1.grad-text{font-size:clamp(1.6rem,2vw+1rem,2.6rem);margin:0;text-align:center;}
  .subtitle{margin:0;text-align:center;color:var(--muted);font-size:0.95rem}

  .section-h{
    margin:28px 0 14px;
    padding:12px 16px;
    border-radius:var(--radius);
    background:var(--glass);
    border:1px solid var(--glass-border);
    box-shadow: 0 2px 10px var(--white-haze), 0 0 18px rgba(255,255,255,0.06), 0 0 30px var(--white-outer);
    text-align:center;
    font-weight:750;
    font-size:1.15rem;
  }
  .section-h .grad-text{font-size:1.3rem;}

  .grid{display:grid;gap:var(--gap)}
  @media (min-width:800px){
    .grid.mcq{grid-template-columns:repeat(2,minmax(0,1fr));}
    .grid.tf {grid-template-columns:repeat(3,minmax(0,1fr));}
  }

  /* Cards (no accent on the card itself) */
  .card{
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:var(--radius);
    padding:var(--pad);
    box-shadow: 0 2px 8px var(--white-haze), 0 0 0 1px rgba(255,255,255,0.02), 0 0 24px rgba(255,255,255,0.06);
    position:relative;
  }

  .qtitle{font-weight:650;margin:0 0 12px}
  .meta{color:var(--muted);font-size:0.88rem;margin-bottom:10px}

  .opts{display:grid;gap:10px}
  .opt-btn{
    all:unset;cursor:pointer;display:flex;gap:10px;align-items:center;
    padding:12px 14px;border-radius:12px;
    background:rgba(255,255,255,0.03);
    border:1px solid rgba(255,255,255,0.10);
    transition:transform .06s ease, background .15s ease, border-color .15s ease;
  }
  .opt-btn .key{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-weight:700;
    background:linear-gradient(90deg,var(--glow-cyan),var(--glow-purple));color:#0b0b12;
    box-shadow:0 0 10px var(--glow-cyan-outer),0 0 10px var(--glow-purple-outer) inset;
  }
  .opt-btn:hover{transform:translateY(-1px);border-color:rgba(255,255,255,0.22);}

  /* Accent line ONLY on the chosen/correct answer box, no background highlight */
  .opt-btn.correct{
    border-left:6px solid var(--ok);
    outline:none;
    background:rgba(255,255,255,0.03);
  }
  .opt-btn.wrong{
    border-left:6px solid var(--bad);
    outline:none;
    background:rgba(255,255,255,0.03);
  }
  .opt-btn[disabled]{opacity:.85;cursor:not-allowed;pointer-events:none;}

  .feedback{margin-top:10px;border-radius:12px;padding:10px 12px;border:1px dashed rgba(255,255,255,0.18);background:rgba(255,255,255,0.03);color:var(--muted);}
  .feedback[hidden]{display:none;}
  .feedback b{color:var(--text)}

  .answer{margin-top:10px;padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,0.14);background:rgba(255,255,255,0.04)}
  .answer[hidden]{display:none;}
  /* Table styling for SAQ answers */
  .answer table {width:100%; border-collapse: collapse; margin-top:8px; font-size:0.9rem;}
  .answer th, .answer td {border:1px solid rgba(255,255,255,0.2); padding:8px; text-align:left;}
  .answer th {background:rgba(255,255,255,0.05); color:var(--glow-cyan);}
  
  .btnrow{display:flex;gap:10px;flex-wrap:wrap}
  .ghost, .primary{
    all:unset;cursor:pointer;border-radius:12px;padding:10px 14px;font-weight:650;border:1px solid rgba(255,255,255,0.18);
    background:rgba(255,255,255,0.03);
  }
  .primary{background:linear-gradient(90deg,var(--glow-cyan),var(--glow-purple));color:#0b0b12;border-color:transparent;}

  .score{
    margin:16px 0;padding:12px 14px;border-radius:14px;
    background:var(--glass);border:1px solid var(--glass-border);box-shadow: 0 2px 10px var(--white-haze), 0 0 18px rgba(255,255,255,0.06), 0 0 30px var(--white-outer);
    display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
  }
  .score .part{color:var(--muted);font-weight:600}
  .score b{color:var(--text)}
</style>
</head>

<body>
  <header class="titlebar">
    <div class="inner">
      <h1 class="grad-text">🦷 Dentistry 3rd year</h1>
      <p class="subtitle">Test based on Lecture 8</p>
    </div>
  </header>

  <main class="wrap">

    <h2 class="section-h"><span class="grad-text">اللَّهُمَّ لا سَهْلَ إِلَّا مَا جَعَلْتَهُ سَهْلًا، وَأَنْتَ تَجْعَلُ الحَزْنَ إِذَا شِئْتَ سَهْلًا</span></h2>

    <section class="score" id="scoreTop">
      <div class="part">MCQs: <b><span id="sMcq">0</span>/30</b></div>
      <div class="part">True/False: <b><span id="sTf">0</span>/9</b></div>
      <div class="part">SAQs: <b><span id="sSaq">0</span>/6</b></div>
      <div class="part">Total: <b><span id="sTotal">0</span>/45</b></div>
      <div class="btnrow">
        <button class="ghost" id="resetAll">Reset</button>
      </div>
    </section>

    <h2 class="section-h"><span class="grad-text">MCQs</span></h2>
    <div class="grid mcq" id="mcqGrid"></div>

    <h2 class="section-h"><span class="grad-text">True / False</span></h2>
    <div class="grid tf" id="tfGrid"></div>

    <h2 class="section-h"><span class="grad-text">Short Answer Questions</span></h2>
    <div class="grid" id="saqGrid"></div>

    <section class="score" id="scoreBottom">
      <div class="part">MCQs: <b><span id="sMcq2">0</span>/30</b></div>
      <div class="part">True/False: <b><span id="sTf2">0</span>/9</b></div>
      <div class="part">SAQs: <b><span id="sSaq2">0</span>/6</b></div>
      <div class="part">Total: <b><span id="sTotal2">0</span>/45</b></div>
    </section>
  </main>

<script>
// ----------- Data -----------
const mcqs = [
  {
    q: "Which of the following areas is NOT considered a Class I preparation location?",
    opts: ["Proximal surfaces of premolars", "Occlusal surfaces of molars", "Occlusal two-thirds of facial surfaces of molars", "Lingual surfaces of maxillary incisors"],
    correct: 0,
    explain: "Class I preparations include occlusal pits/fissures, occlusal 2/3 of facial/lingual of molars, and lingual of incisors. Proximal surfaces are Class II."
  },
  {
    q: "Which bur is specifically recommended for Class I tooth preparation in the lecture?",
    opts: ["No. 245 carbide bur", "No. 330 diamond bur", "No. 56 straight fissure bur", "No. 169 tapered fissure bur"],
    correct: 0,
    explain: "A No. 245 bur with a head length of 3 mm and a tip diameter of 0.8mm is recommended."
  },
  {
    q: "What is the recommended initial depth of the pulpal floor at the central fissure?",
    opts: ["1.5 mm", "0.5 mm", "2.5 mm", "3.0 mm"],
    correct: 0,
    explain: "The 1.5-mm initial pulpal depth is measured at the central fissure."
  },
  {
    q: "For a Class I preparation, the buccolingual width of the isthmus should not exceed:",
    opts: ["1/4 the intercuspal distance", "1/3 the intercuspal distance", "1/2 the intercuspal distance", "3/4 the intercuspal distance"],
    correct: 0,
    explain: "Buccolingual width should be not more than 1/4 the intercuspal distance to prevent fracture."
  },
  {
    q: "What is the ideal marginal ridge thickness remaining for a Premolar in a Class I preparation?",
    opts: ["1.6 mm", "2.0 mm", "1.0 mm", "0.5 mm"],
    correct: 0,
    explain: "Marginal ridge thickness for premolars should be 1.6 mm."
  },
  {
    q: "What is the ideal marginal ridge thickness remaining for a Molar in a Class I preparation?",
    opts: ["2.0 mm", "1.6 mm", "1.2 mm", "2.5 mm"],
    correct: 0,
    explain: "Marginal ridge thickness for molars should be 2.0 mm."
  },
  {
    q: "To provide retention for amalgam, the facial and lingual walls should have:",
    opts: ["Occlusal convergence of 2-5 degrees", "Occlusal divergence of 5-10 degrees", "Parallel walls", "Rounded undercuts"],
    correct: 0,
    explain: "Retention form for amalgam requires occlusal convergence of 2-5 degrees."
  },
  {
    q: "Why are internal line angles rounded in a Class I preparation?",
    opts: ["To reduce stress concentration", "To improve aesthetics", "To save tooth structure", "To increase retention"],
    correct: 0,
    explain: "Sharp angles lead to stress concentration which can cause fracture of the tooth or restoration."
  },
  {
    q: "What is the ideal cavosurface margin angle for an amalgam restoration?",
    opts: ["90 degrees", "45 degrees", "120 degrees", "60 degrees"],
    correct: 0,
    explain: "A 90-degree butt joint cavosurface margin is the strongest for both enamel and amalgam."
  },
  {
    q: "How many line angles are present in a typical Class I preparation?",
    opts: ["8", "4", "6", "10"],
    correct: 0,
    explain: "There are 8 line angles: Bucco-pulpal, Disto-buccal, Disto-pulpal, Disto-lingual, Linguo-pulpal, Mesio-lingual, Mesio-pulpal, Mesio-buccal."
  },
  {
    q: "Ideally, the bur should be held in which orientation during the punch cut?",
    opts: ["Parallel to the long axis of the tooth", "Perpendicular to the occlusal plane", "Angled 45 degrees lingually", "Angled 10 degrees facially"],
    correct: 0,
    explain: "A punch cut is performed by orienting the bur so that its long axis parallels the long axis of the tooth."
  },
  {
    q: "When deeper carious excavation results in a Remaining Dentin Thickness (RDT) of 0.5 - 1mm, what is indicated?",
    opts: ["A thin layer of RMGIC base", "Direct amalgam placement", "Calcium hydroxide liner only", "No base is needed"],
    correct: 0,
    explain: "For RDT of 0.5-1mm, a thin layer (0.5-0.75mm) of resin-modified glass-ionomer (RMGIC) base is indicated."
  },
  {
    q: "Which of the following constitutes the 'Resistance Form' in Class I preparation?",
    opts: ["Flat pulpal floor", "Occlusal convergence", "Beveled margins", "Narrow outline"],
    correct: 0,
    explain: "Primary resistance form is provided by a flat pulpal floor to resist forces directed in the long axis."
  },
  {
    q: "Which wall is NOT a vertical wall in a Class I preparation?",
    opts: ["Pulpal wall", "Mesial wall", "Distal wall", "Lingual wall"],
    correct: 0,
    explain: "The Pulpal wall (floor) is a horizontal wall; the others are vertical."
  },
  {
    q: "What is a characteristic of 'Modified' Class I preparation for composite?",
    opts: ["Scooped-out appearance", "Uniform 1.5mm depth", "Box-like shape", "Occlusal convergence"],
    correct: 0,
    explain: "Modified preparations have a scooped-out appearance and do not require typical resistance/retention forms."
  },
  {
    q: "Which bur is typically used for a Modified Class I preparation?",
    opts: ["Small round or pear-shaped bur", "Large flat-end cylinder", "Inverted cone", "Tapered fissure"],
    correct: 0,
    explain: "They are prepared with a small round or pear-shaped bur."
  },
  {
    q: "What is the initial pulpal depth inside the DEJ for a modified composite preparation?",
    opts: ["0.2 mm", "1.5 mm", "0.5 mm", "1.0 mm"],
    correct: 0,
    explain: "The initial pulpal depth is approximately 0.2 mm inside the DEJ."
  },
  {
    q: "Occlusal beveling is generally contraindicated in Class I preparations because:",
    opts: ["It creates thin composite prone to fracture", "It reduces retention", "It increases microleakage", "It is difficult to polish"],
    correct: 0,
    explain: "Beveling may result in thin composite in areas of heavy occlusal contact which can fracture."
  },
  {
    q: "Mandibular premolars with two separate faulty pits often require:",
    opts: ["Two separate modified preparations (Snake eyes)", "Connecting the pits into one large Class I", "Class II preparation", "Full coverage crown"],
    correct: 0,
    explain: "They often have two separate faulty occlusal pits located in areas of minimal function, treated as modified designs (snake eyes)."
  },
  {
    q: "For amalgam retention, the texture of the prepared walls should be:",
    opts: ["Smooth", "Rough", "Serrated", "Undercut significantly"],
    correct: 0,
    explain: "For amalgam, the texture should be smooth. For composite, it is not necessarily smooth."
  },
  {
    q: "Removing infected dentin is best accomplished using:",
    opts: ["Spoon excavator or slow-speed round bur", "High-speed diamond bur", "Air-abrasion", "Chisel"],
    correct: 0,
    explain: "Removal is best accomplished using a spoon excavator or a slowly revolving round steel bur."
  },
  {
    q: "When entering or removing the bur from the tooth, it should be:",
    opts: ["Rotating", "Stopped", "Rotating only on entry", "Rotating only on exit"],
    correct: 0,
    explain: "The bur should be rotating when applied and should not stop rotating until removed."
  },
  {
    q: "The tip diameter of a No. 245 bur is:",
    opts: ["0.8 mm", "1.0 mm", "1.2 mm", "0.6 mm"],
    correct: 0,
    explain: "The tip diameter is 0.8mm."
  },
  {
    q: "How many point angles are in a Class I preparation?",
    opts: ["4", "6", "8", "2"],
    correct: 0,
    explain: "There are 4 point angles: Disto-facio-pulpal, Disto-linguo-pulpal, Mesio-linguo-pulpal, Mesio-facio-pulpal."
  },
  {
    q: "Ideally, the desired pulpal depth into dentin is:",
    opts: ["0.1 to 0.2 mm", "0.5 to 1.0 mm", "1.5 to 2.0 mm", "At the DEJ exactly"],
    correct: 0,
    explain: "The desired pulpal depth is usually 0.1 to 0.2 mm into dentin."
  },
  {
    q: "Why should the outline form include smooth sweeping curves?",
    opts: ["To avoid sharp angles that concentrate stress", "To look better", "To match the bur shape", "To reduce cutting time"],
    correct: 0,
    explain: "The outline should be smoothly followed with sweeping curves to avoid sharp angles."
  },
  {
    q: "Which factor governs the outline form?",
    opts: ["Extent of carious tooth structure", "Age of the patient", "Type of bur used", "Patient preference"],
    correct: 0,
    explain: "Carious tooth structure should be completely eliminated, and margins placed in sound structure."
  },
  {
    q: "What is the final step of tooth preparation mentioned?",
    opts: ["Cleaning and inspecting", "Pulp protection", "Finishing walls", "Removing infected dentin"],
    correct: 0,
    explain: "The final procedure is cleaning and inspecting the prepared tooth."
  },
  {
    q: "For a conventional composite preparation, the outline form is:",
    opts: ["Same as amalgam", "Smaller than amalgam", "Larger than amalgam", "Circular"],
    correct: 0,
    explain: "Conventional preparation for composite has an outline form same like amalgam."
  },
  {
    q: "Primary retention form for composite is primarily achieved by:",
    opts: ["Micromechanical bond", "Occlusal convergence", "Retentive grooves", "Dovetails"],
    correct: 0,
    explain: "Composite primary retentive form is micromechanical bond (bonding)."
  }
];

const tfs = [
  {
    q: "Class I preparations are performed on the proximal surfaces of molars.",
    answer: false,
    explain: "Class I involves occlusal surfaces. Proximal surfaces are Class II."
  },
  {
    q: "The No. 245 bur has a head length of 5 mm.",
    answer: false,
    explain: "The No. 245 bur has a head length of 3 mm."
  },
  {
    q: "A flat pulpal floor prevents the rocking motion of the restoration.",
    answer: true,
    explain: "This provides primary resistance form."
  },
  {
    q: "The bur should be stopped before removing it from the tooth preparation.",
    answer: false,
    explain: "The bur should be rotating when applied and removed."
  },
  {
    q: "If the intercuspal distance is 6mm, the isthmus width should be 1.5mm.",
    answer: true,
    explain: "The width should be 1/4 of the intercuspal distance (6 / 4 = 1.5)."
  },
  {
    q: "Occlusal beveling is recommended for Class I composite preparations.",
    answer: false,
    explain: "No occlusal beveling is done; it creates thin material prone to fracture."
  },
  {
    q: "Modified composite preparations require a uniform depth of 1.5mm.",
    answer: false,
    explain: "Modified preps may not be uniform; initial depth is ~0.2mm inside DEJ."
  },
  {
    q: "Amalgam requires a 90-degree cavosurface margin.",
    answer: true,
    explain: "This butt joint is the strongest for amalgam."
  },
  {
    q: "Infected dentin removal is best done with a high-speed fissure bur.",
    answer: false,
    explain: "It is best done with a spoon excavator or slow-speed round bur."
  }
];

const saqs = [
  {
    q: "List the 5 walls of a Class I preparation.",
    a: "<ul><li>Facial wall</li><li>Lingual/Palatal wall</li><li>Mesial wall</li><li>Distal wall</li><li>Pulpal wall (floor)</li></ul>"
  },
  {
    q: "Define the objectives of Class I tooth preparation.",
    a: "<ol><li>Remove all defects (caries).</li><li>Provide necessary protection to the pulp.</li><li>Form the preparation so it withstands masticatory forces without fracture.</li></ol>"
  },
  {
    q: "Compare Amalgam vs. Composite Class I preparation regarding Pulpal Depth and Cavosurface Margin.",
    a: "<table><thead><tr><th>Feature</th><th>Amalgam</th><th>Composite</th></tr></thead><tbody><tr><td><b>Pulpal Depth</b></td><td>Uniform 1.5-2 mm</td><td>Remove fault, not necessary to be uniform</td></tr><tr><td><b>Cavosurface Margin</b></td><td>90 degrees</td><td>More than 90 degrees or same as amalgam (No bevel)</td></tr></tbody></table>"
  },
  {
    q: "CASE SCENARIO: You are excavating a deep carious lesion. You estimate the Remaining Dentin Thickness (RDT) to be 0.8 mm. What is your management step regarding pulp protection?",
    a: "You should place a thin layer (0.5-0.75mm) of a light-cured, resin-modified glass-ionomer (RMGIC) base only over the deepest portion of the excavation."
  },
  {
    q: "List the 4 Point Angles found in a Class I preparation.",
    a: "<ol><li>Disto-facio-pulpal</li><li>Disto-linguo-pulpal</li><li>Mesio-linguo-pulpal</li><li>Mesio-facio-pulpal</li></ol>"
  },
  {
    q: "Explain why the outline form of a Class I preparation should have smooth, sweeping curves rather than sharp angles.",
    a: "Sharp angles lead to <b>stress concentration</b> during occlusion, which can cause fracture of the tooth or the restoration."
  }
];

// ----------- State -----------
const state = {
  mcq: Array(mcqs.length).fill(null), // null | selectedIndex
  tf: Array(tfs.length).fill(null),   // null | boolean
  saq: Array(saqs.length).fill(false) // self-marked
};

function shuffleIndices(n){
  const arr = Array.from({length:n}, (_,i)=>i);
  for(let i=n-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}

// ----------- Render MCQs -----------
const mcqGrid = document.getElementById('mcqGrid');
mcqs.forEach((item, idx)=>{
  // Shuffle options for display
  const map = shuffleIndices(4); 
  const visualToOriginal = map; // map[visualIndex] = originalIndex
  const originalToVisual = Array(4);
  map.forEach((orig, v)=>{ originalToVisual[orig] = v; });
  
  const correctVisualIndex = originalToVisual[item.correct];

  const card = document.createElement('article');
  card.className='card qcard';
  card.dataset.type='mcq';
  card.dataset.index = idx;
  card.dataset.locked = 'false';
  card.innerHTML = `
    <p class="meta">Question ${idx+1} of ${mcqs.length}</p>
    <h3 class="qtitle">${item.q}</h3>
    <div class="opts">
      ${[0,1,2,3].map(v=>`
        <button class="opt-btn" data-v="${v}" aria-label="Answer option ${String.fromCharCode(65+v)}">
          <span class="key">${String.fromCharCode(65+v)}</span>
          <span class="label">${item.opts[ visualToOriginal[v] ]}</span>
        </button>
      `).join('')}
    </div>
    <div class="feedback" hidden></div>
  `;

  const buttons = card.querySelectorAll('.opt-btn');
  const feedback = card.querySelector('.feedback');

  function lock(){
    card.dataset.locked = 'true';
    buttons.forEach(b=>b.setAttribute('disabled',''));
  }

  buttons.forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(card.dataset.locked === 'true') return; 
      const v = Number(btn.dataset.v); // Visual index clicked
      state.mcq[idx] = v;

      buttons.forEach(b=>b.classList.remove('correct','wrong'));

      const correctBtn = buttons[correctVisualIndex];
      correctBtn.classList.add('correct');

      if(v !== correctVisualIndex){
        btn.classList.add('wrong');
        feedback.hidden=false;
        feedback.innerHTML = `<b>Wrong ✖</b><br>Correct answer: <b>${String.fromCharCode(65+correctVisualIndex)}</b><br>${item.explain}`;
      }else{
        feedback.hidden=false;
        feedback.innerHTML = `<b>Correct ✔</b><br>Answer: <b>${String.fromCharCode(65+correctVisualIndex)}</b><br>${item.explain}`;
      }
      lock();
      recalc();
    });
  });

  mcqGrid.appendChild(card);
});

// ----------- Render True/False -----------
const tfGrid = document.getElementById('tfGrid');
tfs.forEach((item, idx)=>{
  const card = document.createElement('article');
  card.className='card qcard';
  card.dataset.type='tf';
  card.dataset.index = idx;
  card.dataset.locked = 'false';
  card.innerHTML = `
    <p class="meta">Statement ${idx+1} of ${tfs.length}</p>
    <h3 class="qtitle">${item.q}</h3>
    <div class="opts">
      <button class="opt-btn" data-v="true">
        <span class="key">T</span><span class="label">True</span>
      </button>
      <button class="opt-btn" data-v="false">
        <span class="key">F</span><span class="label">False</span>
      </button>
    </div>
    <div class="feedback" hidden></div>
  `;

  const buttons = card.querySelectorAll('.opt-btn');
  const feedback = card.querySelector('.feedback');

  function lock(){
    card.dataset.locked = 'true';
    buttons.forEach(b=>b.setAttribute('disabled',''));
  }

  buttons.forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(card.dataset.locked === 'true') return; 
      const val = btn.dataset.v === "true";
      state.tf[idx] = val;

      buttons.forEach(b=>b.classList.remove('correct','wrong'));

      const correctBtn = Array.from(buttons).find(b => (b.dataset.v === (item.answer ? "true" : "false")));
      correctBtn.classList.add('correct');

      const isCorrect = (val === item.answer);
      if(!isCorrect){
        btn.classList.add('wrong');
        feedback.hidden=false;
        feedback.innerHTML = `<b>Wrong ✖</b><br>Correct answer: <b>${item.answer ? 'True' : 'False'}</b><br>${item.explain}`;
      }else{
        feedback.hidden=false;
        feedback.innerHTML = `<b>Correct ✔</b><br>Answer: <b>${item.answer ? 'True' : 'False'}</b><br>${item.explain}`;
      }

      lock();
      recalc();
    });
  });

  tfGrid.appendChild(card);
});

// ----------- Render SAQs -----------
const saqGrid = document.getElementById('saqGrid');
saqs.forEach((item, idx)=>{
  const card = document.createElement('article');
  card.className='card qcard';
  card.dataset.type='saq';
  card.dataset.index = idx;
  card.innerHTML = `
  <p class="meta">Question ${idx + 1} of ${saqs.length}</p>
  <h3 class="qtitle">${item.q}</h3>
  <textarea rows="4" placeholder="Type your answer..." style="width:100%;padding:12px;border-radius:12px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.14);color:var(--text);"></textarea>
  <div class="btnrow" style="margin-top:10px">
    <button class="primary" data-act="reveal">Reveal Answer</button>
    <button class="ghost" data-act="toggle">I was correct</button>
  </div>
  <div class="answer" hidden>${item.a}</div>
`;

  const revealBtn = card.querySelector('[data-act="reveal"]');
  const toggleBtn = card.querySelector('[data-act="toggle"]');
  const answer = card.querySelector('.answer');

  revealBtn.addEventListener('click', ()=>{
    answer.hidden = !answer.hidden;
    revealBtn.textContent = answer.hidden ? "Reveal Answer" : "Hide Answer";
  });

  toggleBtn.addEventListener('click', ()=>{
    const now = !state.saq[idx];
    state.saq[idx] = now;
    toggleBtn.textContent = now ? "✓ Counted as correct" : "I was correct";
    toggleBtn.style.outline = now ? "2px solid rgba(34,197,94,.7)" : "none";
    recalc();
  });

  saqGrid.appendChild(card);
});

// ----------- Score + Reset -----------
function recalc(){
  const mcqScore = state.mcq.reduce((s,v,i)=>{
    if(v===null) return s;
    // To find if it was correct, we check the feedback text or the logic again.
    // The easiest is to check if the visual index chosen matches the correct visual index
    // BUT we didn't save the visual map.
    // Actually, in my code above, I set innerHTML of feedback based on correctness.
    // Let's read the DOM state which is reliable here since we lock cards.
    const card = document.querySelector(`.qcard[data-type="mcq"][data-index="${i}"]`);
    const feedback = card.querySelector('.feedback').textContent;
    return s + (feedback.includes("Correct") ? 1 : 0);
  },0);

  const tfScore = state.tf.reduce((s,v,i)=>{
    if(v===null) return s;
    const card = document.querySelector(`.qcard[data-type="tf"][data-index="${i}"]`);
    const feedback = card.querySelector('.feedback').textContent;
    return s + (feedback.includes("Correct") ? 1 : 0);
  },0);

  const saqScore = state.saq.filter(Boolean).length;
  const total = mcqScore + tfScore + saqScore;

  const ids = ["sMcq","sTf","sSaq","sTotal","sMcq2","sTf2","sSaq2","sTotal2"];
  ids.forEach(id=>{
    const el = document.getElementById(id);
    if(!el) return;
    if(id.includes('Mcq')) el.textContent = mcqScore;
    if(id.includes('Tf')) el.textContent = tfScore;
    if(id.includes('Saq')) el.textContent = saqScore;
    if(id.includes('Total')) el.textContent = total;
  });
}

document.getElementById('resetAll').addEventListener('click', ()=>{
  document.querySelectorAll('.qcard .feedback').forEach(f=>{f.hidden=true; f.textContent=''; f.innerHTML='';});
  document.querySelectorAll('.opt-btn').forEach(b=>{
    b.classList.remove('correct','wrong');
    b.removeAttribute('disabled');
  });
  document.querySelectorAll('.qcard[data-type="mcq"], .qcard[data-type="tf"]').forEach(c=>{c.dataset.locked='false';});
  document.querySelectorAll('.qcard[data-type="saq"] textarea').forEach(t=>t.value="");
  document.querySelectorAll('.qcard[data-type="saq"] .answer').forEach(a=>a.hidden=true);
  document.querySelectorAll('.qcard[data-type="saq"] [data-act="reveal"]').forEach(b=>b.textContent="Reveal Answer");
  document.querySelectorAll('.qcard[data-type="saq"] [data-act="toggle"]').forEach(b=>{b.textContent="I was correct"; b.style.outline="none";});

  state.mcq.fill(null); state.tf.fill(null); state.saq.fill(false);
  recalc();
});

recalc();
</script>
</body>
