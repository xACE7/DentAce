<!DOCTYPE html>
<html lang="en" style="direction:ltr;">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Interactive Exam • Glowing Dark Theme</title>
<meta name="color-scheme" content="dark" />
<style>
  :root{
    --bg:#0b0b12;
    --text:#f6f7fb;
    --muted:#a6afc6;
    --card:rgba(255,255,255,0.05);
    --card-border:rgba(255,255,255,0.12);
    --glass:rgba(255,255,255,0.04);
    --glass-border:rgba(255,255,255,0.10);
    --glow-cyan:#06b6d4;
    --glow-cyan-outer:rgba(6,182,212,0.40);
    --glow-purple:#8b5cf6;
    --glow-purple-outer:rgba(139,92,246,0.35);
    --white-haze:rgba(255,255,255,0.08);
    --white-outer:rgba(255,255,255,0.15);
    --radius:16px;
    --gap:1.25rem;
    --pad:1.5rem;
    --ok:#22c55e;  /* green */
    --bad:#ef4444; /* red */
  }

  *{box-sizing:border-box}
  body{margin:0;font:16px/1.65 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto;color:var(--text);background:var(--bg);min-height:100dvh;}
  .wrap{max-width:1100px;margin:0 auto;padding:24px;}

  .titlebar{
    position: static;z-index:10;
    backdrop-filter:saturate(140%) blur(8px);
    background:linear-gradient(180deg,rgba(11,11,18,0.75),rgba(11,11,18,0.35));
    border-bottom:1px solid var(--glass-border);
  }
  .titlebar .inner{max-width:1100px;margin:0 auto;padding:16px 24px;display:grid;gap:8px;align-items:center;}
  .grad-text{
    font-weight:800;
    letter-spacing:.3px;
    background:linear-gradient(90deg,var(--glow-cyan),var(--glow-purple));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 0 10px var(--glow-cyan-outer), 0 0 14px var(--glow-purple-outer);
  }
  h1.grad-text{font-size:clamp(1.6rem,2vw+1rem,2.6rem);margin:0;text-align:center;}
  .subtitle{margin:0;text-align:center;color:var(--muted);font-size:0.95rem}

  .section-h{
    margin:28px 0 14px;
    padding:12px 16px;
    border-radius:var(--radius);
    background:var(--glass);
    border:1px solid var(--glass-border);
    box-shadow: 0 2px 10px var(--white-haze), 0 0 18px rgba(255,255,255,0.06), 0 0 30px var(--white-outer);
    text-align:center;
    font-weight:750;
    font-size:1.15rem;
  }
  .section-h .grad-text{font-size:1.3rem;}

  .grid{display:grid;gap:var(--gap)}
  @media (min-width:800px){
    .grid.mcq{grid-template-columns:repeat(2,minmax(0,1fr));}
    .grid.tf {grid-template-columns:repeat(3,minmax(0,1fr));}
  }

  /* Cards (no accent on the card itself) */
  .card{
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:var(--radius);
    padding:var(--pad);
    box-shadow: 0 2px 8px var(--white-haze), 0 0 0 1px rgba(255,255,255,0.02), 0 0 24px rgba(255,255,255,0.06);
    position:relative;
  }

  .qtitle{font-weight:650;margin:0 0 12px}
  .meta{color:var(--muted);font-size:0.88rem;margin-bottom:10px}

  .opts{display:grid;gap:10px}
  .opt-btn{
    all:unset;cursor:pointer;display:flex;gap:10px;align-items:center;
    padding:12px 14px;border-radius:12px;
    background:rgba(255,255,255,0.03);
    border:1px solid rgba(255,255,255,0.10);
    transition:transform .06s ease, background .15s ease, border-color .15s ease;
  }
  .opt-btn .key{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-weight:700;
    background:linear-gradient(90deg,var(--glow-cyan),var(--glow-purple));color:#0b0b12;
    box-shadow:0 0 10px var(--glow-cyan-outer),0 0 10px var(--glow-purple-outer) inset;
  }
  .opt-btn:hover{transform:translateY(-1px);border-color:rgba(255,255,255,0.22);}

  /* Accent line ONLY on the chosen/correct answer box, no background highlight */
  .opt-btn.correct{
    border-left:6px solid var(--ok);
    outline:none;
    background:rgba(255,255,255,0.03);
  }
  .opt-btn.wrong{
    border-left:6px solid var(--bad);
    outline:none;
    background:rgba(255,255,255,0.03);
  }
  .opt-btn[disabled]{opacity:.85;cursor:not-allowed;pointer-events:none;}

  .feedback{margin-top:10px;border-radius:12px;padding:10px 12px;border:1px dashed rgba(255,255,255,0.18);background:rgba(255,255,255,0.03);color:var(--muted);}
  .feedback[hidden]{display:none;}
  .feedback b{color:var(--text)}

  .answer{margin-top:10px;padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,0.14);background:rgba(255,255,255,0.04)}
  .answer[hidden]{display:none;}
  .btnrow{display:flex;gap:10px;flex-wrap:wrap}
  .ghost, .primary{
    all:unset;cursor:pointer;border-radius:12px;padding:10px 14px;font-weight:650;border:1px solid rgba(255,255,255,0.18);
    background:rgba(255,255,255,0.03);
  }
  .primary{background:linear-gradient(90deg,var(--glow-cyan),var(--glow-purple));color:#0b0b12;border-color:transparent;}

  .score{
    margin:16px 0;padding:12px 14px;border-radius:14px;
    background:var(--glass);border:1px solid var(--glass-border);box-shadow: 0 2px 10px var(--white-haze), 0 0 18px rgba(255,255,255,0.06), 0 0 30px var(--white-outer);
    display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
  }
  .score .part{color:var(--muted);font-weight:600}
  .score b{color:var(--text)}
</style>
</head>

<body>
  <header class="titlebar">
    <div class="inner">
      <h1 class="grad-text">🦷 Dentistry 3rd year</h1>
      <p class="subtitle">Test based on Lecture 36</p>
    </div>
  </header>

  <main class="wrap">

    <h2 class="section-h"><span class="grad-text">اللَّهُمَّ لا سَهْلَ إِلَّا مَا جَعَلْتَهُ سَهْلًا، وَأَنْتَ تَجْعَلُ الحَزْنَ إِذَا شِئْتَ سَهْلًا</span></h2>

    <section class="score" id="scoreTop">
      <div class="part">MCQs: <b><span id="sMcq">0</span>/30</b></div>
      <div class="part">True/False: <b><span id="sTf">0</span>/9</b></div>
      <div class="part">SAQs: <b><span id="sSaq">0</span>/6</b></div>
      <div class="part">Total: <b><span id="sTotal">0</span>/45</b></div>
      <div class="btnrow">
        <button class="ghost" id="resetAll">Reset</button>
      </div>
    </section>

    <h2 class="section-h"><span class="grad-text">MCQs</span></h2>
    <div class="grid mcq" id="mcqGrid"></div>

    <h2 class="section-h"><span class="grad-text">True / False</span></h2>
    <div class="grid tf" id="tfGrid"></div>

    <h2 class="section-h"><span class="grad-text">Short Answer Questions</span></h2>
    <div class="grid" id="saqGrid"></div>

    <section class="score" id="scoreBottom">
      <div class="part">MCQs: <b><span id="sMcq2">0</span>/30</b></div>
      <div class="part">True/False: <b><span id="sTf2">0</span>/9</b></div>
      <div class="part">SAQs: <b><span id="sSaq2">0</span>/6</b></div>
      <div class="part">Total: <b><span id="sTotal2">0</span>/45</b></div>
    </section>
  </main>

<script>
// ----------- Data (Based on ocih-36.pdf) -----------

const mcqs = [
  {
    q: "Which type of epithelium predominantly covers the gingiva?",
    opts: ["Keratinized stratified squamous", "Non-keratinized stratified squamous", "Pseudostratified columnar", "Simple cuboidal"],
    correct: 0,
    explain: "The gingiva is covered by a masticatory mucosa, which is keratinized (often parakeratinized) stratified squamous epithelium."
  },
  {
    q: "The rete pegs (rete ridges) in the gingiva are histologically described as:",
    opts: ["Long, thin, and sharp", "Short, broad, and box-shaped", "Absent or very shallow", "Irregular and bulbous"],
    correct: 0,
    explain: "Gingival histology shows long, thin, and sharp rete pegs extending into the connective tissue."
  },
  {
    q: "The rete pegs in the Hard Palate are histologically described as:",
    opts: ["Short, numerous, and box-shaped", "Long, thin, and sharp", "Absent entirely", "Widely spaced and pointed"],
    correct: 0,
    explain: "In the hard palate, the epithelial rete pegs are short, numerous, and box-shaped."
  },
  {
    q: "Which layer is completely ABSENT in the gingiva?",
    opts: ["Submucosa", "Lamina Propria", "Stratum Corneum", "Basement Membrane"],
    correct: 0,
    explain: "The gingiva is a mucoperiosteum, meaning the lamina propria attaches directly to the bone without an intervening submucosa."
  },
  {
    q: "The anterolateral zone of the hard palate is also known as the:",
    opts: ["Fatty zone", "Glandular zone", "Gingival zone", "Median Raphe"],
    correct: 0,
    explain: "The anterolateral region of the hard palate submucosa contains adipose tissue, making it the Fatty Zone."
  },
  {
    q: "The posterolateral zone of the hard palate contains which type of tissue in the submucosa?",
    opts: ["Minor salivary glands", "Adipose tissue", "Dense collagen only", "Elastic cartilage"],
    correct: 0,
    explain: "The posterolateral area is the Glandular Zone, containing mucous minor salivary glands."
  },
  {
    q: "Which structure separates the attached gingiva from the alveolar mucosa?",
    opts: ["Mucogingival junction", "Free gingival groove", "Gingival sulcus", "Interdental papilla"],
    correct: 0,
    explain: "The mucogingival junction is the demarcation line between the attached gingiva (masticatory mucosa) and the alveolar mucosa (lining mucosa)."
  },
  {
    q: "The free gingival groove demarcates the free gingiva from the:",
    opts: ["Attached gingiva", "Alveolar mucosa", "Sulcular epithelium", "Junctional epithelium"],
    correct: 0,
    explain: "The free gingival groove is a shallow depression that separates the free (marginal) gingiva from the attached gingiva."
  },
  {
    q: "The lamina propria of the gingiva is primarily composed of:",
    opts: ["Dense bundles of collagen fibers", "Loose areolar tissue", "Adipose tissue", "Elastic fibers only"],
    correct: 0,
    explain: "The lamina propria of the gingiva consists of dense bundles of collagen fibers (gingival fibers) that firmly attach the tissue."
  },
  {
    q: "In the midline of the hard palate (Median Raphe), the submucosa is:",
    opts: ["Absent", "Thick and glandular", "Thick and fatty", "Loosely arranged"],
    correct: 0,
    explain: "In the median raphe and the peripheral gingival zone of the hard palate, the submucosa is absent; the mucosa attaches directly to the bone."
  },
  {
    q: "Which of the following is considered Masticatory Mucosa?",
    opts: ["Gingiva and Hard Palate", "Soft Palate and Alveolar Mucosa", "Floor of Mouth and Cheeks", "Lips and Soft Palate"],
    correct: 0,
    explain: "Masticatory mucosa covers the gingiva and the hard palate, designed to withstand the forces of chewing."
  },
  {
    q: "The epithelium of the attached gingiva is typically:",
    opts: ["Parakeratinized", "Non-keratinized", "Transitional", "Ciliated"],
    correct: 0,
    explain: "The attached gingiva is usually parakeratinized (nuclei retained in the stratum corneum) or orthokeratinized."
  },
  {
    q: "The 'Enamel space' seen in histological sections represents where:",
    opts: ["Enamel was dissolved during decalcification", "Enamel is actively forming", "Dentin meets cementum", "The periodontal ligament attaches"],
    correct: 0,
    explain: "Because enamel is 96% mineral, it is dissolved during the acid decalcification process used to prepare slides, leaving an empty 'enamel space'."
  },
  {
    q: "Which zone of the hard palate has a submucosa filled with mucous glands?",
    opts: ["Posterolateral", "Anterolateral", "Median Raphe", "Gingival border"],
    correct: 0,
    explain: "The posterolateral zone is the glandular zone."
  },
  {
    q: "Which tissue provides the stippled appearance of healthy attached gingiva?",
    opts: ["The interdigitation of rete pegs and connective tissue papillae", "The underlying submucosal fat", "The minor salivary glands", "The smooth surface of the alveolar bone"],
    correct: 0,
    explain: "Stippling is caused by the deep interdigitation of the epithelial rete pegs and the connective tissue papillae of the lamina propria."
  },
  {
    q: "The 'Incissive Papilla' is located:",
    opts: ["Anteriorly on the hard palate midline", "Posteriorly near the soft palate", "Lateral to the molars", "In the floor of the mouth"],
    correct: 0,
    explain: "The incisive papilla is found at the anterior midline of the hard palate, just behind the central incisors."
  },
  {
    q: "The specific epithelium that attaches the gingiva to the tooth surface is called:",
    opts: ["Junctional epithelium", "Sulcular epithelium", "Oral epithelium", "Alveolar epithelium"],
    correct: 0,
    explain: "The junctional epithelium provides the seal and attachment of the gingiva to the tooth enamel or cementum."
  },
  {
    q: "Alveolar mucosa is distinct from gingiva because it is:",
    opts: ["Redder, movable, and non-keratinized", "Paler, firm, and keratinized", "Stippled and immobile", "White and highly keratinized"],
    correct: 0,
    explain: "Alveolar mucosa is lining mucosa: it is non-keratinized, redder (due to thin epithelium and vascularity), and movable."
  },
  {
    q: "The structure labeled 'C' in the histology of gingiva diagram (Slide 7) represents:",
    opts: ["Connective tissue", "Cementum", "Capillary", "Cornified layer"],
    correct: 0,
    explain: "Label C in the provided slide points to the Connective Tissue (Lamina Propria) underlying the epithelium."
  },
  {
    q: "The 'Free Gingival Crest' is the:",
    opts: ["Most coronal margin of the free gingiva", "Deepest point of the sulcus", "Junction with alveolar mucosa", "Connection to the periodontal ligament"],
    correct: 0,
    explain: "The free gingival crest (or gingival margin) is the highest point of the free gingiva surrounding the tooth."
  },
  {
    q: "In the hard palate, the mucosal layer is tightly bound to the periosteum. This structure is called:",
    opts: ["Mucoperiosteum", "Submucosal plexus", "Periodontal ligament", "Basement membrane"],
    correct: 0,
    explain: "When the lamina propria attaches directly to the periosteum without a mobile submucosa (or with a fibrous one), it is called a mucoperiosteum."
  },
  {
    q: "The arrows pointing to 'A' in the gingiva histology slide (Slide 7) identify:",
    opts: ["Orthokeratinized epithelium", "Parakeratinized epithelium", "Non-keratinized epithelium", "Basal cell layer"],
    correct: 0,
    explain: "The slide specifically labels 'A' as Orthokeratinized Epithelium."
  },
  {
    q: "Which zone of the hard palate acts as a cushion due to adipose tissue?",
    opts: ["Fatty zone", "Glandular zone", "Raphe", "Gingival zone"],
    correct: 0,
    explain: "The fatty zone (anterolateral) contains fat cells in the submucosa, acting as a cushion."
  },
  {
    q: "The interdental gingiva (papilla) occupies the:",
    opts: ["Embrasure space between teeth", "Buccal surface of the root", "Lingual surface of the root", "Floor of the sulcus"],
    correct: 0,
    explain: "The interdental papilla fills the interproximal space (embrasure) between two adjacent teeth."
  },
  {
    q: "The histological term 'parakeratinized' implies that surface cells:",
    opts: ["Retain their nuclei", "Have lost their nuclei completely", "Are cuboidal in shape", "Are undergoing mitosis"],
    correct: 0,
    explain: "Parakeratinization means the cells in the superficial keratin layer retain shrunken (pyknotic) nuclei."
  },
  {
    q: "The connective tissue extensions into the epithelium are called:",
    opts: ["Connective tissue papillae", "Rete pegs", "Desmosomes", "Hemidesmosomes"],
    correct: 0,
    explain: "The epithelium has 'rete pegs' projecting down, and the connective tissue has 'papillae' projecting up."
  },
  {
    q: "The distinct vertical band running down the center of the hard palate is the:",
    opts: ["Palatine Raphe", "Palatine Rugae", "Incisive Papilla", "Fovea Palatinae"],
    correct: 0,
    explain: "The median palatine raphe is the midline ridge on the hard palate."
  },
  {
    q: "The 'Gingival Sulcus' is bounded by:",
    opts: ["The tooth surface and the sulcular epithelium", "The tooth surface and the oral epithelium", "The alveolar bone and the cementum", "The free gingiva and attached gingiva"],
    correct: 0,
    explain: "The sulcus is the shallow crevice or space around the tooth, bounded by the tooth on one side and the sulcular epithelium on the other."
  },
  {
    q: "Which region of the oral mucosa has NO submucosa?",
    opts: ["Gingiva", "Soft Palate", "Cheek (Buccal mucosa)", "Floor of mouth"],
    correct: 0,
    explain: "The gingiva and the median raphe of the hard palate lack a submucosa; the mucosa is firmly attached to bone."
  },
  {
    q: "The mucogingival junction is absent on which aspect of the maxilla?",
    opts: ["Palatal aspect", "Buccal aspect", "Labial aspect", "It is present everywhere"],
    correct: 0,
    explain: "On the palate, the attached gingiva merges directly with the masticatory mucosa of the hard palate; there is no alveolar mucosa, so no mucogingival junction."
  }
];

const tfs = [
  {
    q: "The gingiva possesses a distinct submucosa layer containing large blood vessels.",
    answer: false,
    explain: "False. The gingiva lacks a submucosa; the lamina propria attaches directly to the periosteum."
  },
  {
    q: "The epithelial rete pegs in the hard palate are described as long, thin, and widely spaced.",
    answer: false,
    explain: "False. Rete pegs in the hard palate are short, numerous, and box-shaped."
  },
  {
    q: "The anterolateral zone of the hard palate contains adipose tissue in its submucosa.",
    answer: true,
    explain: "True. This area is known as the Fatty Zone."
  },
  {
    q: "The posterolateral zone of the hard palate contains minor salivary glands.",
    answer: true,
    explain: "True. This area is known as the Glandular Zone."
  },
  {
    q: "The median raphe of the hard palate has a thick submucosa allowing for mobility.",
    answer: false,
    explain: "False. The median raphe lacks a submucosa and the tissue is firmly attached to the underlying bone."
  },
  {
    q: "The attached gingiva is bounded coronally by the free gingival groove and apically by the mucogingival junction.",
    answer: true,
    explain: "True. These are the anatomical boundaries of the attached gingiva."
  },
  {
    q: "Alveolar mucosa is classified as masticatory mucosa.",
    answer: false,
    explain: "False. Alveolar mucosa is Lining Mucosa (non-keratinized, movable)."
  },
  {
    q: "The lamina propria of the gingiva contains dense collagen fiber bundles.",
    answer: true,
    explain: "True. These collagen fibers provide the necessary rigidity for mastication."
  },
  {
    q: "The epithelium of the hard palate is keratinized stratified squamous epithelium.",
    answer: true,
    explain: "True. As masticatory mucosa, it is keratinized to resist friction."
  }
];

const saqs = [
  {
    q: "Describe the histological shape and frequency of the rete pegs found in the Hard Palate.",
    a: "The rete pegs in the hard palate are described as **short**, **numerous**, and **box-shaped**."
  },
  {
    q: "List the four zones of the Hard Palate.",
    a: "1. Gingival Zone (Peripheral)<br>2. Median Raphe (Midline)<br>3. Anterolateral Zone (Fatty)<br>4. Posterolateral Zone (Glandular)"
  },
  {
    q: "Compare the submucosa of the Attached Gingiva and the Posterolateral Hard Palate.",
    a: "<b>Attached Gingiva:</b> Submucosa is **absent** (Mucoperiosteum).<br><b>Posterolateral Hard Palate:</b> Submucosa is **present** and contains **mucous glands** (Glandular zone)."
  },
  {
    q: "Define the Mucogingival Junction.",
    a: "The Mucogingival Junction is the scalloped line that separates the **attached gingiva** (keratinized, firm) from the **alveolar mucosa** (non-keratinized, mobile, red)."
  },
  {
    q: "A patient presents with a burn on the roof of their mouth, specifically in the area lateral to the molars (posterior). What specific tissue type is found in the submucosa of this region?",
    a: "This is the **Glandular Zone** (Posterolateral). The submucosa here contains **minor salivary glands**."
  },
  {
    q: "List the two main layers of the Gingiva (excluding the basement membrane).",
    a: "1. Epithelium (Stratified Squamous)<br>2. Connective Tissue (Lamina Propria)"
  }
];

// ----------- State -----------
const state = {
  mcq: Array(mcqs.length).fill(null), // null | selectedIndex
  tf: Array(tfs.length).fill(null),   // null | boolean
  saq: Array(saqs.length).fill(false) // self-marked
};

function shuffleIndices(n){
  const arr = Array.from({length:n}, (_,i)=>i);
  for(let i=n-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}

// ----------- Render MCQs -----------
const mcqGrid = document.getElementById('mcqGrid');
mcqs.forEach((item, idx)=>{
  const map = shuffleIndices(4);
  const visualToOriginal = map;
  const originalToVisual = Array(4);
  map.forEach((orig, v)=>{ originalToVisual[orig] = v; });
  const correctVisualIndex = originalToVisual[item.correct];

  const card = document.createElement('article');
  card.className='card qcard';
  card.dataset.type='mcq';
  card.dataset.index = idx;
  card.dataset.locked = 'false';
  card.innerHTML = `
    <p class="meta">Question ${idx+1} of ${mcqs.length}</p>
    <h3 class="qtitle">${item.q}</h3>
    <div class="opts">
      ${[0,1,2,3].map(v=>`
        <button class="opt-btn" data-v="${v}" aria-label="Answer option ${String.fromCharCode(65+v)}">
          <span class="key">${String.fromCharCode(65+v)}</span>
          <span class="label">${item.opts[ visualToOriginal[v] ]}</span>
        </button>
      `).join('')}
    </div>
    <div class="feedback" hidden></div>
  `;

  const buttons = card.querySelectorAll('.opt-btn');
  const feedback = card.querySelector('.feedback');

  function lock(){
    card.dataset.locked = 'true';
    buttons.forEach(b=>b.setAttribute('disabled',''));
  }

  buttons.forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(card.dataset.locked === 'true') return; // one attempt
      const v = Number(btn.dataset.v);
      state.mcq[idx] = v;

      // clear classes
      buttons.forEach(b=>b.classList.remove('correct','wrong'));

      // Always mark the correct option (green)
      const correctBtn = buttons[correctVisualIndex];
      correctBtn.classList.add('correct');

      if(v !== correctVisualIndex){
        // Mark chosen wrong option (red)
        btn.classList.add('wrong');
        feedback.hidden=false;
        feedback.innerHTML = `<b>Wrong ✖</b><br>Correct answer: <b>${String.fromCharCode(65+correctVisualIndex)}</b><br>${item.explain}`;
      }else{
        feedback.hidden=false;
        feedback.innerHTML = `<b>Correct ✔</b><br>Answer: <b>${String.fromCharCode(65+correctVisualIndex)}</b><br>${item.explain}`;
      }
      lock();
      recalc();
    });
  });

  mcqGrid.appendChild(card);
});

// ----------- Render True/False -----------
const tfGrid = document.getElementById('tfGrid');
tfs.forEach((item, idx)=>{
  const card = document.createElement('article');
  card.className='card qcard';
  card.dataset.type='tf';
  card.dataset.index = idx;
  card.dataset.locked = 'false';
  card.innerHTML = `
    <p class="meta">Statement ${idx+1} of ${tfs.length}</p>
    <h3 class="qtitle">${item.q}</h3>
    <div class="opts">
      <button class="opt-btn" data-v="true">
        <span class="key">T</span><span class="label">True</span>
      </button>
      <button class="opt-btn" data-v="false">
        <span class="key">F</span><span class="label">False</span>
      </button>
    </div>
    <div class="feedback" hidden></div>
  `;

  const buttons = card.querySelectorAll('.opt-btn');
  const feedback = card.querySelector('.feedback');

  function lock(){
    card.dataset.locked = 'true';
    buttons.forEach(b=>b.setAttribute('disabled',''));
  }

  buttons.forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(card.dataset.locked === 'true') return; // one attempt
      const val = btn.dataset.v === "true";
      state.tf[idx] = val;

      // clear classes
      buttons.forEach(b=>b.classList.remove('correct','wrong'));

      // Always mark the correct button (green)
      const correctBtn = Array.from(buttons).find(b => (b.dataset.v === (item.answer ? "true" : "false")));
      correctBtn.classList.add('correct');

      const isCorrect = (val === item.answer);
      if(!isCorrect){
        // mark chosen wrong (red)
        btn.classList.add('wrong');
        feedback.hidden=false;
        feedback.innerHTML = `<b>Wrong ✖</b><br>Correct answer: <b>${item.answer ? 'True' : 'False'}</b><br>${item.explain}`;
      }else{
        feedback.hidden=false;
        feedback.innerHTML = `<b>Correct ✔</b><br>Answer: <b>${item.answer ? 'True' : 'False'}</b><br>${item.explain}`;
      }

      lock();
      recalc();
    });
  });

  tfGrid.appendChild(card);
});

// ----------- Render SAQs -----------
const saqGrid = document.getElementById('saqGrid');
saqs.forEach((item, idx)=>{
  const card = document.createElement('article');
  card.className='card qcard';
  card.dataset.type='saq';
  card.dataset.index = idx;
  card.innerHTML = `
  <p class="meta">Question ${idx + 1} of ${saqs.length}</p>
  <h3 class="qtitle">${item.q}</h3>
  <textarea rows="4" placeholder="Type your answer..." style="width:100%;padding:12px;border-radius:12px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.14);color:var(--text);"></textarea>
  <div class="btnrow" style="margin-top:10px">
    <button class="primary" data-act="reveal">Reveal Answer</button>
    <button class="ghost" data-act="toggle">I was correct</button>
  </div>
  <div class="answer" hidden>${item.a}</div>
`;


  const revealBtn = card.querySelector('[data-act="reveal"]');
  const toggleBtn = card.querySelector('[data-act="toggle"]');
  const answer = card.querySelector('.answer');

  revealBtn.addEventListener('click', ()=>{
    answer.hidden = !answer.hidden;
    revealBtn.textContent = answer.hidden ? "Reveal Answer" : "Hide Answer";
  });

  toggleBtn.addEventListener('click', ()=>{
    const now = !state.saq[idx];
    state.saq[idx] = now;
    toggleBtn.textContent = now ? "✓ Counted as correct" : "I was correct";
    toggleBtn.style.outline = now ? "2px solid rgba(34,197,94,.7)" : "none";
    recalc();
  });

  saqGrid.appendChild(card);
});

// ----------- Score + Reset -----------
function recalc(){
  const mcqScore = state.mcq.reduce((s,v,i)=>{
    if(v===null) return s;
    const card = document.querySelector(`.qcard[data-type="mcq"][data-index="${i}"]`);
    const feedback = card.querySelector('.feedback').textContent;
    return s + (feedback.startsWith("Correct") ? 1 : 0);
  },0);
  const tfScore = state.tf.reduce((s,v,i)=>{
    if(v===null) return s;
    const card = document.querySelector(`.qcard[data-type="tf"][data-index="${i}"]`);
    const feedback = card.querySelector('.feedback').textContent;
    return s + (feedback.startsWith("Correct") ? 1 : 0);
  },0);
  const saqScore = state.saq.filter(Boolean).length;
  const total = mcqScore + tfScore + saqScore;

  const ids = ["sMcq","sTf","sSaq","sTotal","sMcq2","sTf2","sSaq2","sTotal2"];
  ids.forEach(id=>{
    const el = document.getElementById(id);
    if(!el) return;
    if(id.includes('Mcq')) el.textContent = mcqScore;
    if(id.includes('Tf')) el.textContent = tfScore;
    if(id.includes('Saq')) el.textContent = saqScore;
    if(id.includes('Total')) el.textContent = total;
  });
}

document.getElementById('resetAll').addEventListener('click', ()=>{
  document.querySelectorAll('.qcard .feedback').forEach(f=>{f.hidden=true; f.textContent=''; f.innerHTML='';});
  document.querySelectorAll('.opt-btn').forEach(b=>{
    b.classList.remove('correct','wrong');
    b.removeAttribute('disabled');
  });
  document.querySelectorAll('.qcard[data-type="mcq"], .qcard[data-type="tf"]').forEach(c=>{c.dataset.locked='false';});
  document.querySelectorAll('.qcard[data-type="saq"] textarea').forEach(t=>t.value="");
  document.querySelectorAll('.qcard[data-type="saq"] .answer').forEach(a=>a.hidden=true);
  document.querySelectorAll('.qcard[data-type="saq"] [data-act="reveal"]').forEach(b=>b.textContent="Reveal Answer");
  document.querySelectorAll('.qcard[data-type="saq"] [data-act="toggle"]').forEach(b=>{b.textContent="I was correct"; b.style.outline="none";});

  state.mcq.fill(null); state.tf.fill(null); state.saq.fill(false);
  recalc();
});

recalc();
</script>
</body>
