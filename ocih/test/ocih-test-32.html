<!DOCTYPE html>
<html lang="en" style="direction:ltr;">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Interactive Exam • Glowing Dark Theme</title>
<meta name="color-scheme" content="dark" />
<style>
  :root{
    --bg:#0b0b12;
    --text:#f6f7fb;
    --muted:#a6afc6;
    --card:rgba(255,255,255,0.05);
    --card-border:rgba(255,255,255,0.12);
    --glass:rgba(255,255,255,0.04);
    --glass-border:rgba(255,255,255,0.10);
    --glow-cyan:#06b6d4;
    --glow-cyan-outer:rgba(6,182,212,0.40);
    --glow-purple:#8b5cf6;
    --glow-purple-outer:rgba(139,92,246,0.35);
    --white-haze:rgba(255,255,255,0.08);
    --white-outer:rgba(255,255,255,0.15);
    --radius:16px;
    --gap:1.25rem;
    --pad:1.5rem;
    --ok:#22c55e;  /* green */
    --bad:#ef4444; /* red */
  }

  *{box-sizing:border-box}
  body{margin:0;font:16px/1.65 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto;color:var(--text);background:var(--bg);min-height:100dvh;}
  .wrap{max-width:1100px;margin:0 auto;padding:24px;}

  .titlebar{
    position: static;z-index:10;
    backdrop-filter:saturate(140%) blur(8px);
    background:linear-gradient(180deg,rgba(11,11,18,0.75),rgba(11,11,18,0.35));
    border-bottom:1px solid var(--glass-border);
  }
  .titlebar .inner{max-width:1100px;margin:0 auto;padding:16px 24px;display:grid;gap:8px;align-items:center;}
  .grad-text{
    font-weight:800;
    letter-spacing:.3px;
    background:linear-gradient(90deg,var(--glow-cyan),var(--glow-purple));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 0 10px var(--glow-cyan-outer), 0 0 14px var(--glow-purple-outer);
  }
  h1.grad-text{font-size:clamp(1.6rem,2vw+1rem,2.6rem);margin:0;text-align:center;}
  .subtitle{margin:0;text-align:center;color:var(--muted);font-size:0.95rem}

  .section-h{
    margin:28px 0 14px;
    padding:12px 16px;
    border-radius:var(--radius);
    background:var(--glass);
    border:1px solid var(--glass-border);
    box-shadow: 0 2px 10px var(--white-haze), 0 0 18px rgba(255,255,255,0.06), 0 0 30px var(--white-outer);
    text-align:center;
    font-weight:750;
    font-size:1.15rem;
  }
  .section-h .grad-text{font-size:1.3rem;}

  .grid{display:grid;gap:var(--gap)}
  @media (min-width:800px){
    .grid.mcq{grid-template-columns:repeat(2,minmax(0,1fr));}
    .grid.tf {grid-template-columns:repeat(3,minmax(0,1fr));}
  }

  /* Cards (no accent on the card itself) */
  .card{
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:var(--radius);
    padding:var(--pad);
    box-shadow: 0 2px 8px var(--white-haze), 0 0 0 1px rgba(255,255,255,0.02), 0 0 24px rgba(255,255,255,0.06);
    position:relative;
  }

  .qtitle{font-weight:650;margin:0 0 12px}
  .meta{color:var(--muted);font-size:0.88rem;margin-bottom:10px}

  .opts{display:grid;gap:10px}
  .opt-btn{
    all:unset;cursor:pointer;display:flex;gap:10px;align-items:center;
    padding:12px 14px;border-radius:12px;
    background:rgba(255,255,255,0.03);
    border:1px solid rgba(255,255,255,0.10);
    transition:transform .06s ease, background .15s ease, border-color .15s ease;
  }
  .opt-btn .key{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-weight:700;
    background:linear-gradient(90deg,var(--glow-cyan),var(--glow-purple));color:#0b0b12;
    box-shadow:0 0 10px var(--glow-cyan-outer),0 0 10px var(--glow-purple-outer) inset;
  }
  .opt-btn:hover{transform:translateY(-1px);border-color:rgba(255,255,255,0.22);}

  /* Accent line ONLY on the chosen/correct answer box, no background highlight */
  .opt-btn.correct{
    border-left:6px solid var(--ok);
    outline:none;
    background:rgba(255,255,255,0.03);
  }
  .opt-btn.wrong{
    border-left:6px solid var(--bad);
    outline:none;
    background:rgba(255,255,255,0.03);
  }
  .opt-btn[disabled]{opacity:.85;cursor:not-allowed;pointer-events:none;}

  .feedback{margin-top:10px;border-radius:12px;padding:10px 12px;border:1px dashed rgba(255,255,255,0.18);background:rgba(255,255,255,0.03);color:var(--muted);}
  .feedback[hidden]{display:none;}
  .feedback b{color:var(--text)}

  .answer{margin-top:10px;padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,0.14);background:rgba(255,255,255,0.04)}
  .answer[hidden]{display:none;}
  .btnrow{display:flex;gap:10px;flex-wrap:wrap}
  .ghost, .primary{
    all:unset;cursor:pointer;border-radius:12px;padding:10px 14px;font-weight:650;border:1px solid rgba(255,255,255,0.18);
    background:rgba(255,255,255,0.03);
  }
  .primary{background:linear-gradient(90deg,var(--glow-cyan),var(--glow-purple));color:#0b0b12;border-color:transparent;}

  .score{
    margin:16px 0;padding:12px 14px;border-radius:14px;
    background:var(--glass);border:1px solid var(--glass-border);box-shadow: 0 2px 10px var(--white-haze), 0 0 18px rgba(255,255,255,0.06), 0 0 30px var(--white-outer);
    display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
  }
  .score .part{color:var(--muted);font-weight:600}
  .score b{color:var(--text)}
</style>
</head>

<script>
// ----------- Data (Lecture 32: Oral Mucosa - Lining Mucosa) -----------
const mcqs = [
  {
    q: "Which of the following is classified as 'Lining Mucosa' that is firmly attached?",
    opts: [
      "Inferior surface of the tongue",
      "Dorsal surface of the tongue",
      "Gingiva",
      "Hard Palate"
    ],
    correct: 0,
    explain: "Lining mucosa classified as firmly attached includes the Soft Palate, Lip, Cheek, and the Inferior (Ventral) surface of the tongue."
  },
  {
    q: "The epithelium of the alveolar mucosa is best described as:",
    opts: [
      "Thin, non-keratinized stratified squamous",
      "Thick, orthokeratinized stratified squamous",
      "Thick, parakeratinized stratified squamous",
      "Pseudostratified ciliated columnar"
    ],
    correct: 0,
    explain: "Alveolar mucosa is covered by a thin, non-keratinized epithelium with few or missing rete pegs."
  },
  {
    q: "Which structure marks the junction between the attached gingiva and the alveolar mucosa?",
    opts: [
      "Mucogingival junction",
      "Free gingival groove",
      "Vibrating line",
      "Vermilion border"
    ],
    correct: 0,
    explain: "The mucogingival junction is the demarcation between the pale pink attached gingiva and the deep red alveolar mucosa."
  },
  {
    q: "In the histological structure of the alveolar mucosa, the submucosa contains:",
    opts: [
      "Minor mixed salivary glands and many thick elastic fibers",
      "Only dense collagen fibers without glands",
      "Purely mucous glands and no elastic fibers",
      "Large lymphoid aggregates (Tonsils)"
    ],
    correct: 0,
    explain: "The submucosa of the alveolar mucosa contains minor mixed salivary glands and many thick elastic fibers, contributing to its mobility."
  },
  {
    q: "The vestibular fornix is bound medially by:",
    opts: [
      "Alveolar mucosa",
      "Mucosa of the lips",
      "Mucosa of the cheeks",
      "Hard palate"
    ],
    correct: 0,
    explain: "The vestibular fornix is bound facially by the mucosa of the lips and cheeks, and orally (medially) by the alveolar mucosa."
  },
  {
    q: "Which muscle forms the primary base of the floor of the mouth?",
    opts: [
      "Mylohyoid muscle",
      "Buccinator muscle",
      "Orbicularis oris muscle",
      "Masseter muscle"
    ],
    correct: 0,
    explain: "The floor of the mouth is formed primarily by the mylohyoid and geniohyoid muscles."
  },
  {
    q: "The sublingual caruncle contains the opening for the duct of which gland?",
    opts: [
      "Submandibular gland",
      "Parotid gland",
      "Sublingual gland only",
      "Minor labial glands"
    ],
    correct: 0,
    explain: "The sublingual caruncle is a small papilla that houses the opening of the duct of the submandibular gland."
  },
  {
    q: "The buccal mucosa is firmly attached to which underlying muscle?",
    opts: [
      "Buccinator",
      "Orbicularis oris",
      "Masseter",
      "Mylohyoid"
    ],
    correct: 0,
    explain: "The buccal mucosa (lining of the cheek) is attached to the buccinator muscle."
  },
  {
    q: "Stensen’s duct (Parotid duct) opens into the buccal mucosa opposite the:",
    opts: [
      "Maxillary 2nd molar",
      "Maxillary 1st premolar",
      "Mandibular 2nd molar",
      "Mandibular 1st molar"
    ],
    correct: 0,
    explain: "The parotid papilla and orifice of Stensen's duct are located opposite the crown of the 2nd maxillary molar."
  },
  {
    q: "Which histological feature is characteristic of the submucosa of the cheek?",
    opts: [
      "It contains fat cells and lobules of minor salivary glands",
      "It is completely absent",
      "It consists solely of dense irregular connective tissue",
      "It contains the deep lingual vein"
    ],
    correct: 0,
    explain: "The submucosa of the cheek is unique for containing fat cells along with minor mixed salivary glands and muscle fibers."
  },
  {
    q: "The vermilion border represents the junction between:",
    opts: [
      "The skin of the lip and the labial mucosa",
      "The hard palate and the soft palate",
      "The alveolar mucosa and the gingiva",
      "The floor of the mouth and the tongue"
    ],
    correct: 0,
    explain: "The vermilion border is the mucocutaneous junction between the skin side of the lip and the red portion (mucous side)."
  },
  {
    q: "The epithelium of the labial mucosa is:",
    opts: [
      "Thick, non-keratinized stratified squamous",
      "Thin, keratinized stratified squamous",
      "Pseudostratified columnar",
      "Simple squamous"
    ],
    correct: 0,
    explain: "Labial mucosa has a thick, non-keratinized stratified squamous epithelium."
  },
  {
    q: "The ventral surface of the tongue is characterized by:",
    opts: [
      "Absence of a distinct submucosa",
      "Thick keratinized epithelium",
      "Presence of specialized gustatory papillae",
      "Loose attachment to underlying structures"
    ],
    correct: 0,
    explain: "The ventral surface of the tongue has no distinct layer of submucosa as the lamina propria merges directly with the muscle fibers."
  },
  {
    q: "The junction between the hard and soft palate is known as the:",
    opts: [
      "Vibrating line",
      "Linea alba",
      "Mucogingival junction",
      "Sulcus terminalis"
    ],
    correct: 0,
    explain: "The vibrating line marks the junction between the immovable hard palate and the movable soft palate."
  },
  {
    q: "Which of the following is a histological feature of the soft palate's lamina propria?",
    opts: [
      "A distinct elastic layer",
      "Direct attachment to periosteum",
      "Absence of blood vessels",
      "Very long, thin rete pegs"
    ],
    correct: 0,
    explain: "The lamina propria of the soft palate is thick, highly vascular, and contains a distinct layer of elastic fibers."
  },
  {
    q: "The downward projections of the epithelium into the underlying connective tissue are called:",
    opts: [
      "Rete pegs (ridges)",
      "Connective tissue papillae",
      "Desmosomes",
      "Basement membranes"
    ],
    correct: 0,
    explain: "Rete pegs (or ridges) are the epithelial extensions that project into the underlying connective tissue."
  },
  {
    q: "Which type of mucosa is found on the floor of the mouth?",
    opts: [
      "Loosely attached lining mucosa",
      "Firmly attached lining mucosa",
      "Masticatory mucosa",
      "Specialized mucosa"
    ],
    correct: 0,
    explain: "The floor of the mouth is covered by loosely attached lining mucosa to allow for the mobility of the tongue."
  },
  {
    q: "The alveolar mucosa appears deep red in color primarily because:",
    opts: [
      "It has extensive vascular supply and thin epithelium",
      "It is highly keratinized",
      "It contains abundant melanin pigment",
      "It has a very thick epithelium masking the vessels"
    ],
    correct: 0,
    explain: "The deep red color is due to the extensive vascularity of the connective tissue and the thin, non-keratinized nature of the overlying epithelium."
  },
  {
    q: "What type of salivary glands are found in the submucosa of the labial mucosa?",
    opts: [
      "Minor mixed salivary glands",
      "Purely serous glands",
      "The sublingual gland",
      "The parotid gland"
    ],
    correct: 0,
    explain: "The submucosa of the lip (labial mucosa) contains minor mixed salivary glands."
  },
  {
    q: "Unlike the hard palate, the soft palate lacks:",
    opts: [
      "A bony framework",
      "A lamina propria",
      "An epithelial layer",
      "Vascular supply"
    ],
    correct: 0,
    explain: "The soft palate is a soft tissue structure constituting the back of the roof of the mouth and does not contain bone."
  },
  {
    q: "The connective tissue papillae in the alveolar mucosa are usually:",
    opts: [
      "Short or sometimes missing",
      "Long and narrow",
      "Deeply interdigitating",
      "Always bifurcated"
    ],
    correct: 0,
    explain: "In alveolar mucosa, the connective tissue papillae are irregular, blunt, short, or sometimes missing."
  },
  {
    q: "Which structure attaches the tongue to the floor of the mouth?",
    opts: [
      "Lingual frenulum",
      "Labial frenulum",
      "Buccal frenulum",
      "Pterygomandibular raphe"
    ],
    correct: 0,
    explain: "The lingual frenulum is the mucosal fold that connects the tongue to the floor of the oral cavity."
  },
  {
    q: "The sublingual fold (plica sublingualis) is produced by:",
    opts: [
      "The underlying sublingual gland",
      "The submandibular duct",
      "The lingual nerve",
      "The genioglossus muscle"
    ],
    correct: 0,
    explain: "The rounded ridge known as the sublingual fold is produced by the underlying sublingual gland."
  },
  {
    q: "Elastic fibers in the lamina propria of the buccal mucosa serve to:",
    opts: [
      "Prevent folding of the mucosa during function",
      "Keratinize the epithelium",
      "Anchor teeth to the bone",
      "Produce saliva"
    ],
    correct: 0,
    explain: "Elastic fibers in the cheek mucosa prevent plication (folding) and injury of the mucosa during chewing."
  },
  {
    q: "Histologically, the ventral surface of the tongue has epithelium with:",
    opts: [
      "A 'saw-teeth' appearance of ridges",
      "A thick keratin layer",
      "No rete pegs at all",
      "Taste buds"
    ],
    correct: 0,
    explain: "The epithelium of the ventral surface of the tongue is described as having a 'saw-teeth' appearance of epithelial ridges."
  },
  {
    q: "The loose areolar tissue in the vestibular fornix allows for:",
    opts: [
      "Free mobility of lips and cheeks",
      "Rigid support for dentures",
      "Masticatory forces",
      "Taste sensation"
    ],
    correct: 0,
    explain: "The large amount of loose areolar tissue in the submucosa permits the necessary mobility of the lips and cheeks."
  },
  {
    q: "The dermis of the skin is equivalent to which layer in the oral mucous membrane?",
    opts: [
      "Lamina Propria",
      "Submucosa",
      "Surface Epithelium",
      "Periosteum"
    ],
    correct: 0,
    explain: "The lamina propria in the mucous membrane is the connective tissue equivalent to the dermis in the skin."
  },
  {
    q: "The labial mucosa is firmly attached to:",
    opts: [
      "The orbicularis oris muscle",
      "The alveolar bone",
      "The masseter muscle",
      "The hard palate"
    ],
    correct: 0,
    explain: "The labial mucosa is firmly attached to the underlying orbicularis oris muscle."
  },
  {
    q: "Deep lingual veins are visible through the mucosa of:",
    opts: [
      "The ventral surface of the tongue",
      "The dorsal surface of the tongue",
      "The hard palate",
      "The attached gingiva"
    ],
    correct: 0,
    explain: "Deep lingual veins are visible through the thin, non-keratinized epithelium of the ventral (inferior) surface of the tongue."
  },
  {
    q: "Which of the following constitutes the posterior part of the roof of the mouth?",
    opts: [
      "Soft palate",
      "Hard palate",
      "Floor of the mouth",
      "Vestibular fornix"
    ],
    correct: 0,
    explain: "The palate consists of an anterior hard palate and a posterior soft palate."
  }
];

const tfs = [
  {
    q: "Lining mucosa is generally keratinized to withstand masticatory forces.",
    answer: false,
    explain: "Lining mucosa is non-keratinized; masticatory mucosa is keratinized."
  },
  {
    q: "The alveolar mucosa is firmly attached to the periosteum of the alveolar bone.",
    answer: false,
    explain: "Alveolar mucosa is loosely attached; attached gingiva is firmly attached."
  },
  {
    q: "The ventral surface of the tongue possesses a distinct, thick submucosa containing fat cells.",
    answer: false,
    explain: "The ventral surface of the tongue has no distinct submucosa; the lamina propria merges with the muscle."
  },
  {
    q: "The soft palate contains a bony framework similar to the hard palate.",
    answer: false,
    explain: "The soft palate does not contain a bony framework; it is a muscular/soft tissue structure."
  },
  {
    q: "The submucosa of the cheek contains fat cells and minor salivary glands.",
    answer: true,
    explain: "This is a characteristic feature of the buccal submucosa."
  },
  {
    q: "The floor of the mouth is covered by loosely attached lining mucosa.",
    answer: true,
    explain: "It is loosely attached to allow for the free movement of the tongue."
  },
  {
    q: "Attached gingiva is typically deeper red in color compared to the alveolar mucosa.",
    answer: false,
    explain: "Alveolar mucosa is deep red; attached gingiva is pale pink."
  },
  {
    q: "The epithelium of the vestibular fornix is thin and non-keratinized.",
    answer: true,
    explain: "As part of the lining mucosa, it is thin and non-keratinized."
  },
  {
    q: "The soft palate is firmly attached to the underlying muscles.",
    answer: true,
    explain: "It is classified as firmly attached lining mucosa covering the muscles."
  }
];

const saqs = [
  {
    q: "List the three layers that generally constitute the oral mucous membrane structure.",
    a: "1. Surface Epithelium<br>2. Underlying connective tissue (Lamina Propria)<br>3. Submucosa"
  },
  {
    q: "Compare Alveolar Mucosa and Attached Gingiva regarding <b>Color</b> and <b>Attachment</b>.",
    a: "<table border='1' style='width:100%; border-collapse:collapse; margin-top:5px; color:var(--text);'><tr><th>Feature</th><th>Alveolar Mucosa</th><th>Attached Gingiva</th></tr><tr><td>Color</td><td>Deep Red</td><td>Pale Pink</td></tr><tr><td>Attachment</td><td>Loosely attached (Mobile)</td><td>Firmly attached (Immobile)</td></tr></table>"
  },
  {
    q: "A patient presents with inflammation near the 'Vibrating Line'. Define this anatomical landmark.",
    a: "The vibrating line is the junction between the hard palate (immovable) and the soft palate (movable)."
  },
  {
    q: "Describe the specific histological appearance of the epithelium of the <b>Ventral Surface of the Tongue</b>.",
    a: "It is a thin, non-keratinized stratified squamous epithelium. The epithelial ridges (rete pegs) typically show a 'saw-teeth' appearance."
  },
  {
    q: "List three examples of <b>Firmly Attached</b> lining mucosa.",
    a: "1. Soft Palate<br>2. Lip (Labial Mucosa)<br>3. Cheek (Buccal Mucosa)<br>4. Ventral surface of the tongue"
  },
  {
    q: "A clinical exam reveals a small papilla on the floor of the mouth near the midline. What is this structure and what duct opens there?",
    a: "<b>Structure:</b> Sublingual caruncle.<br><b>Duct:</b> Submandibular duct (Wharton's duct)."
  }
];

// ----------- State -----------
const state = {
  mcq: Array(mcqs.length).fill(null), // null | selectedIndex
  tf: Array(tfs.length).fill(null),   // null | boolean
  saq: Array(saqs.length).fill(false) // self-marked
};

function shuffleIndices(n){
  const arr = Array.from({length:n}, (_,i)=>i);
  for(let i=n-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}

// ----------- Render MCQs -----------
const mcqGrid = document.getElementById('mcqGrid');
mcqs.forEach((item, idx)=>{
  const map = shuffleIndices(4);
  const visualToOriginal = map;
  const originalToVisual = Array(4);
  map.forEach((orig, v)=>{ originalToVisual[orig] = v; });
  const correctVisualIndex = originalToVisual[item.correct];

  const card = document.createElement('article');
  card.className='card qcard';
  card.dataset.type='mcq';
  card.dataset.index = idx;
  card.dataset.locked = 'false';
  card.innerHTML = `
    <p class="meta">Question ${idx+1} of ${mcqs.length}</p>
    <h3 class="qtitle">${item.q}</h3>
    <div class="opts">
      ${[0,1,2,3].map(v=>`
        <button class="opt-btn" data-v="${v}" aria-label="Answer option ${String.fromCharCode(65+v)}">
          <span class="key">${String.fromCharCode(65+v)}</span>
          <span class="label">${item.opts[ visualToOriginal[v] ]}</span>
        </button>
      `).join('')}
    </div>
    <div class="feedback" hidden></div>
  `;

  const buttons = card.querySelectorAll('.opt-btn');
  const feedback = card.querySelector('.feedback');

  function lock(){
    card.dataset.locked = 'true';
    buttons.forEach(b=>b.setAttribute('disabled',''));
  }

  buttons.forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(card.dataset.locked === 'true') return; // one attempt
      const v = Number(btn.dataset.v);
      state.mcq[idx] = v;

      // clear classes
      buttons.forEach(b=>b.classList.remove('correct','wrong'));

      // Always mark the correct option (green)
      const correctBtn = buttons[correctVisualIndex];
      correctBtn.classList.add('correct');

      if(v !== correctVisualIndex){
        // Mark chosen wrong option (red)
        btn.classList.add('wrong');
        feedback.hidden=false;
        feedback.innerHTML = `<b>Wrong ✖</b><br>Correct answer: <b>${String.fromCharCode(65+correctVisualIndex)}</b><br>${item.explain}`;
      }else{
        feedback.hidden=false;
        feedback.innerHTML = `<b>Correct ✔</b><br>Answer: <b>${String.fromCharCode(65+correctVisualIndex)}</b><br>${item.explain}`;
      }
      lock();
      recalc();
    });
  });

  mcqGrid.appendChild(card);
});

// ----------- Render True/False -----------
const tfGrid = document.getElementById('tfGrid');
tfs.forEach((item, idx)=>{
  const card = document.createElement('article');
  card.className='card qcard';
  card.dataset.type='tf';
  card.dataset.index = idx;
  card.dataset.locked = 'false';
  card.innerHTML = `
    <p class="meta">Statement ${idx+1} of ${tfs.length}</p>
    <h3 class="qtitle">${item.q}</h3>
    <div class="opts">
      <button class="opt-btn" data-v="true">
        <span class="key">T</span><span class="label">True</span>
      </button>
      <button class="opt-btn" data-v="false">
        <span class="key">F</span><span class="label">False</span>
      </button>
    </div>
    <div class="feedback" hidden></div>
  `;

  const buttons = card.querySelectorAll('.opt-btn');
  const feedback = card.querySelector('.feedback');

  function lock(){
    card.dataset.locked = 'true';
    buttons.forEach(b=>b.setAttribute('disabled',''));
  }

  buttons.forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(card.dataset.locked === 'true') return; // one attempt
      const val = btn.dataset.v === "true";
      state.tf[idx] = val;

      // clear classes
      buttons.forEach(b=>b.classList.remove('correct','wrong'));

      // Always mark the correct button (green)
      const correctBtn = Array.from(buttons).find(b => (b.dataset.v === (item.answer ? "true" : "false")));
      correctBtn.classList.add('correct');

      const isCorrect = (val === item.answer);
      if(!isCorrect){
        // mark chosen wrong (red)
        btn.classList.add('wrong');
        feedback.hidden=false;
        feedback.innerHTML = `<b>Wrong ✖</b><br>Correct answer: <b>${item.answer ? 'True' : 'False'}</b><br>${item.explain}`;
      }else{
        feedback.hidden=false;
        feedback.innerHTML = `<b>Correct ✔</b><br>Answer: <b>${item.answer ? 'True' : 'False'}</b><br>${item.explain}`;
      }

      lock();
      recalc();
    });
  });

  tfGrid.appendChild(card);
});

// ----------- Render SAQs -----------
const saqGrid = document.getElementById('saqGrid');
saqs.forEach((item, idx)=>{
  const card = document.createElement('article');
  card.className='card qcard';
  card.dataset.type='saq';
  card.dataset.index = idx;
  card.innerHTML = `
  <p class="meta">Question ${idx + 1} of ${saqs.length}</p>
  <h3 class="qtitle">${item.q}</h3>
  <textarea rows="4" placeholder="Type your answer..." style="width:100%;padding:12px;border-radius:12px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.14);color:var(--text);"></textarea>
  <div class="btnrow" style="margin-top:10px">
    <button class="primary" data-act="reveal">Reveal Answer</button>
    <button class="ghost" data-act="toggle">I was correct</button>
  </div>
  <div class="answer" hidden>${item.a}</div>
`;


  const revealBtn = card.querySelector('[data-act="reveal"]');
  const toggleBtn = card.querySelector('[data-act="toggle"]');
  const answer = card.querySelector('.answer');

  revealBtn.addEventListener('click', ()=>{
    answer.hidden = !answer.hidden;
    revealBtn.textContent = answer.hidden ? "Reveal Answer" : "Hide Answer";
  });

  toggleBtn.addEventListener('click', ()=>{
    const now = !state.saq[idx];
    state.saq[idx] = now;
    toggleBtn.textContent = now ? "✓ Counted as correct" : "I was correct";
    toggleBtn.style.outline = now ? "2px solid rgba(34,197,94,.7)" : "none";
    recalc();
  });

  saqGrid.appendChild(card);
});

// ----------- Score + Reset -----------
function recalc(){
  const mcqScore = state.mcq.reduce((s,v,i)=>{
    if(v===null) return s;
    const card = document.querySelector(`.qcard[data-type="mcq"][data-index="${i}"]`);
    const feedback = card.querySelector('.feedback').textContent;
    return s + (feedback.startsWith("Correct") ? 1 : 0);
  },0);
  const tfScore = state.tf.reduce((s,v,i)=>{
    if(v===null) return s;
    const card = document.querySelector(`.qcard[data-type="tf"][data-index="${i}"]`);
    const feedback = card.querySelector('.feedback').textContent;
    return s + (feedback.startsWith("Correct") ? 1 : 0);
  },0);
  const saqScore = state.saq.filter(Boolean).length;
  const total = mcqScore + tfScore + saqScore;

  const ids = ["sMcq","sTf","sSaq","sTotal","sMcq2","sTf2","sSaq2","sTotal2"];
  ids.forEach(id=>{
    const el = document.getElementById(id);
    if(!el) return;
    if(id.includes('Mcq')) el.textContent = mcqScore;
    if(id.includes('Tf')) el.textContent = tfScore;
    if(id.includes('Saq')) el.textContent = saqScore;
    if(id.includes('Total')) el.textContent = total;
  });
}

document.getElementById('resetAll').addEventListener('click', ()=>{
  document.querySelectorAll('.qcard .feedback').forEach(f=>{f.hidden=true; f.textContent=''; f.innerHTML='';});
  document.querySelectorAll('.opt-btn').forEach(b=>{
    b.classList.remove('correct','wrong');
    b.removeAttribute('disabled');
  });
  document.querySelectorAll('.qcard[data-type="mcq"], .qcard[data-type="tf"]').forEach(c=>{c.dataset.locked='false';});
  document.querySelectorAll('.qcard[data-type="saq"] textarea').forEach(t=>t.value="");
  document.querySelectorAll('.qcard[data-type="saq"] .answer').forEach(a=>a.hidden=true);
  document.querySelectorAll('.qcard[data-type="saq"] [data-act="reveal"]').forEach(b=>b.textContent="Reveal Answer");
  document.querySelectorAll('.qcard[data-type="saq"] [data-act="toggle"]').forEach(b=>{b.textContent="I was correct"; b.style.outline="none";});

  state.mcq.fill(null); state.tf.fill(null); state.saq.fill(false);
  recalc();
});

recalc();
</script>
</body>
</html>
