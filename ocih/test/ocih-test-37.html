<!DOCTYPE html>
<html lang="en" style="direction:ltr;">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Interactive Exam • Glowing Dark Theme</title>
<meta name="color-scheme" content="dark" />
<style>
  :root{
    --bg:#0b0b12;
    --text:#f6f7fb;
    --muted:#a6afc6;
    --card:rgba(255,255,255,0.05);
    --card-border:rgba(255,255,255,0.12);
    --glass:rgba(255,255,255,0.04);
    --glass-border:rgba(255,255,255,0.10);
    --glow-cyan:#06b6d4;
    --glow-cyan-outer:rgba(6,182,212,0.40);
    --glow-purple:#8b5cf6;
    --glow-purple-outer:rgba(139,92,246,0.35);
    --white-haze:rgba(255,255,255,0.08);
    --white-outer:rgba(255,255,255,0.15);
    --radius:16px;
    --gap:1.25rem;
    --pad:1.5rem;
    --ok:#22c55e;  /* green */
    --bad:#ef4444; /* red */
  }

  *{box-sizing:border-box}
  body{margin:0;font:16px/1.65 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto;color:var(--text);background:var(--bg);min-height:100dvh;}
  .wrap{max-width:1100px;margin:0 auto;padding:24px;}

  .titlebar{
    position: static;z-index:10;
    backdrop-filter:saturate(140%) blur(8px);
    background:linear-gradient(180deg,rgba(11,11,18,0.75),rgba(11,11,18,0.35));
    border-bottom:1px solid var(--glass-border);
  }
  .titlebar .inner{max-width:1100px;margin:0 auto;padding:16px 24px;display:grid;gap:8px;align-items:center;}
  .grad-text{
    font-weight:800;
    letter-spacing:.3px;
    background:linear-gradient(90deg,var(--glow-cyan),var(--glow-purple));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 0 10px var(--glow-cyan-outer), 0 0 14px var(--glow-purple-outer);
  }
  h1.grad-text{font-size:clamp(1.6rem,2vw+1rem,2.6rem);margin:0;text-align:center;}
  .subtitle{margin:0;text-align:center;color:var(--muted);font-size:0.95rem}

  .section-h{
    margin:28px 0 14px;
    padding:12px 16px;
    border-radius:var(--radius);
    background:var(--glass);
    border:1px solid var(--glass-border);
    box-shadow: 0 2px 10px var(--white-haze), 0 0 18px rgba(255,255,255,0.06), 0 0 30px var(--white-outer);
    text-align:center;
    font-weight:750;
    font-size:1.15rem;
  }
  .section-h .grad-text{font-size:1.3rem;}

  .grid{display:grid;gap:var(--gap)}
  @media (min-width:800px){
    .grid.mcq{grid-template-columns:repeat(2,minmax(0,1fr));}
    .grid.tf {grid-template-columns:repeat(3,minmax(0,1fr));}
  }

  /* Cards (no accent on the card itself) */
  .card{
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:var(--radius);
    padding:var(--pad);
    box-shadow: 0 2px 8px var(--white-haze), 0 0 0 1px rgba(255,255,255,0.02), 0 0 24px rgba(255,255,255,0.06);
    position:relative;
  }

  .qtitle{font-weight:650;margin:0 0 12px}
  .meta{color:var(--muted);font-size:0.88rem;margin-bottom:10px}

  .opts{display:grid;gap:10px}
  .opt-btn{
    all:unset;cursor:pointer;display:flex;gap:10px;align-items:center;
    padding:12px 14px;border-radius:12px;
    background:rgba(255,255,255,0.03);
    border:1px solid rgba(255,255,255,0.10);
    transition:transform .06s ease, background .15s ease, border-color .15s ease;
  }
  .opt-btn .key{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-weight:700;
    background:linear-gradient(90deg,var(--glow-cyan),var(--glow-purple));color:#0b0b12;
    box-shadow:0 0 10px var(--glow-cyan-outer),0 0 10px var(--glow-purple-outer) inset;
  }
  .opt-btn:hover{transform:translateY(-1px);border-color:rgba(255,255,255,0.22);}

  /* Accent line ONLY on the chosen/correct answer box, no background highlight */
  .opt-btn.correct{
    border-left:6px solid var(--ok);
    outline:none;
    background:rgba(255,255,255,0.03);
  }
  .opt-btn.wrong{
    border-left:6px solid var(--bad);
    outline:none;
    background:rgba(255,255,255,0.03);
  }
  .opt-btn[disabled]{opacity:.85;cursor:not-allowed;pointer-events:none;}

  .feedback{margin-top:10px;border-radius:12px;padding:10px 12px;border:1px dashed rgba(255,255,255,0.18);background:rgba(255,255,255,0.03);color:var(--muted);}
  .feedback[hidden]{display:none;}
  .feedback b{color:var(--text)}

  .answer{margin-top:10px;padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,0.14);background:rgba(255,255,255,0.04)}
  .answer[hidden]{display:none;}
  .btnrow{display:flex;gap:10px;flex-wrap:wrap}
  .ghost, .primary{
    all:unset;cursor:pointer;border-radius:12px;padding:10px 14px;font-weight:650;border:1px solid rgba(255,255,255,0.18);
    background:rgba(255,255,255,0.03);
  }
  .primary{background:linear-gradient(90deg,var(--glow-cyan),var(--glow-purple));color:#0b0b12;border-color:transparent;}

  .score{
    margin:16px 0;padding:12px 14px;border-radius:14px;
    background:var(--glass);border:1px solid var(--glass-border);box-shadow: 0 2px 10px var(--white-haze), 0 0 18px rgba(255,255,255,0.06), 0 0 30px var(--white-outer);
    display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
  }
  .score .part{color:var(--muted);font-weight:600}
  .score b{color:var(--text)}
  
  /* Table Styles for SAQs */
  .answer table {width: 100%; border-collapse: collapse; margin-top: 8px;}
  .answer table, .answer th, .answer td { border: 1px solid rgba(255,255,255,0.2); }
  .answer th, .answer td { padding: 8px; text-align: left; }
  .answer th { background: rgba(255,255,255,0.1); }
</style>
</head>
<body>
  <header class="titlebar">
    <div class="inner">
      <h1 class="grad-text">🦷 Dental Pulp</h1>
      <p class="subtitle">Test based on Lecture 37</p>
    </div>
  </header>

  <main class="wrap">

    <h2 class="section-h"><span class="grad-text">اللَّهُمَّ لا سَهْلَ إِلَّا مَا جَعَلْتَهُ سَهْلًا، وَأَنْتَ تَجْعَلُ الحَزْنَ إِذَا شِئْتَ سَهْلًا</span></h2>

    <section class="score" id="scoreTop">
      <div class="part">MCQs: <b><span id="sMcq">0</span>/30</b></div>
      <div class="part">True/False: <b><span id="sTf">0</span>/9</b></div>
      <div class="part">SAQs: <b><span id="sSaq">0</span>/6</b></div>
      <div class="part">Total: <b><span id="sTotal">0</span>/45</b></div>
      <div class="btnrow">
        <button class="ghost" id="resetAll">Reset</button>
      </div>
    </section>

    <h2 class="section-h"><span class="grad-text">MCQs</span></h2>
    <div class="grid mcq" id="mcqGrid"></div>

    <h2 class="section-h"><span class="grad-text">True / False</span></h2>
    <div class="grid tf" id="tfGrid"></div>

    <h2 class="section-h"><span class="grad-text">Short Answer Questions</span></h2>
    <div class="grid" id="saqGrid"></div>

    <section class="score" id="scoreBottom">
      <div class="part">MCQs: <b><span id="sMcq2">0</span>/30</b></div>
      <div class="part">True/False: <b><span id="sTf2">0</span>/9</b></div>
      <div class="part">SAQs: <b><span id="sSaq2">0</span>/6</b></div>
      <div class="part">Total: <b><span id="sTotal2">0</span>/45</b></div>
    </section>
  </main>

<script>
// ----------- Data -----------
const mcqs = [
  {
    q: "The dental pulp is a soft connective tissue of which origin?",
    opts: ["Ectodermal", "Endodermal", "Mesodermal", "Epithelial"],
    correct: 2,
    explain: "Dental pulp is a richly vascularized and innervated connective tissue of mesodermal origin."
  },
  {
    q: "Which portion of the pulp is located in the root portion of the tooth?",
    opts: ["Coronal Pulp", "Radicular Pulp", "Pulp Horns", "Pulp Chamber"],
    correct: 1,
    explain: "The pulp present in the root portion is called Radicular Pulp."
  },
  {
    q: "Pulpal extensions into the cusps of the tooth are known as:",
    opts: ["Accessory canals", "Pulp horns", "Apical foramina", "Radicular pulp"],
    correct: 1,
    explain: "Pulpal extensions into cusps are known as 'Pulp horns'."
  },
  {
    q: "The apical foramen is a small opening at the root apex that allows entry and exit of:",
    opts: ["Only bacteria", "Only blood vessels", "Vascular, lymphatic, and nerve elements", "Only periodontal ligaments"],
    correct: 2,
    explain: "The apical foramen allows the passage of vascular, lymphatic, and nerve elements."
  },
  {
    q: "Where are accessory canals most numerous?",
    opts: ["Coronal third of the root", "Middle third of the root", "Apical third of the root", "Pulp horns"],
    correct: 2,
    explain: "Accessory canals are most numerous in the apical third of the root."
  },
  {
    q: "What is the clinical significance of accessory canals?",
    opts: ["They increase tooth sensitivity to cold", "They are involved in the spread of infection", "They produce enamel", "They prevent pulp stones"],
    correct: 1,
    explain: "Accessory canals are clinically significant in the spread of infection from pulp to periodontium or vice versa."
  },
  {
    q: "Which function of the pulp involves the formation of dentin?",
    opts: ["Nutritive", "Sensory", "Formative", "Defensive"],
    correct: 2,
    explain: "The primary role of odontoblasts in the dental pulp is the formation of dentin."
  },
  {
    q: "Tertiary dentin (reparative dentin) forms in response to:",
    opts: ["Normal aging", "Stimuli such as caries or trauma", "Tooth eruption", "Complete root formation"],
    correct: 1,
    explain: "Tertiary dentin forms in response to stimuli such as caries, trauma, or dental procedures."
  },
  {
    q: "Which nerve primarily supplies the dental pulp?",
    opts: ["Facial nerve", "Trigeminal nerve", "Glossopharyngeal nerve", "Vagus nerve"],
    correct: 1,
    explain: "The dental pulp is highly innervated by sensory nerve fibers, primarily from the trigeminal nerve."
  },
  {
    q: "Pain sensation in the pulp is intense due to:",
    opts: ["Low density of nerve fibers", "Large volume of the pulp chamber", "Small volume of the chamber and high nerve density", "Lack of blood supply"],
    correct: 2,
    explain: "Pain is intense due to the small volume of the pulp chamber and the density of nerve fibers."
  },
  {
    q: "What is the outermost histological zone of the pulp adjacent to dentin?",
    opts: ["Cell-free zone", "Cell-rich zone", "Pulp core", "Odontoblastic zone"],
    correct: 3,
    explain: "The Odontoblastic Zone is the outermost zone adjacent to the pulp-dentin border."
  },
  {
    q: "The 'Zone of Weil' is another name for which histological zone?",
    opts: ["Odontoblastic zone", "Cell-free zone", "Cell-rich zone", "Pulp core"],
    correct: 1,
    explain: "The Cell-free zone is also known as the Zone of Weil."
  },
  {
    q: "Where is the Nerve Plexus of Raschkow located?",
    opts: ["In the mineralized dentin", "In the Cell-free zone", "In the Odontoblastic layer", "Deep in the Pulp core"],
    correct: 1,
    explain: "The Nerve Plexus of Raschkow forms in the cell-free zone just below the cell bodies of odontoblasts."
  },
  {
    q: "The Cell-rich zone is more prominent in which part of the pulp?",
    opts: ["Radicular pulp", "Apical foramen", "Coronal pulp", "Periodontal ligament"],
    correct: 2,
    explain: "The Cell-rich zone is restricted to or more prominent in the coronal region."
  },
  {
    q: "What is the shape of odontoblasts in the crown portion of the pulp?",
    opts: ["Flat", "Cuboidal", "Tall columnar", "Squamous"],
    correct: 2,
    explain: "In the crown portion, odontoblasts are tall columnar cells."
  },
  {
    q: "In the root portion, odontoblasts typically appear:",
    opts: ["Tall columnar", "Pseudostratified", "Cuboidal or shorter", "Stellate"],
    correct: 2,
    explain: "In the root portion, odontoblasts are shorter or more/less cuboidal."
  },
  {
    q: "Which is the second most prominent cell type in the pulp?",
    opts: ["Fibroblasts", "Odontoblasts", "Macrophages", "Lymphocytes"],
    correct: 1,
    explain: "Odontoblasts are the second most prominent cell in the pulp (after fibroblasts)."
  },
  {
    q: "What is the most numerous cell type in the dental pulp?",
    opts: ["Odontoblasts", "Fibroblasts", "Defense cells", "Undifferentiated mesenchymal cells"],
    correct: 1,
    explain: "Fibroblasts are the most numerous cell type in the pulp."
  },
  {
    q: "Fibroblasts in the pulp are responsible for producing:",
    opts: ["Type I Collagen", "Enamel matrix", "Cementum", "Keratin"],
    correct: 0,
    explain: "Fibroblasts produce collagen fibers (Type I Collagen) and extracellular matrix."
  },
  {
    q: "In older pulp, fibroblasts that appear rounded with few organelles are called:",
    opts: ["Fibroclasts", "Fibrocytes", "Odontoclasts", "Histiocytes"],
    correct: 1,
    explain: "In older pulp, fibroblasts appear rounded or spindle-shaped and are called Fibrocytes."
  },
  {
    q: "Undifferentiated mesenchymal cells in the pulp are considered:",
    opts: ["Totipotent", "Unipotent", "Non-functional", "Apoptotic"],
    correct: 0,
    explain: "They are believed to be totipotent cells that can differentiate into odontoblasts, fibroblasts, or macrophages."
  },
  {
    q: "Which of the following represents a regressive age change in the pulp?",
    opts: ["Increased cellularity", "Increased size of pulp chamber", "Fibrosis", "Disappearance of pulp stones"],
    correct: 2,
    explain: "Regressive changes include fibrosis, decreased cellularity, and pulp stones."
  },
  {
    q: "Fibrosis in the aging pulp refers to:",
    opts: ["Increase in cells and decrease in fibers", "Increase in matured collagen fibers", "Loss of all collagen", "Increase in blood vessels"],
    correct: 1,
    explain: "Fibrosis is the increased accumulation of matured collagen fibers."
  },
  {
    q: "Pulp stones are also known as:",
    opts: ["Cementicles", "Denticles", "Phleboliths", "Sialoliths"],
    correct: 1,
    explain: "The nodular calcified masses in the pulp are called pulp stones or denticles."
  },
  {
    q: "Pulp stones are generally:",
    opts: ["Highly painful", "Asymptomatic", "Found only in deciduous teeth", "Causes of external resorption"],
    correct: 1,
    explain: "Pulp stones are typically asymptomatic."
  },
  {
    q: "A pulp stone that is entirely surrounded by dentin is classified as:",
    opts: ["Free pulp stone", "Attached pulp stone", "Embedded pulp stone", "Floating pulp stone"],
    correct: 2,
    explain: "Embedded pulp stones are embedded in the dentin."
  },
  {
    q: "Diffuse calcifications usually follow the path of:",
    opts: ["Nerve trunks only", "Collagenous fiber bundles or blood vessels", "Dentinal tubules", "Pulp horns"],
    correct: 1,
    explain: "Diffuse calcifications appear as irregular deposits usually following collagenous fiber bundles or blood vessels."
  },
  {
    q: "Which term describes calcification occurring in degenerating tissue?",
    opts: ["Metastatic calcification", "Dystrophic calcification", "Physiological calcification", "Orthotopic calcification"],
    correct: 1,
    explain: "Dystrophic calcification is the term used for calcification in degenerating tissue (Slide 36)."
  },
  {
    q: "Compared to young pulp, aged pulp has:",
    opts: ["More cells, fewer fibers", "Fewer cells, fewer fibers", "Fewer cells, more fibers", "More cells, more fibers"],
    correct: 2,
    explain: "Aged pulp has few cells and abundantly present collagen fibers (Fibrosis)."
  },
  {
    q: "The primary function of the pulp's vascular supply is to:",
    opts: ["Deliver nutrients to enamel", "Deliver nutrients and oxygen to dentin", "Remove bacteria from the mouth", "Cool the tooth"],
    correct: 1,
    explain: "The pulp's blood vessels deliver essential nutrients and oxygen, particularly to the dentin."
  }
];

const tfs = [
  {
    q: "The dental pulp is of ectodermal origin.",
    answer: false,
    explain: "The dental pulp is of mesodermal origin."
  },
  {
    q: "Accessory canals are most numerous in the coronal third of the root.",
    answer: false,
    explain: "Accessory canals are most numerous in the apical third of the root."
  },
  {
    q: "The cell-free zone is also called the Zone of Weil.",
    answer: true,
    explain: "The cell-free zone is also known as Weil's zone."
  },
  {
    q: "Pain is the only sensation detected by the dental pulp.",
    answer: false,
    explain: "While pain is intense, the pulp detects various stimuli like temperature and pressure, though these are often interpreted as pain/warning signals."
  },
  {
    q: "Odontoblasts are arranged in a palisading manner.",
    answer: true,
    explain: "Odontoblasts are dentin-forming cells arranged in a palisading manner."
  },
  {
    q: "Fibrocytes in older pulp appear stellate with extensive processes.",
    answer: false,
    explain: "In older pulp, fibrocytes appear rounded or spindle-shaped with short processes; stellate shapes are found in young pulp."
  },
  {
    q: "Pulp stones are always symptomatic and painful.",
    answer: false,
    explain: "Pulp stones are generally asymptomatic."
  },
  {
    q: "Undifferentiated mesenchymal cells decrease in number in old age.",
    answer: true,
    explain: "The number of undifferentiated mesenchymal cells decreases with age, reducing regenerative potential."
  },
  {
    q: "Diffuse calcification is also called calcific degeneration.",
    answer: true,
    explain: "Diffuse calcifications are also referred to as calcific degeneration."
  }
];

const saqs = [
  {
    q: "Define Dental Pulp.",
    a: "Dental pulp is a soft, richly vascularized, and innervated connective tissue of mesodermal origin, located in the central portion of each tooth and enclosed by dentin."
  },
  {
    q: "List the three histological zones found at the periphery of the pulp (from outer to inner).",
    a: "<table><tr><th>#</th><th>Zone Name</th></tr><tr><td>1</td><td>Odontoblastic Zone (Outermost)</td></tr><tr><td>2</td><td>Cell-free Zone (Zone of Weil)</td></tr><tr><td>3</td><td>Cell-rich Zone</td></tr></table>"
  },
  {
    q: "Compare the cellular and fibrous content of Young Pulp versus Aged Pulp.",
    a: "<table><tr><th>Feature</th><th>Young Pulp</th><th>Aged Pulp</th></tr><tr><td>1. Cellularity</td><td>Highly cellular (Stellate fibroblasts)</td><td>Less cellular (Rounded/Spindle fibrocytes)</td></tr><tr><td>2. Fibers</td><td>Few collagen fibers</td><td>Abundant collagen fibers (Fibrosis)</td></tr></table>"
  },
  {
    q: "List three major functions of the dental pulp.",
    a: "<table><tr><th>#</th><th>Function</th></tr><tr><td>1</td><td>Formation of Dentin (Primary, Secondary, Tertiary)</td></tr><tr><td>2</td><td>Nutrient and Oxygen Supply</td></tr><tr><td>3</td><td>Sensory Function (Pain/Protection)</td></tr></table>"
  },
  {
    q: "A radiograph shows a radiopaque nodule within the root canal space. What is this structure likely to be, and what are its three classifications based on attachment?",
    a: "<strong>Diagnosis:</strong> Pulp Stone (Denticle).<br><br><strong>Classifications:</strong><br>1. Free pulp stone<br>2. Attached pulp stone<br>3. Embedded pulp stone"
  },
  {
    q: "Describe the location and significance of the Nerve Plexus of Raschkow.",
    a: "<strong>Location:</strong> It is located in the Cell-free zone (Zone of Weil), just below the odontoblastic layer in the crown portion.<br><strong>Significance:</strong> It is a plexus of nerves that allows for the high sensitivity and innervation of the pulp."
  }
];

// ----------- State -----------
const state = {
  mcq: Array(mcqs.length).fill(null), // null | selectedIndex
  tf: Array(tfs.length).fill(null),   // null | boolean
  saq: Array(saqs.length).fill(false) // self-marked
};

function shuffleIndices(n){
  const arr = Array.from({length:n}, (_,i)=>i);
  for(let i=n-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}

// ----------- Render MCQs -----------
const mcqGrid = document.getElementById('mcqGrid');
mcqs.forEach((item, idx)=>{
  const map = shuffleIndices(4);
  const visualToOriginal = map;
  const originalToVisual = Array(4);
  map.forEach((orig, v)=>{ originalToVisual[orig] = v; });
  const correctVisualIndex = originalToVisual[item.correct];

  const card = document.createElement('article');
  card.className='card qcard';
  card.dataset.type='mcq';
  card.dataset.index = idx;
  card.dataset.locked = 'false';
  card.innerHTML = `
    <p class="meta">Question ${idx+1} of ${mcqs.length}</p>
    <h3 class="qtitle">${item.q}</h3>
    <div class="opts">
      ${[0,1,2,3].map(v=>`
        <button class="opt-btn" data-v="${v}" aria-label="Answer option ${String.fromCharCode(65+v)}">
          <span class="key">${String.fromCharCode(65+v)}</span>
          <span class="label">${item.opts[ visualToOriginal[v] ]}</span>
        </button>
      `).join('')}
    </div>
    <div class="feedback" hidden></div>
  `;

  const buttons = card.querySelectorAll('.opt-btn');
  const feedback = card.querySelector('.feedback');

  function lock(){
    card.dataset.locked = 'true';
    buttons.forEach(b=>b.setAttribute('disabled',''));
  }

  buttons.forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(card.dataset.locked === 'true') return; // one attempt
      const v = Number(btn.dataset.v);
      state.mcq[idx] = v;

      // clear classes
      buttons.forEach(b=>b.classList.remove('correct','wrong'));

      // Always mark the correct option (green)
      const correctBtn = buttons[correctVisualIndex];
      correctBtn.classList.add('correct');

      if(v !== correctVisualIndex){
        // Mark chosen wrong option (red)
        btn.classList.add('wrong');
        feedback.hidden=false;
        feedback.innerHTML = `<b>Wrong ✖</b><br>Correct answer: <b>${String.fromCharCode(65+correctVisualIndex)}</b><br>${item.explain}`;
      }else{
        feedback.hidden=false;
        feedback.innerHTML = `<b>Correct ✔</b><br>Answer: <b>${String.fromCharCode(65+correctVisualIndex)}</b><br>${item.explain}`;
      }
      lock();
      recalc();
    });
  });

  mcqGrid.appendChild(card);
});

// ----------- Render True/False -----------
const tfGrid = document.getElementById('tfGrid');
tfs.forEach((item, idx)=>{
  const card = document.createElement('article');
  card.className='card qcard';
  card.dataset.type='tf';
  card.dataset.index = idx;
  card.dataset.locked = 'false';
  card.innerHTML = `
    <p class="meta">Statement ${idx+1} of ${tfs.length}</p>
    <h3 class="qtitle">${item.q}</h3>
    <div class="opts">
      <button class="opt-btn" data-v="true">
        <span class="key">T</span><span class="label">True</span>
      </button>
      <button class="opt-btn" data-v="false">
        <span class="key">F</span><span class="label">False</span>
      </button>
    </div>
    <div class="feedback" hidden></div>
  `;

  const buttons = card.querySelectorAll('.opt-btn');
  const feedback = card.querySelector('.feedback');

  function lock(){
    card.dataset.locked = 'true';
    buttons.forEach(b=>b.setAttribute('disabled',''));
  }

  buttons.forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(card.dataset.locked === 'true') return; // one attempt
      const val = btn.dataset.v === "true";
      state.tf[idx] = val;

      // clear classes
      buttons.forEach(b=>b.classList.remove('correct','wrong'));

      // Always mark the correct button (green)
      const correctBtn = Array.from(buttons).find(b => (b.dataset.v === (item.answer ? "true" : "false")));
      correctBtn.classList.add('correct');

      const isCorrect = (val === item.answer);
      if(!isCorrect){
        // mark chosen wrong (red)
        btn.classList.add('wrong');
        feedback.hidden=false;
        feedback.innerHTML = `<b>Wrong ✖</b><br>Correct answer: <b>${item.answer ? 'True' : 'False'}</b><br>${item.explain}`;
      }else{
        feedback.hidden=false;
        feedback.innerHTML = `<b>Correct ✔</b><br>Answer: <b>${item.answer ? 'True' : 'False'}</b><br>${item.explain}`;
      }

      lock();
      recalc();
    });
  });

  tfGrid.appendChild(card);
});

// ----------- Render SAQs -----------
const saqGrid = document.getElementById('saqGrid');
saqs.forEach((item, idx)=>{
  const card = document.createElement('article');
  card.className='card qcard';
  card.dataset.type='saq';
  card.dataset.index = idx;
  card.innerHTML = `
  <p class="meta">Question ${idx + 1} of ${saqs.length}</p>
  <h3 class="qtitle">${item.q}</h3>
  <textarea rows="4" placeholder="Type your answer..." style="width:100%;padding:12px;border-radius:12px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.14);color:var(--text);"></textarea>
  <div class="btnrow" style="margin-top:10px">
    <button class="primary" data-act="reveal">Reveal Answer</button>
    <button class="ghost" data-act="toggle">I was correct</button>
  </div>
  <div class="answer" hidden>${item.a}</div>
`;


  const revealBtn = card.querySelector('[data-act="reveal"]');
  const toggleBtn = card.querySelector('[data-act="toggle"]');
  const answer = card.querySelector('.answer');

  revealBtn.addEventListener('click', ()=>{
    answer.hidden = !answer.hidden;
    revealBtn.textContent = answer.hidden ? "Reveal Answer" : "Hide Answer";
  });

  toggleBtn.addEventListener('click', ()=>{
    const now = !state.saq[idx];
    state.saq[idx] = now;
    toggleBtn.textContent = now ? "✓ Counted as correct" : "I was correct";
    toggleBtn.style.outline = now ? "2px solid rgba(34,197,94,.7)" : "none";
    recalc();
  });

  saqGrid.appendChild(card);
});

// ----------- Score + Reset -----------
function recalc(){
  const mcqScore = state.mcq.reduce((s,v,i)=>{
    if(v===null) return s;
    const card = document.querySelector(`.qcard[data-type="mcq"][data-index="${i}"]`);
    const feedback = card.querySelector('.feedback').textContent;
    return s + (feedback.startsWith("Correct") ? 1 : 0);
  },0);
  const tfScore = state.tf.reduce((s,v,i)=>{
    if(v===null) return s;
    const card = document.querySelector(`.qcard[data-type="tf"][data-index="${i}"]`);
    const feedback = card.querySelector('.feedback').textContent;
    return s + (feedback.startsWith("Correct") ? 1 : 0);
  },0);
  const saqScore = state.saq.filter(Boolean).length;
  const total = mcqScore + tfScore + saqScore;

  const ids = ["sMcq","sTf","sSaq","sTotal","sMcq2","sTf2","sSaq2","sTotal2"];
  ids.forEach(id=>{
    const el = document.getElementById(id);
    if(!el) return;
    if(id.includes('Mcq')) el.textContent = mcqScore;
    if(id.includes('Tf')) el.textContent = tfScore;
    if(id.includes('Saq')) el.textContent = saqScore;
    if(id.includes('Total')) el.textContent = total;
  });
}

document.getElementById('resetAll').addEventListener('click', ()=>{
  document.querySelectorAll('.qcard .feedback').forEach(f=>{f.hidden=true; f.textContent=''; f.innerHTML='';});
  document.querySelectorAll('.opt-btn').forEach(b=>{
    b.classList.remove('correct','wrong');
    b.removeAttribute('disabled');
  });
  document.querySelectorAll('.qcard[data-type="mcq"], .qcard[data-type="tf"]').forEach(c=>{c.dataset.locked='false';});
  document.querySelectorAll('.qcard[data-type="saq"] textarea').forEach(t=>t.value="");
  document.querySelectorAll('.qcard[data-type="saq"] .answer').forEach(a=>a.hidden=true);
  document.querySelectorAll('.qcard[data-type="saq"] [data-act="reveal"]').forEach(b=>b.textContent="Reveal Answer");
  document.querySelectorAll('.qcard[data-type="saq"] [data-act="toggle"]').forEach(b=>{b.textContent="I was correct"; b.style.outline="none";});

  state.mcq.fill(null); state.tf.fill(null); state.saq.fill(false);
  recalc();
});

recalc();
</script>
