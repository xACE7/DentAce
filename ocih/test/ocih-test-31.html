<!DOCTYPE html>
<html lang="en" style="direction:ltr;">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Interactive Exam • Lecture 31</title>
<meta name="color-scheme" content="dark" />
<style>
  :root{
    --bg:#0b0b12;
    --text:#f6f7fb;
    --muted:#a6afc6;
    --card:rgba(255,255,255,0.05);
    --card-border:rgba(255,255,255,0.12);
    --glass:rgba(255,255,255,0.04);
    --glass-border:rgba(255,255,255,0.10);
    --glow-cyan:#06b6d4;
    --glow-cyan-outer:rgba(6,182,212,0.40);
    --glow-purple:#8b5cf6;
    --glow-purple-outer:rgba(139,92,246,0.35);
    --white-haze:rgba(255,255,255,0.08);
    --white-outer:rgba(255,255,255,0.15);
    --radius:16px;
    --gap:1.25rem;
    --pad:1.5rem;
    --ok:#22c55e;  /* green */
    --bad:#ef4444; /* red */
  }

  *{box-sizing:border-box}
  body{margin:0;font:16px/1.65 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto;color:var(--text);background:var(--bg);min-height:100dvh;}
  .wrap{max-width:1100px;margin:0 auto;padding:24px;}

  .titlebar{
    position: static;z-index:10;
    backdrop-filter:saturate(140%) blur(8px);
    background:linear-gradient(180deg,rgba(11,11,18,0.75),rgba(11,11,18,0.35));
    border-bottom:1px solid var(--glass-border);
  }
  .titlebar .inner{max-width:1100px;margin:0 auto;padding:16px 24px;display:grid;gap:8px;align-items:center;}
  .grad-text{
    font-weight:800;
    letter-spacing:.3px;
    background:linear-gradient(90deg,var(--glow-cyan),var(--glow-purple));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 0 10px var(--glow-cyan-outer), 0 0 14px var(--glow-purple-outer);
  }
  h1.grad-text{font-size:clamp(1.6rem,2vw+1rem,2.6rem);margin:0;text-align:center;}
  .subtitle{margin:0;text-align:center;color:var(--muted);font-size:0.95rem}

  .section-h{
    margin:28px 0 14px;
    padding:12px 16px;
    border-radius:var(--radius);
    background:var(--glass);
    border:1px solid var(--glass-border);
    box-shadow: 0 2px 10px var(--white-haze), 0 0 18px rgba(255,255,255,0.06), 0 0 30px var(--white-outer);
    text-align:center;
    font-weight:750;
    font-size:1.15rem;
  }
  .section-h .grad-text{font-size:1.3rem;}

  .grid{display:grid;gap:var(--gap)}
  @media (min-width:800px){
    .grid.mcq{grid-template-columns:repeat(2,minmax(0,1fr));}
    .grid.tf {grid-template-columns:repeat(3,minmax(0,1fr));}
  }

  /* Cards (no accent on the card itself) */
  .card{
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:var(--radius);
    padding:var(--pad);
    box-shadow: 0 2px 8px var(--white-haze), 0 0 0 1px rgba(255,255,255,0.02), 0 0 24px rgba(255,255,255,0.06);
    position:relative;
  }

  .qtitle{font-weight:650;margin:0 0 12px}
  .meta{color:var(--muted);font-size:0.88rem;margin-bottom:10px}

  .opts{display:grid;gap:10px}
  .opt-btn{
    all:unset;cursor:pointer;display:flex;gap:10px;align-items:center;
    padding:12px 14px;border-radius:12px;
    background:rgba(255,255,255,0.03);
    border:1px solid rgba(255,255,255,0.10);
    transition:transform .06s ease, background .15s ease, border-color .15s ease;
  }
  .opt-btn .key{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-weight:700;
    background:linear-gradient(90deg,var(--glow-cyan),var(--glow-purple));color:#0b0b12;
    box-shadow:0 0 10px var(--glow-cyan-outer),0 0 10px var(--glow-purple-outer) inset;
  }
  .opt-btn:hover{transform:translateY(-1px);border-color:rgba(255,255,255,0.22);}

  /* Accent line ONLY on the chosen/correct answer box, no background highlight */
  .opt-btn.correct{
    border-left:6px solid var(--ok);
    outline:none;
    background:rgba(255,255,255,0.03);
  }
  .opt-btn.wrong{
    border-left:6px solid var(--bad);
    outline:none;
    background:rgba(255,255,255,0.03);
  }
  .opt-btn[disabled]{opacity:.85;cursor:not-allowed;pointer-events:none;}

  .feedback{margin-top:10px;border-radius:12px;padding:10px 12px;border:1px dashed rgba(255,255,255,0.18);background:rgba(255,255,255,0.03);color:var(--muted);}
  .feedback[hidden]{display:none;}
  .feedback b{color:var(--text)}

  .answer{margin-top:10px;padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,0.14);background:rgba(255,255,255,0.04)}
  .answer[hidden]{display:none;}
  .btnrow{display:flex;gap:10px;flex-wrap:wrap}
  .ghost, .primary{
    all:unset;cursor:pointer;border-radius:12px;padding:10px 14px;font-weight:650;border:1px solid rgba(255,255,255,0.18);
    background:rgba(255,255,255,0.03);
  }
  .primary{background:linear-gradient(90deg,var(--glow-cyan),var(--glow-purple));color:#0b0b12;border-color:transparent;}

  .score{
    margin:16px 0;padding:12px 14px;border-radius:14px;
    background:var(--glass);border:1px solid var(--glass-border);box-shadow: 0 2px 10px var(--white-haze), 0 0 18px rgba(255,255,255,0.06), 0 0 30px var(--white-outer);
    display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
  }
  .score .part{color:var(--muted);font-weight:600}
  .score b{color:var(--text)}
</style>
</head>

<body>
  <header class="titlebar">
    <div class="inner">
      <h1 class="grad-text">🦷 Dentistry 3rd year</h1>
      <p class="subtitle">Test based on Lecture 31</p>
    </div>
  </header>

  <main class="wrap">

    <h2 class="section-h"><span class="grad-text">اللَّهُمَّ لا سَهْلَ إِلَّا مَا جَعَلْتَهُ سَهْلًا، وَأَنْتَ تَجْعَلُ الحَزْنَ إِذَا شِئْتَ سَهْلًا</span></h2>

    <section class="score" id="scoreTop">
      <div class="part">MCQs: <b><span id="sMcq">0</span>/30</b></div>
      <div class="part">True/False: <b><span id="sTf">0</span>/9</b></div>
      <div class="part">SAQs: <b><span id="sSaq">0</span>/6</b></div>
      <div class="part">Total: <b><span id="sTotal">0</span>/45</b></div>
      <div class="btnrow">
        <button class="ghost" id="resetAll">Reset</button>
      </div>
    </section>

    <h2 class="section-h"><span class="grad-text">MCQs</span></h2>
    <div class="grid mcq" id="mcqGrid"></div>

    <h2 class="section-h"><span class="grad-text">True / False</span></h2>
    <div class="grid tf" id="tfGrid"></div>

    <h2 class="section-h"><span class="grad-text">Short Answer Questions</span></h2>
    <div class="grid" id="saqGrid"></div>

    <section class="score" id="scoreBottom">
      <div class="part">MCQs: <b><span id="sMcq2">0</span>/30</b></div>
      <div class="part">True/False: <b><span id="sTf2">0</span>/9</b></div>
      <div class="part">SAQs: <b><span id="sSaq2">0</span>/6</b></div>
      <div class="part">Total: <b><span id="sTotal2">0</span>/45</b></div>
    </section>
  </main>

<script>
// ----------- Data (Lecture 31) -----------
const mcqs = [
  {
    q: "What type of epithelium lines the buccal mucosa?",
    opts: ["Non-keratinized stratified squamous", "Keratinized stratified squamous", "Pseudostratified columnar", "Simple squamous"],
    correct: 0,
    explain: "The buccal mucosa is lined by a thick, non-keratinized stratified squamous epithelium."
  },
  {
    q: "Describe the rete ridges found in the buccal mucosa.",
    opts: ["Short and blunt", "Long and slender", "Absent", "Irregular and deep"],
    correct: 0,
    explain: "The buccal mucosa typically exhibits few, short, and blunt rete ridges."
  },
  {
    q: "Which of the following is found in the submucosa of the cheek?",
    opts: ["Fat cells and mixed salivary glands", "Only serous glands", "Hair follicles", "Sweat glands"],
    correct: 0,
    explain: "The submucosa of the cheek contains fat cells and minor mixed salivary glands."
  },
  {
    q: "The core of the lip is primarily composed of which muscle?",
    opts: ["Orbicularis oris", "Buccinator", "Masseter", "Temporalis"],
    correct: 0,
    explain: "The central core of the lip contains the skeletal muscle fibers of the orbicularis oris."
  },
  {
    q: "The outer surface of the lip is covered by:",
    opts: ["Skin with keratinized epithelium", "Non-keratinized mucosa", "Parakeratinized mucosa", "Pseudostratified epithelium"],
    correct: 0,
    explain: "The outer surface of the lip is covered by skin, which consists of keratinized stratified squamous epithelium."
  },
  {
    q: "Which zone of the lip forms the transition between skin and oral mucosa?",
    opts: ["Vermilion zone", "Labial mucosa", "Gingiva", "Hard palate"],
    correct: 0,
    explain: "The vermilion zone (or border) is the transitional zone between the skin of the lip and the labial mucosa."
  },
  {
    q: "Why does the vermilion zone of the lip appear red?",
    opts: ["Thin epithelium and long rete ridges", "Presence of abundant melanin", "Thick keratin layer", "High density of sebaceous glands"],
    correct: 0,
    explain: "The redness is due to the thin epithelium and long rete ridges that bring blood capillaries close to the surface."
  },
  {
    q: "Which structures are typically ABSENT in the vermilion zone?",
    opts: ["Sweat glands and hair follicles", "Capillaries", "Nerve endings", "Epithelial cells"],
    correct: 0,
    explain: "The vermilion zone lacks hair follicles and sweat glands, making it prone to drying."
  },
  {
    q: "The inner surface of the lip is known as:",
    opts: ["Labial mucosa", "Vermilion zone", "Buccal mucosa", "Alveolar mucosa"],
    correct: 0,
    explain: "The inner surface of the lip is lined by the labial mucosa."
  },
  {
    q: "What type of epithelium lines the labial mucosa?",
    opts: ["Non-keratinized stratified squamous", "Orthokeratinized stratified squamous", "Simple cuboidal", "Transitional"],
    correct: 0,
    explain: "Like the buccal mucosa, the labial mucosa is lined by non-keratinized stratified squamous epithelium."
  },
  {
    q: "What type of glands are found in the submucosa of the labial mucosa?",
    opts: ["Minor salivary glands", "Sebaceous glands", "Sweat glands", "Lacrimal glands"],
    correct: 0,
    explain: "The submucosa of the labial mucosa contains minor salivary glands."
  },
  {
    q: "Which layer is present in the epithelium of the skin side of the lip but NOT in the labial mucosa?",
    opts: ["Stratum corneum (Keratin)", "Stratum basale", "Stratum spinosum", "Lamina propria"],
    correct: 0,
    explain: "The skin side is keratinized (has Stratum corneum), while the labial mucosa is non-keratinized."
  },
  {
    q: "The junction between the oral mucosa and the skin of the lip is called:",
    opts: ["Mucocutaneous junction", "Dentogingival junction", "Mucogingival junction", "Cementoenamel junction"],
    correct: 0,
    explain: "The vermilion border represents the mucocutaneous junction."
  },
  {
    q: "Which of the following layers is found in non-keratinized epithelium?",
    opts: ["Stratum superficiale", "Stratum granulosum", "Stratum lucidum", "Stratum corneum"],
    correct: 0,
    explain: "Non-keratinized epithelium consists of Stratum basale, Stratum intermedium, and Stratum superficiale."
  },
  {
    q: "The lamina propria of the buccal mucosa is characterized as being:",
    opts: ["Vascular", "Avascular", "Adipose tissue", "Muscular"],
    correct: 0,
    explain: "The lamina propria is a vascular connective tissue layer supporting the epithelium."
  },
  {
    q: "The intermediate layer of cells in the buccal mucosa is called:",
    opts: ["Stratum intermedium", "Stratum spinosum", "Stratum granulosum", "Stratum basale"],
    correct: 0,
    explain: "In non-keratinized epithelium, the layer above the basal layer is the Stratum intermedium."
  },
  {
    q: "Which structure is responsible for attaching the epithelium to the underlying connective tissue?",
    opts: ["Basement membrane", "Desmosomes", "Gap junctions", "Tight junctions"],
    correct: 0,
    explain: "The basement membrane separates and attaches the epithelium to the underlying lamina propria."
  },
  {
    q: "Occasional sebaceous glands found in the buccal mucosa or vermilion zone are known as:",
    opts: ["Fordyce's granules", "Tonsils", "Taste buds", "Peyer's patches"],
    correct: 0,
    explain: "Fordyce's granules are ectopic sebaceous glands sometimes found in the oral mucosa or vermilion zone."
  },
  {
    q: "The connective tissue papillae in the vermilion zone are:",
    opts: ["Long and reach high into the epithelium", "Short and blunt", "Absent", "Wide and flat"],
    correct: 0,
    explain: "They are long to bring blood supply close to the surface, contributing to the red color."
  },
  {
    q: "The muscle layer found in the buccal submucosa belongs to which muscle?",
    opts: ["Buccinator", "Orbicularis oris", "Masseter", "Pterygoid"],
    correct: 0,
    explain: "While the lip has Orbicularis oris, the cheek (buccal) submucosa contains fibers of the Buccinator muscle."
  },
  {
    q: "Hair follicles are found in which part of the lip?",
    opts: ["Skin covering the outer surface", "Vermilion zone", "Labial mucosa", "All of the above"],
    correct: 0,
    explain: "Hair follicles are characteristic of the skin (outer surface) only."
  },
  {
    q: "The minor salivary glands in the lip are located in the:",
    opts: ["Submucosa", "Epithelium", "Muscle layer", "Epidermis"],
    correct: 0,
    explain: "Minor salivary glands are located in the submucosa, deep to the lamina propria."
  },
  {
    q: "Stratum superficiale cells are characterized as:",
    opts: ["Flat cells with nuclei", "Flat cells without nuclei", "Cuboidal cells", "Columnar cells"],
    correct: 0,
    explain: "In non-keratinized epithelium, the surface cells (Stratum superficiale) retain their nuclei."
  },
  {
    q: "Which of the following is NOT a feature of the buccal mucosa?",
    opts: ["Keratinization", "Stratified squamous epithelium", "Fat cells in submucosa", "Minor salivary glands"],
    correct: 0,
    explain: "The buccal mucosa is non-keratinized."
  },
  {
    q: "The dermis of the lip skin is composed of:",
    opts: ["Dense connective tissue", "Loose areolar tissue", "Adipose tissue only", "Epithelial tissue"],
    correct: 0,
    explain: "The skin side has a dermis made of dense connective tissue."
  },
  {
    q: "The transition zone of the lip has:",
    opts: ["Thin epithelium", "Thick keratinized epithelium", "Respiratory epithelium", "Simple squamous epithelium"],
    correct: 0,
    explain: "The epithelium of the vermilion zone is thin."
  },
  {
    q: "Which type of salivary glands are found in the buccal submucosa?",
    opts: ["Mixed (Mucous and Serous)", "Purely serous", "Purely mucous", "No glands"],
    correct: 0,
    explain: "The minor salivary glands in the buccal submucosa are typically mixed."
  },
  {
    q: "What is the primary function of the stratified squamous epithelium in the oral cavity?",
    opts: ["Protection", "Absorption", "Digestion", "Gas exchange"],
    correct: 0,
    explain: "The primary function is protection against mechanical stress and abrasion."
  },
  {
    q: "The deepest layer of the oral epithelium is the:",
    opts: ["Stratum basale", "Stratum superficiale", "Stratum corneum", "Stratum intermedium"],
    correct: 0,
    explain: "The Stratum basale is the deepest layer, resting on the basement membrane."
  },
  {
    q: "In the buccal mucosa, fat cells are located in the:",
    opts: ["Submucosa", "Epithelium", "Basement membrane", "Muscle"],
    correct: 0,
    explain: "The submucosa of the cheek contains adipose tissue (fat cells)."
  }
];

const tfs = [
  {
    q: "The buccal mucosa is lined by keratinized stratified squamous epithelium.",
    answer: false,
    explain: "It is lined by NON-keratinized stratified squamous epithelium."
  },
  {
    q: "The vermilion zone of the lip contains numerous sweat glands.",
    answer: false,
    explain: "The vermilion zone lacks sweat glands and hair follicles."
  },
  {
    q: "The core of the lip contains skeletal muscle fibers of the orbicularis oris.",
    answer: true,
    explain: "The orbicularis oris muscle forms the muscular core of the lip."
  },
  {
    q: "The skin side of the lip contains hair follicles and sebaceous glands.",
    answer: true,
    explain: "The outer surface is skin, which contains these appendages."
  },
  {
    q: "Rete ridges in the buccal mucosa are typically long and slender.",
    answer: false,
    explain: "They are typically short and blunt."
  },
  {
    q: "The submucosa of the labial mucosa contains minor salivary glands.",
    answer: true,
    explain: "These are the minor labial salivary glands."
  },
  {
    q: "The epithelium of the vermilion zone is thicker than that of the skin side.",
    answer: false,
    explain: "It is thin, which allows the underlying blood vessels to show through."
  },
  {
    q: "The buccal submucosa contains fat cells.",
    answer: true,
    explain: "Fat cells and minor salivary glands are characteristic of the buccal submucosa."
  },
  {
    q: "The stratum superficiale of the buccal mucosa consists of anucleated cells.",
    answer: false,
    explain: "In non-keratinized epithelium, the surface cells retain their nuclei."
  }
];

const saqs = [
  {
    q: "List the three layers of the non-keratinized stratified squamous epithelium found in the buccal mucosa.",
    a: "1. Stratum Basale (Basal layer)<br>2. Stratum Intermedium (Intermediate layer)<br>3. Stratum Superficiale (Superficial layer)"
  },
  {
    q: "Compare the Skin side and Labial Mucosa side of the lip.",
    a: "<table border='1' style='width:100%; border-collapse:collapse; margin-top:5px;'><tr><th>Feature</th><th>Skin Side</th><th>Labial Mucosa</th></tr><tr><td>Epithelium</td><td>Keratinized stratified squamous</td><td>Non-keratinized stratified squamous</td></tr><tr><td>Appendages</td><td>Hair follicles, sweat glands, sebaceous glands</td><td>Minor salivary glands (submucosa)</td></tr><tr><td>Rete Ridges</td><td>Average/Standard</td><td>Short and blunt (typical of lining mucosa)</td></tr></table>"
  },
  {
    q: "List the components found in the submucosa of the buccal mucosa (Cheek).",
    a: "1. Fat cells (Adipose tissue)<br>2. Minor mixed salivary glands<br>3. Blood vessels and nerves<br>4. Muscle fibers (Buccinator)"
  },
  {
    q: "A patient presents with chapped, dry lips. Based on the histology of the vermilion zone, explain why this area is susceptible to drying.",
    a: "The vermilion zone lacks sweat glands (which provide moisture) and sebaceous glands (which provide oil/sebum). This absence of natural lubricating secretions makes the area prone to drying out."
  },
  {
    q: "Define the Vermilion Zone and explain the histological basis for its red color.",
    a: "The Vermilion Zone is the transitional area between the skin of the lip and the labial mucosa. It appears red because the epithelium is thin and the connective tissue papillae (rete ridges) are long, bringing blood capillaries close to the surface."
  },
  {
    q: "What constitutes the 'core' of the lip?",
    a: "The core of the lip is composed of skeletal muscle fibers of the Orbicularis Oris muscle, surrounded by fibroelastic connective tissue."
  }
];

// ----------- State -----------
const state = {
  mcq: Array(mcqs.length).fill(null), // null | selectedIndex
  tf: Array(tfs.length).fill(null),   // null | boolean
  saq: Array(saqs.length).fill(false) // self-marked
};

function shuffleIndices(n){
  const arr = Array.from({length:n}, (_,i)=>i);
  for(let i=n-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}

// ----------- Render MCQs -----------
const mcqGrid = document.getElementById('mcqGrid');
mcqs.forEach((item, idx)=>{
  const map = shuffleIndices(4);
  const visualToOriginal = map;
  const originalToVisual = Array(4);
  map.forEach((orig, v)=>{ originalToVisual[orig] = v; });
  const correctVisualIndex = originalToVisual[item.correct];

  const card = document.createElement('article');
  card.className='card qcard';
  card.dataset.type='mcq';
  card.dataset.index = idx;
  card.dataset.locked = 'false';
  card.innerHTML = `
    <p class="meta">Question ${idx+1} of ${mcqs.length}</p>
    <h3 class="qtitle">${item.q}</h3>
    <div class="opts">
      ${[0,1,2,3].map(v=>`
        <button class="opt-btn" data-v="${v}" aria-label="Answer option ${String.fromCharCode(65+v)}">
          <span class="key">${String.fromCharCode(65+v)}</span>
          <span class="label">${item.opts[ visualToOriginal[v] ]}</span>
        </button>
      `).join('')}
    </div>
    <div class="feedback" hidden></div>
  `;

  const buttons = card.querySelectorAll('.opt-btn');
  const feedback = card.querySelector('.feedback');

  function lock(){
    card.dataset.locked = 'true';
    buttons.forEach(b=>b.setAttribute('disabled',''));
  }

  buttons.forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(card.dataset.locked === 'true') return; // one attempt
      const v = Number(btn.dataset.v);
      state.mcq[idx] = v;

      // clear classes
      buttons.forEach(b=>b.classList.remove('correct','wrong'));

      // Always mark the correct option (green)
      const correctBtn = buttons[correctVisualIndex];
      correctBtn.classList.add('correct');

      if(v !== correctVisualIndex){
        // Mark chosen wrong option (red)
        btn.classList.add('wrong');
        feedback.hidden=false;
        feedback.innerHTML = `<b>Wrong ✖</b><br>Correct answer: <b>${String.fromCharCode(65+correctVisualIndex)}</b><br>${item.explain}`;
      }else{
        feedback.hidden=false;
        feedback.innerHTML = `<b>Correct ✔</b><br>Answer: <b>${String.fromCharCode(65+correctVisualIndex)}</b><br>${item.explain}`;
      }
      lock();
      recalc();
    });
  });

  mcqGrid.appendChild(card);
});

// ----------- Render True/False -----------
const tfGrid = document.getElementById('tfGrid');
tfs.forEach((item, idx)=>{
  const card = document.createElement('article');
  card.className='card qcard';
  card.dataset.type='tf';
  card.dataset.index = idx;
  card.dataset.locked = 'false';
  card.innerHTML = `
    <p class="meta">Statement ${idx+1} of ${tfs.length}</p>
    <h3 class="qtitle">${item.q}</h3>
    <div class="opts">
      <button class="opt-btn" data-v="true">
        <span class="key">T</span><span class="label">True</span>
      </button>
      <button class="opt-btn" data-v="false">
        <span class="key">F</span><span class="label">False</span>
      </button>
    </div>
    <div class="feedback" hidden></div>
  `;

  const buttons = card.querySelectorAll('.opt-btn');
  const feedback = card.querySelector('.feedback');

  function lock(){
    card.dataset.locked = 'true';
    buttons.forEach(b=>b.setAttribute('disabled',''));
  }

  buttons.forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(card.dataset.locked === 'true') return; // one attempt
      const val = btn.dataset.v === "true";
      state.tf[idx] = val;

      // clear classes
      buttons.forEach(b=>b.classList.remove('correct','wrong'));

      // Always mark the correct button (green)
      const correctBtn = Array.from(buttons).find(b => (b.dataset.v === (item.answer ? "true" : "false")));
      correctBtn.classList.add('correct');

      const isCorrect = (val === item.answer);
      if(!isCorrect){
        // mark chosen wrong (red)
        btn.classList.add('wrong');
        feedback.hidden=false;
        feedback.innerHTML = `<b>Wrong ✖</b><br>Correct answer: <b>${item.answer ? 'True' : 'False'}</b><br>${item.explain}`;
      }else{
        feedback.hidden=false;
        feedback.innerHTML = `<b>Correct ✔</b><br>Answer: <b>${item.answer ? 'True' : 'False'}</b><br>${item.explain}`;
      }

      lock();
      recalc();
    });
  });

  tfGrid.appendChild(card);
});

// ----------- Render SAQs -----------
const saqGrid = document.getElementById('saqGrid');
saqs.forEach((item, idx)=>{
  const card = document.createElement('article');
  card.className='card qcard';
  card.dataset.type='saq';
  card.dataset.index = idx;
  card.innerHTML = `
  <p class="meta">Question ${idx + 1} of ${saqs.length}</p>
  <h3 class="qtitle">${item.q}</h3>
  <textarea rows="4" placeholder="Type your answer..." style="width:100%;padding:12px;border-radius:12px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.14);color:var(--text);"></textarea>
  <div class="btnrow" style="margin-top:10px">
    <button class="primary" data-act="reveal">Reveal Answer</button>
    <button class="ghost" data-act="toggle">I was correct</button>
  </div>
  <div class="answer" hidden>${item.a}</div>
`;

  const revealBtn = card.querySelector('[data-act="reveal"]');
  const toggleBtn = card.querySelector('[data-act="toggle"]');
  const answer = card.querySelector('.answer');

  revealBtn.addEventListener('click', ()=>{
    answer.hidden = !answer.hidden;
    revealBtn.textContent = answer.hidden ? "Reveal Answer" : "Hide Answer";
  });

  toggleBtn.addEventListener('click', ()=>{
    const now = !state.saq[idx];
    state.saq[idx] = now;
    toggleBtn.textContent = now ? "✓ Counted as correct" : "I was correct";
    toggleBtn.style.outline = now ? "2px solid rgba(34,197,94,.7)" : "none";
    recalc();
  });

  saqGrid.appendChild(card);
});

// ----------- Score + Reset -----------
function recalc(){
  const mcqScore = state.mcq.reduce((s,v,i)=>{
    if(v===null) return s;
    const card = document.querySelector(`.qcard[data-type="mcq"][data-index="${i}"]`);
    const feedback = card.querySelector('.feedback').textContent;
    return s + (feedback.startsWith("Correct") ? 1 : 0);
  },0);
  const tfScore = state.tf.reduce((s,v,i)=>{
    if(v===null) return s;
    const card = document.querySelector(`.qcard[data-type="tf"][data-index="${i}"]`);
    const feedback = card.querySelector('.feedback').textContent;
    return s + (feedback.startsWith("Correct") ? 1 : 0);
  },0);
  const saqScore = state.saq.filter(Boolean).length;
  const total = mcqScore + tfScore + saqScore;

  const ids = ["sMcq","sTf","sSaq","sTotal","sMcq2","sTf2","sSaq2","sTotal2"];
  ids.forEach(id=>{
    const el = document.getElementById(id);
    if(!el) return;
    if(id.includes('Mcq')) el.textContent = mcqScore;
    if(id.includes('Tf')) el.textContent = tfScore;
    if(id.includes('Saq')) el.textContent = saqScore;
    if(id.includes('Total')) el.textContent = total;
  });
}

document.getElementById('resetAll').addEventListener('click', ()=>{
  document.querySelectorAll('.qcard .feedback').forEach(f=>{f.hidden=true; f.textContent=''; f.innerHTML='';});
  document.querySelectorAll('.opt-btn').forEach(b=>{
    b.classList.remove('correct','wrong');
    b.removeAttribute('disabled');
  });
  document.querySelectorAll('.qcard[data-type="mcq"], .qcard[data-type="tf"]').forEach(c=>{c.dataset.locked='false';});
  document.querySelectorAll('.qcard[data-type="saq"] textarea').forEach(t=>t.value="");
  document.querySelectorAll('.qcard[data-type="saq"] .answer').forEach(a=>a.hidden=true);
  document.querySelectorAll('.qcard[data-type="saq"] [data-act="reveal"]').forEach(b=>b.textContent="Reveal Answer");
  document.querySelectorAll('.qcard[data-type="saq"] [data-act="toggle"]').forEach(b=>{b.textContent="I was correct"; b.style.outline="none";});

  state.mcq.fill(null); state.tf.fill(null); state.saq.fill(false);
  recalc();
});

recalc();
</script>
