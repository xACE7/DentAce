name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy at a time; let a newer push cancel an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # NOTE: do NOT run `npm run discover` here. The source PDFs are no longer in
      # the repo (served from the private Supabase 'pdfs' bucket), so re-discovering
      # in CI would wipe every subject's pdf tokens from the index → "No PDFs yet".
      # The committed src/lib/content/contentIndex.ts is the source of truth;
      # regenerate it locally (with PDFs on disk) and commit when content changes.
      - name: Build static site (out/)
        run: npm run export
        env:
          # Served at https://xace7.github.io/DentAce/ → basePath must be /DentAce.
          NEXT_PUBLIC_BASE_PATH: /DentAce
          SITE_URL: https://xace7.github.io
          # Supabase progress-sync (anon/publishable key — safe to expose; row-level-security protects data).
          NEXT_PUBLIC_SUPABASE_URL: https://enpdvjvabbwgyhldmrbe.supabase.co
          NEXT_PUBLIC_SUPABASE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVucGR2anZhYmJ3Z3lobGRtcmJlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIyODU3NjEsImV4cCI6MjA5Nzg2MTc2MX0.3VXtrhTrz2phm4t6b1wipdajzwgzsaL17zAGSxY_laU
          # Google Analytics tag — value lives in a GitHub Actions secret, not in this
          # file. Add it at: repo Settings → Secrets and variables → Actions → New
          # repository secret named NEXT_PUBLIC_GA_ID (value = your GA measurement id).
          NEXT_PUBLIC_GA_ID: ${{ secrets.NEXT_PUBLIC_GA_ID }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
