<!DOCTYPE html>
<html lang="en" style="direction:ltr;">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Interactive Exam • Rad 11</title>
<meta name="color-scheme" content="dark" />
<style>
  :root{
    --bg:#0b0b12;
    --text:#f6f7fb;
    --muted:#a6afc6;
    --card:rgba(255,255,255,0.05);
    --card-border:rgba(255,255,255,0.12);
    --glass:rgba(255,255,255,0.04);
    --glass-border:rgba(255,255,255,0.10);
    --glow-cyan:#06b6d4;
    --glow-cyan-outer:rgba(6,182,212,0.40);
    --glow-purple:#8b5cf6;
    --glow-purple-outer:rgba(139,92,246,0.35);
    --white-haze:rgba(255,255,255,0.08);
    --white-outer:rgba(255,255,255,0.15);
    --radius:16px;
    --gap:1.25rem;
    --pad:1.5rem;
    --ok:#22c55e;  /* green */
    --bad:#ef4444; /* red */
  }

  *{box-sizing:border-box}
  body{margin:0;font:16px/1.65 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto;color:var(--text);background:var(--bg);min-height:100dvh;}
  .wrap{max-width:1100px;margin:0 auto;padding:24px;}

  .titlebar{
    position: static;z-index:10;
    backdrop-filter:saturate(140%) blur(8px);
    background:linear-gradient(180deg,rgba(11,11,18,0.75),rgba(11,11,18,0.35));
    border-bottom:1px solid var(--glass-border);
  }
  .titlebar .inner{max-width:1100px;margin:0 auto;padding:16px 24px;display:grid;gap:8px;align-items:center;}
  .grad-text{
    font-weight:800;
    letter-spacing:.3px;
    background:linear-gradient(90deg,var(--glow-cyan),var(--glow-purple));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 0 10px var(--glow-cyan-outer), 0 0 14px var(--glow-purple-outer);
  }
  h1.grad-text{font-size:clamp(1.6rem,2vw+1rem,2.6rem);margin:0;text-align:center;}
  .subtitle{margin:0;text-align:center;color:var(--muted);font-size:0.95rem}

  .section-h{
    margin:28px 0 14px;
    padding:12px 16px;
    border-radius:var(--radius);
    background:var(--glass);
    border:1px solid var(--glass-border);
    box-shadow: 0 2px 10px var(--white-haze), 0 0 18px rgba(255,255,255,0.06), 0 0 30px var(--white-outer);
    text-align:center;
    font-weight:750;
    font-size:1.15rem;
  }
  .section-h .grad-text{font-size:1.3rem;}

  .grid{display:grid;gap:var(--gap)}
  @media (min-width:800px){
    .grid.mcq{grid-template-columns:repeat(2,minmax(0,1fr));}
    .grid.tf {grid-template-columns:repeat(3,minmax(0,1fr));}
  }

  .card{
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:var(--radius);
    padding:var(--pad);
    box-shadow: 0 2px 8px var(--white-haze), 0 0 0 1px rgba(255,255,255,0.02), 0 0 24px rgba(255,255,255,0.06);
    position:relative;
  }

  .qtitle{font-weight:650;margin:0 0 12px}
  .meta{color:var(--muted);font-size:0.88rem;margin-bottom:10px}

  .opts{display:grid;gap:10px}
  .opt-btn{
    all:unset;cursor:pointer;display:flex;gap:10px;align-items:center;
    padding:12px 14px;border-radius:12px;
    background:rgba(255,255,255,0.03);
    border:1px solid rgba(255,255,255,0.10);
    transition:transform .06s ease, background .15s ease, border-color .15s ease;
  }
  .opt-btn .key{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-weight:700;
    background:linear-gradient(90deg,var(--glow-cyan),var(--glow-purple));color:#0b0b12;
    box-shadow:0 0 10px var(--glow-cyan-outer),0 0 10px var(--glow-purple-outer) inset;
  }
  .opt-btn:hover{transform:translateY(-1px);border-color:rgba(255,255,255,0.22);}

  .opt-btn.correct{
    border-left:6px solid var(--ok);
    outline:none;
    background:rgba(255,255,255,0.03);
  }
  .opt-btn.wrong{
    border-left:6px solid var(--bad);
    outline:none;
    background:rgba(255,255,255,0.03);
  }
  .opt-btn[disabled]{opacity:.85;cursor:not-allowed;pointer-events:none;}

  .feedback{margin-top:10px;border-radius:12px;padding:10px 12px;border:1px dashed rgba(255,255,255,0.18);background:rgba(255,255,255,0.03);color:var(--muted);}
  .feedback[hidden]{display:none;}
  .feedback b{color:var(--text)}

  .answer{margin-top:10px;padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,0.14);background:rgba(255,255,255,0.04)}
  .answer[hidden]{display:none;}
  .btnrow{display:flex;gap:10px;flex-wrap:wrap}
  .ghost, .primary{
    all:unset;cursor:pointer;border-radius:12px;padding:10px 14px;font-weight:650;border:1px solid rgba(255,255,255,0.18);
    background:rgba(255,255,255,0.03);
  }
  .primary{background:linear-gradient(90deg,var(--glow-cyan),var(--glow-purple));color:#0b0b12;border-color:transparent;}

  .score{
    margin:16px 0;padding:12px 14px;border-radius:14px;
    background:var(--glass);border:1px solid var(--glass-border);box-shadow: 0 2px 10px var(--white-haze), 0 0 18px rgba(255,255,255,0.06), 0 0 30px var(--white-outer);
    display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
  }
  .score .part{color:var(--muted);font-weight:600}
  .score b{color:var(--text)}

  table { width: 100%; border-collapse: collapse; margin-top: 10px; color: var(--text); }
  th, td { border: 1px solid var(--card-border); padding: 8px; text-align: left; }
  th { background: var(--glass); }
</style>
</head>
<body>
  <header class="titlebar">
    <div class="inner">
      <h1 class="grad-text">🦷 Dentistry 3rd year</h1>
      <p class="subtitle">Test based on Lecture 11</p>
    </div>
  </header>

  <main class="wrap">

    <h2 class="section-h"><span class="grad-text">اللَّهُمَّ لا سَهْلَ إِلَّا مَا جَعَلْتَهُ سَهْلًا، وَأَنْتَ تَجْعَلُ الحَزْنَ إِذَا شِئْتَ سَهْلًا</span></h2>

    <section class="score" id="scoreTop">
      <div class="part">MCQs: <b><span id="sMcq">0</span>/30</b></div>
      <div class="part">True/False: <b><span id="sTf">0</span>/9</b></div>
      <div class="part">SAQs: <b><span id="sSaq">0</span>/6</b></div>
      <div class="part">Total: <b><span id="sTotal">0</span>/45</b></div>
      <div class="btnrow">
        <button class="ghost" id="resetAll">Reset</button>
      </div>
    </section>

    <h2 class="section-h"><span class="grad-text">MCQs</span></h2>
    <div class="grid mcq" id="mcqGrid"></div>

    <h2 class="section-h"><span class="grad-text">True / False</span></h2>
    <div class="grid tf" id="tfGrid"></div>

    <h2 class="section-h"><span class="grad-text">Short Answer Questions</span></h2>
    <div class="grid" id="saqGrid"></div>

    <section class="score" id="scoreBottom">
      <div class="part">MCQs: <b><span id="sMcq2">0</span>/30</b></div>
      <div class="part">True/False: <b><span id="sTf2">0</span>/9</b></div>
      <div class="part">SAQs: <b><span id="sSaq2">0</span>/6</b></div>
      <div class="part">Total: <b><span id="sTotal2">0</span>/45</b></div>
    </section>
  </main>

<script>
const mcqs = [
  {
    q: "When is the most appropriate time to prescribe a radiograph for a patient?",
    opts: ["Immediately upon the patient's arrival at the clinic", "After obtaining medical/dental history and a clinical examination", "Before the clinical examination to save time", "Only if the patient insists on having one"],
    correct: 1,
    explain: "Radiographs should only be performed after a thorough medical and dental history has been obtained and a clinical examination made."
  },
  {
    q: "What is the primary factor that should guide the decision to take a radiograph?",
    opts: ["The availability of the X-ray machine", "Insurance requirements for pre-approval", "Diagnostic benefits outweighing radiation risks", "The patient's desire for a 'full' check-up"],
    correct: 2,
    explain: "Potential diagnostic and treatment planning benefits must outweigh the risks associated with radiation."
  },
  {
    q: "Which imaging modality provides the highest spatial resolution for teeth and supporting structures?",
    opts: ["Panoramic radiograph", "CBCT", "Intra-oral images", "MRI"],
    correct: 2,
    explain: "Intra-oral images provide the highest spatial resolution for examining teeth."
  },
  {
    q: "What is the primary limitation of periapical (IOPA) imaging?",
    opts: ["Low resolution", "Geometric distortion", "High radiation dose compared to CT", "Poor visualization of roots"],
    correct: 1,
    explain: "A limitation of periapical imaging is geometric distortion."
  },
  {
    q: "Which radiograph is optimal for revealing interproximal caries?",
    opts: ["Vertical bite-wing", "Occlusal X-ray", "Panoramic", "Periapical"],
    correct: 0,
    explain: "Bite-wing (specifically vertical bitewing) is optimal for revealing interproximal caries."
  },
  {
    q: "An occlusal X-ray is primarily used to:",
    opts: ["Replace bitewing images", "Supplement periapical and bitewing images for larger jaw areas", "Image the TMJ exclusively", "Provide cross-sectional soft tissue detail"],
    correct: 1,
    explain: "Occlusal X-rays supplement periapical and bitewing images for larger areas of the jaws."
  },
  {
    q: "Compared to intra-oral images, extra-oral images (like Panoramic) typically have:",
    opts: ["Higher spatial resolution", "Lower image resolution but larger anatomical view", "No geometric distortion", "Lower patient movement sensitivity"],
    correct: 1,
    explain: "Extra-oral images visualize a larger region but with much lower image resolution."
  },
  {
    q: "Which of the following is a disadvantage of panoramic imaging?",
    opts: ["Limited field of view", "High cost compared to MRI", "Superimposition of structures", "Excellent spatial resolution"],
    correct: 2,
    explain: "Disadvantages include lower spatial resolution, image distortion, and superimposition."
  },
  {
    q: "When should 'Advanced Imaging' (CT, CBCT, MRI) be prescribed?",
    opts: ["As a routine screening tool for all new patients", "When intra-oral or panoramic imaging fails to provide necessary info", "When the patient has a low radiation history", "To save time during the initial visit"],
    correct: 1,
    explain: "Advanced imaging should be made if intraoral or panoramic imaging does not provide the necessary info."
  },
  {
    q: "Which imaging technique is non-ionizing and best for soft tissue visualization?",
    opts: ["CBCT", "PET Scan", "MRI", "Scintigraphy"],
    correct: 2,
    explain: "MRI is non-ionizing and optimal for soft tissue."
  },
  {
    q: "What is the recommendation regarding previous diagnostic images?",
    opts: ["They are irrelevant once they are over 1 year old", "They should be discarded to avoid confusion", "They should be reviewed and compared with current images", "They should only be used if they were taken in the current clinic"],
    correct: 2,
    explain: "Dentists must review the patient's prior imaging history and attempt to obtain these images."
  },
  {
    q: "Which of the following is considered a 'Positive Historical Finding' according to ADA criteria?",
    opts: ["Malposed teeth", "Unexplained bleeding", "Previous periodontal or endodontic treatment", "Evidence of dental trauma"],
    correct: 2,
    explain: "Previous periodontal/endodontic treatment is a positive historical finding."
  },
  {
    q: "What is the ADA's stance on irradiating a patient 'just to see if there is something there'?",
    opts: ["It is a recommended screening protocol", "It is appropriate for annual checkups", "It is inappropriate", "It is only appropriate for edentulous patients"],
    correct: 2,
    explain: "It is inappropriate to irradiate a patient just to see if something is there, except bitewings for interproximal caries."
  },
  {
    q: "For a child with primary dentition and open proximal contacts, which is true?",
    opts: ["Full mouth series is mandatory", "Bitewings are required every 6 months", "Radiologic examination may not be required", "Panoramic X-ray is the gold standard"],
    correct: 2,
    explain: "Children without abnormality and with open contacts may not require a radiologic examination at this time."
  },
  {
    q: "In a child with mixed dentition, what is recommended to detect abnormalities in growth?",
    opts: ["Only periapical views of molars", "Bite-wings every 3 months", "Panoramic image or selected periapicals/occlusals", "CBCT scan of the entire skull"],
    correct: 2,
    explain: "Guidelines recommend bitewings for caries and panoramic/selected periapicals for growth/development."
  },
  {
    q: "A partially dentate adult with localized disease should receive:",
    opts: ["A full-mouth series regardless of the area", "A subset of images limited to the area of concern", "No radiographs at all", "MRI of the jaws"],
    correct: 1,
    explain: "If disease is localized, a more limited examination consisting of a subset of images may be completed."
  },
  {
    q: "What is the recall interval for bitewings in a child at high risk for caries?",
    opts: ["3-4 months", "6-12 months", "12-24 months", "24-36 months"],
    correct: 1,
    explain: "High-risk children and adolescents should have bitewings every 6-12 months."
  },
  {
    q: "What is the recall interval for bitewings in a low-risk adult patient?",
    opts: ["6-12 months", "12-24 months", "24-36 months", "48-60 months"],
    correct: 2,
    explain: "Low-risk adults are recommended bitewings every 24-36 months."
  },
  {
    q: "Which images are appropriate to monitor severity of periodontal bone loss?",
    opts: ["Only occlusal views", "MRI and PET Scans", "Combination of peri-apical and bite-wing images", "Cephalometric analysis"],
    correct: 2,
    explain: "Intraoral images (periapical and bitewing) are appropriate to monitor periodontal bone loss."
  },
  {
    q: "Administrative images are those required by:",
    opts: ["Radiologists for research", "The patient for their personal records", "Insurance companies to approve treatment", "The Ministry of Health for statistics"],
    correct: 2,
    explain: "Administrative images are required by insurance companies and typically do not benefit the patient."
  },
  {
    q: "What is 'Resolution' in the context of radiological examination choice?",
    opts: ["The ability to distinguish between soft tissues", "The amount of image detail required", "The speed of the sensor", "The thickness of the lead apron"],
    correct: 1,
    explain: "Resolution refers to the amount of image detail required."
  },
  {
    q: "Which imaging technique is associated with a high radiation dose and cross-sectional bone pathology views?",
    opts: ["IOPA", "Bitewing", "CT", "Ultrasonography"],
    correct: 2,
    explain: "CT provides cross-sectional anatomy for bone pathology but involves a high radiation dose."
  },
  {
    q: "The image receptor for a periapical radiograph should be placed:",
    opts: ["Perpendicular to the occlusal plane", "Parallel to the long axis of the teeth", "At a 45-degree angle to the palate", "Inside the vestibule exclusively"],
    correct: 1,
    explain: "The receptor is positioned parallel to the long axis of the teeth."
  },
  {
    q: "Bitewing receptors are placed adjacent to:",
    opts: ["The floor of the mouth", "The hard palate", "Crowns of a sextant and alveolar crests", "The ramus of the mandible"],
    correct: 2,
    explain: "Bitewing receptors are adjacent to the crowns and alveolar process crests."
  },
  {
    q: "Which finding is a 'Positive Clinical Sign' for prescribing radiographs?",
    opts: ["History of pain", "Familial history of anomalies", "Malposed or clinically impacted teeth", "Insurance request"],
    correct: 2,
    explain: "Malposed or clinically impacted teeth are positive clinical signs."
  },
  {
    q: "In Case Scenario 1 (5yo, open contacts, no caries), what was the decision?",
    opts: ["Immediate bitewings", "Panoramic for growth check", "No radiologic examination required", "Full mouth periapicals"],
    correct: 2,
    explain: "No radiologic exam is required because of open contacts and no clinical evidence of disease."
  },
  {
    q: "In Case Scenario 2 (25yo, fractured incisor, normal vitality), what was the decision?",
    opts: ["Annual panoramic X-ray", "Monthly periapical of the incisor", "No radiographs recommended", "Immediate CBCT to check for root fractures"],
    correct: 2,
    explain: "As long as the incisor shows normal vitality, no radiographs are recommended."
  },
  {
    q: "Patient movement during acquisition is a specific disadvantage mentioned for:",
    opts: ["IOPA", "Bitewing", "Panoramic", "Occlusal"],
    correct: 2,
    explain: "Patient movement is noted as a disadvantage for panoramic imaging."
  },
  {
    q: "Radiographs should be guided by:",
    opts: ["Clinic standard protocols (e.g., 'every 6 months')", "Clinical examination and tailored to patient needs", "The age of the patient only", "The budget of the patient"],
    correct: 1,
    explain: "Radiographs must be guided by examination and tailored to specific patient needs."
  },
  {
    q: "Which imaging technique is typically used for screening interproximal caries when no clinical signs exist?",
    opts: ["Panoramic", "CBCT", "Bitewing", "Periapical"],
    correct: 2,
    explain: "Bitewings are the exception where they can be used for detection when no clinical signs exist."
  }
];

const tfs = [
  {
    q: "Radiographs should be taken as a routine screening for all new patients before the physical exam.",
    answer: false,
    explain: "They should only be performed AFTER history and clinical examination."
  },
  {
    q: "Bitewing radiographs are optimal for revealing interproximal caries.",
    answer: true,
    explain: "This is their primary and optimal diagnostic task."
  },
  {
    q: "Panoramic imaging has higher spatial resolution than intraoral images.",
    answer: false,
    explain: "Panoramic images have lower spatial resolution compared to intraoral images."
  },
  {
    q: "MRI uses ionizing radiation to visualize soft tissues.",
    answer: false,
    explain: "MRI is non-ionizing."
  },
  {
    q: "Administrative images required by insurance companies typically benefit the patient directly.",
    answer: false,
    explain: "They do not usually benefit the patient's health/diagnosis."
  },
  {
    q: "In a cooperative child with primary dentition and closed contacts, bitewings are required.",
    answer: true,
    explain: "Bitewings are required to detect interproximal caries in closed contacts."
  },
  {
    q: "Previous radiographs from another clinic are not useful for a new dentist.",
    answer: false,
    explain: "They are helpful for comparison and dental history."
  },
  {
    q: "CBCT should only be used if standard intraoral or panoramic imaging is insufficient.",
    answer: true,
    explain: "Advanced imaging should be reserved for cases where basic imaging doesn't provide enough info."
  },
  {
    q: "Geometric distortion is a limitation specifically mentioned for periapical imaging.",
    answer: true,
    explain: "The lecture notes geometric distortion as a limitation of IOPA."
  }
];

const saqs = [
  {
    q: "Describe the criteria upon which a radiological examination depends.",
    a: "1. The perceived nature or severity of an abnormality.<br>2. The ability of the technique to reveal characteristic features (sensitivity/specificity).<br>3. The amount of image detail required (resolution).<br>4. The radiation dose to the patient."
  },
  {
    q: "List four common disadvantages associated with panoramic imaging.",
    a: "1. Lower spatial resolution than intraoral images.<br>2. Image distortion.<br>3. Superimposition of structures.<br>4. Patient movement during acquisition."
  },
  {
    q: "Compare the recall intervals for bitewing radiographs between high-risk and low-risk adult patients.",
    a: "<table><thead><tr><th>Patient Risk</th><th>Recall Interval</th></tr></thead><tbody><tr><td>High Risk</td><td>6-18 months</td></tr><tr><td>Low Risk</td><td>24-36 months</td></tr></tbody></table>"
  },
  {
    q: "A 5-year-old cooperative child presents for a first visit with open contacts and no clinical evidence of caries. Explain the radiographic recommendation and why.",
    a: "No radiologic examination is required. Because there are open contacts, interproximal caries can be assessed clinically, and developmental appraisals are incomplete/premature at this age."
  },
  {
    q: "List at least five positive clinical signs or symptoms that justify prescribing dental radiographs.",
    a: "1. Clinical evidence of periodontal disease.<br>2. Large or deep restorations.<br>3. Deep carious lesions.<br>4. Malposed or clinically impacted teeth.<br>5. Swelling."
  },
  {
    q: "Compare Intra-oral and Extra-oral images based on resolution and visualization area.",
    a: "<table><thead><tr><th>Feature</th><th>Intra-oral</th><th>Extra-oral</th></tr></thead><tbody><tr><td>Spatial Resolution</td><td>Highest</td><td>Much Lower</td></tr><tr><td>Anatomy Visualized</td><td>Localized (Teeth/Supports)</td><td>Larger region (Midface/Jaws)</td></tr></tbody></table>"
  }
];

const state = {
  mcq: Array(mcqs.length).fill(null),
  tf: Array(tfs.length).fill(null),
  saq: Array(saqs.length).fill(false)
};

function shuffleIndices(n){
  const arr = Array.from({length:n}, (_,i)=>i);
  for(let i=n-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}

const mcqGrid = document.getElementById('mcqGrid');
mcqs.forEach((item, idx)=>{
  const map = shuffleIndices(4);
  const visualToOriginal = map;
  const originalToVisual = Array(4);
  map.forEach((orig, v)=>{ originalToVisual[orig] = v; });
  const correctVisualIndex = originalToVisual[item.correct];

  const card = document.createElement('article');
  card.className='card qcard';
  card.dataset.type='mcq';
  card.dataset.index = idx;
  card.dataset.locked = 'false';
  card.innerHTML = `
    <p class="meta">Question ${idx+1} of ${mcqs.length}</p>
    <h3 class="qtitle">${item.q}</h3>
    <div class="opts">
      ${[0,1,2,3].map(v=>`
        <button class="opt-btn" data-v="${v}">
          <span class="key">${String.fromCharCode(65+v)}</span>
          <span class="label">${item.opts[ visualToOriginal[v] ]}</span>
        </button>
      `).join('')}
    </div>
    <div class="feedback" hidden></div>
  `;

  const buttons = card.querySelectorAll('.opt-btn');
  const feedback = card.querySelector('.feedback');

  function lock(){
    card.dataset.locked = 'true';
    buttons.forEach(b=>b.setAttribute('disabled',''));
  }

  buttons.forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(card.dataset.locked === 'true') return;
      const v = Number(btn.dataset.v);
      state.mcq[idx] = v;
      buttons.forEach(b=>b.classList.remove('correct','wrong'));
      const correctBtn = buttons[correctVisualIndex];
      correctBtn.classList.add('correct');
      if(v !== correctVisualIndex){
        btn.classList.add('wrong');
        feedback.hidden=false;
        feedback.innerHTML = `<b>Wrong ✖</b><br>Correct answer: <b>${String.fromCharCode(65+correctVisualIndex)}</b><br>${item.explain}`;
      }else{
        feedback.hidden=false;
        feedback.innerHTML = `<b>Correct ✔</b><br>Answer: <b>${String.fromCharCode(65+correctVisualIndex)}</b><br>${item.explain}`;
      }
      lock();
      recalc();
    });
  });
  mcqGrid.appendChild(card);
});

const tfGrid = document.getElementById('tfGrid');
tfs.forEach((item, idx)=>{
  const card = document.createElement('article');
  card.className='card qcard';
  card.dataset.type='tf';
  card.dataset.index = idx;
  card.dataset.locked = 'false';
  card.innerHTML = `
    <p class="meta">Statement ${idx+1} of ${tfs.length}</p>
    <h3 class="qtitle">${item.q}</h3>
    <div class="opts">
      <button class="opt-btn" data-v="true">
        <span class="key">T</span><span class="label">True</span>
      </button>
      <button class="opt-btn" data-v="false">
        <span class="key">F</span><span class="label">False</span>
      </button>
    </div>
    <div class="feedback" hidden></div>
  `;
  const buttons = card.querySelectorAll('.opt-btn');
  const feedback = card.querySelector('.feedback');
  function lock(){
    card.dataset.locked = 'true';
    buttons.forEach(b=>b.setAttribute('disabled',''));
  }
  buttons.forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(card.dataset.locked === 'true') return;
      const val = btn.dataset.v === "true";
      state.tf[idx] = val;
      buttons.forEach(b=>b.classList.remove('correct','wrong'));
      const correctBtn = Array.from(buttons).find(b => (b.dataset.v === (item.answer ? "true" : "false")));
      correctBtn.classList.add('correct');
      if(val !== item.answer){
        btn.classList.add('wrong');
        feedback.hidden=false;
        feedback.innerHTML = `<b>Wrong ✖</b><br>Correct: <b>${item.answer ? 'True' : 'False'}</b><br>${item.explain}`;
      }else{
        feedback.hidden=false;
        feedback.innerHTML = `<b>Correct ✔</b><br>Answer: <b>${item.answer ? 'True' : 'False'}</b><br>${item.explain}`;
      }
      lock();
      recalc();
    });
  });
  tfGrid.appendChild(card);
});

const saqGrid = document.getElementById('saqGrid');
saqs.forEach((item, idx)=>{
  const card = document.createElement('article');
  card.className='card qcard';
  card.dataset.type='saq';
  card.dataset.index = idx;
  card.innerHTML = `
    <p class="meta">Question ${idx + 1} of ${saqs.length}</p>
    <h3 class="qtitle">${item.q}</h3>
    <textarea rows="4" placeholder="Type your answer..." style="width:100%;padding:12px;border-radius:12px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.14);color:var(--text);"></textarea>
    <div class="btnrow" style="margin-top:10px">
      <button class="primary" data-act="reveal">Reveal Answer</button>
      <button class="ghost" data-act="toggle">I was correct</button>
    </div>
    <div class="answer" hidden>${item.a}</div>
  `;
  const revealBtn = card.querySelector('[data-act="reveal"]');
  const toggleBtn = card.querySelector('[data-act="toggle"]');
  const answer = card.querySelector('.answer');
  revealBtn.addEventListener('click', ()=>{
    answer.hidden = !answer.hidden;
    revealBtn.textContent = answer.hidden ? "Reveal Answer" : "Hide Answer";
  });
  toggleBtn.addEventListener('click', ()=>{
    const now = !state.saq[idx];
    state.saq[idx] = now;
    toggleBtn.textContent = now ? "✓ Counted as correct" : "I was correct";
    toggleBtn.style.outline = now ? "2px solid var(--ok)" : "none";
    recalc();
  });
  saqGrid.appendChild(card);
});

function recalc(){
  const mcqScore = state.mcq.reduce((s,v,i)=>{
    if(v===null) return s;
    const card = document.querySelector(`.qcard[data-type="mcq"][data-index="${i}"]`);
    return s + (card.querySelector('.feedback').textContent.startsWith("Correct") ? 1 : 0);
  },0);
  const tfScore = state.tf.reduce((s,v,i)=>{
    if(v===null) return s;
    const card = document.querySelector(`.qcard[data-type="tf"][data-index="${i}"]`);
    return s + (card.querySelector('.feedback').textContent.startsWith("Correct") ? 1 : 0);
  },0);
  const saqScore = state.saq.filter(Boolean).length;
  const total = mcqScore + tfScore + saqScore;

  const ids = ["sMcq","sTf","sSaq","sTotal","sMcq2","sTf2","sSaq2","sTotal2"];
  ids.forEach(id=>{
    const el = document.getElementById(id);
    if(el) {
       if(id.includes('Mcq')) el.textContent = mcqScore;
       else if(id.includes('Tf')) el.textContent = tfScore;
       else if(id.includes('Saq')) el.textContent = saqScore;
       else el.textContent = total;
    }
  });
}

document.getElementById('resetAll').addEventListener('click', ()=>{
  document.querySelectorAll('.qcard .feedback').forEach(f=>{f.hidden=true; f.innerHTML='';});
  document.querySelectorAll('.opt-btn').forEach(b=>{
    b.classList.remove('correct','wrong');
    b.removeAttribute('disabled');
  });
  document.querySelectorAll('.qcard[data-locked]').forEach(c=>{c.dataset.locked='false';});
  document.querySelectorAll('.qcard textarea').forEach(t=>t.value="");
  document.querySelectorAll('.qcard .answer').forEach(a=>a.hidden=true);
  document.querySelectorAll('[data-act="reveal"]').forEach(b=>b.textContent="Reveal Answer");
  document.querySelectorAll('[data-act="toggle"]').forEach(b=>{b.textContent="I was correct"; b.style.outline="none";});
  state.mcq.fill(null); state.tf.fill(null); state.saq.fill(false);
  recalc();
});
recalc();
</script>
</body>
</html>
