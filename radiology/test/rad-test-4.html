<!DOCTYPE html>
<html lang="en" style="direction:ltr;">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Interactive Exam • Glowing Dark Theme</title>
<meta name="color-scheme" content="dark" />
<style>
  :root{
    --bg:#0b0b12;
    --text:#f6f7fb;
    --muted:#a6afc6;
    --card:rgba(255,255,255,0.05);
    --card-border:rgba(255,255,255,0.12);
    --glass:rgba(255,255,255,0.04);
    --glass-border:rgba(255,255,255,0.10);
    --glow-cyan:#06b6d4;
    --glow-cyan-outer:rgba(6,182,212,0.40);
    --glow-purple:#8b5cf6;
    --glow-purple-outer:rgba(139,92,246,0.35);
    --white-haze:rgba(255,255,255,0.08);
    --white-outer:rgba(255,255,255,0.15);
    --radius:16px;
    --gap:1.25rem;
    --pad:1.5rem;
    --ok:#22c55e;  /* green */
    --bad:#ef4444; /* red */
  }

  *{box-sizing:border-box}
  body{margin:0;font:16px/1.65 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto;color:var(--text);background:var(--bg);min-height:100dvh;}
  .wrap{max-width:1100px;margin:0 auto;padding:24px;}

  .titlebar{
    position: static;z-index:10;
    backdrop-filter:saturate(140%) blur(8px);
    background:linear-gradient(180deg,rgba(11,11,18,0.75),rgba(11,11,18,0.35));
    border-bottom:1px solid var(--glass-border);
  }
  .titlebar .inner{max-width:1100px;margin:0 auto;padding:16px 24px;display:grid;gap:8px;align-items:center;}
  .grad-text{
    font-weight:800;
    letter-spacing:.3px;
    background:linear-gradient(90deg,var(--glow-cyan),var(--glow-purple));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 0 10px var(--glow-cyan-outer), 0 0 14px var(--glow-purple-outer);
  }
  h1.grad-text{font-size:clamp(1.6rem,2vw+1rem,2.6rem);margin:0;text-align:center;}
  .subtitle{margin:0;text-align:center;color:var(--muted);font-size:0.95rem}

  .section-h{
    margin:28px 0 14px;
    padding:12px 16px;
    border-radius:var(--radius);
    background:var(--glass);
    border:1px solid var(--glass-border);
    box-shadow: 0 2px 10px var(--white-haze), 0 0 18px rgba(255,255,255,0.06), 0 0 30px var(--white-outer);
    text-align:center;
    font-weight:750;
    font-size:1.15rem;
  }
  .section-h .grad-text{font-size:1.3rem;}

  .grid{display:grid;gap:var(--gap)}
  @media (min-width:800px){
    .grid.mcq{grid-template-columns:repeat(2,minmax(0,1fr));}
    .grid.tf {grid-template-columns:repeat(3,minmax(0,1fr));}
  }

  /* Cards (no accent on the card itself) */
  .card{
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:var(--radius);
    padding:var(--pad);
    box-shadow: 0 2px 8px var(--white-haze), 0 0 0 1px rgba(255,255,255,0.02), 0 0 24px rgba(255,255,255,0.06);
    position:relative;
  }

  .qtitle{font-weight:650;margin:0 0 12px}
  .meta{color:var(--muted);font-size:0.88rem;margin-bottom:10px}

  .opts{display:grid;gap:10px}
  .opt-btn{
    all:unset;cursor:pointer;display:flex;gap:10px;align-items:center;
    padding:12px 14px;border-radius:12px;
    background:rgba(255,255,255,0.03);
    border:1px solid rgba(255,255,255,0.10);
    transition:transform .06s ease, background .15s ease, border-color .15s ease;
  }
  .opt-btn .key{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-weight:700;
    background:linear-gradient(90deg,var(--glow-cyan),var(--glow-purple));color:#0b0b12;
    box-shadow:0 0 10px var(--glow-cyan-outer),0 0 10px var(--glow-purple-outer) inset;
  }
  .opt-btn:hover{transform:translateY(-1px);border-color:rgba(255,255,255,0.22);}

  /* Accent line ONLY on the chosen/correct answer box, no background highlight */
  .opt-btn.correct{
    border-left:6px solid var(--ok);
    outline:none;
    background:rgba(255,255,255,0.03);
  }
  .opt-btn.wrong{
    border-left:6px solid var(--bad);
    outline:none;
    background:rgba(255,255,255,0.03);
  }
  .opt-btn[disabled]{opacity:.85;cursor:not-allowed;pointer-events:none;}

  .feedback{margin-top:10px;border-radius:12px;padding:10px 12px;border:1px dashed rgba(255,255,255,0.18);background:rgba(255,255,255,0.03);color:var(--muted);}
  .feedback[hidden]{display:none;}
  .feedback b{color:var(--text)}

  .answer{margin-top:10px;padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,0.14);background:rgba(255,255,255,0.04)}
  .answer[hidden]{display:none;}
  .btnrow{display:flex;gap:10px;flex-wrap:wrap}
  .ghost, .primary{
    all:unset;cursor:pointer;border-radius:12px;padding:10px 14px;font-weight:650;border:1px solid rgba(255,255,255,0.18);
    background:rgba(255,255,255,0.03);
  }
  .primary{background:linear-gradient(90deg,var(--glow-cyan),var(--glow-purple));color:#0b0b12;border-color:transparent;}

  .score{
    margin:16px 0;padding:12px 14px;border-radius:14px;
    background:var(--glass);border:1px solid var(--glass-border);box-shadow: 0 2px 10px var(--white-haze), 0 0 18px rgba(255,255,255,0.06), 0 0 30px var(--white-outer);
    display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
  }
  .score .part{color:var(--muted);font-weight:600}
  .score b{color:var(--text)}
</style>
</head>
<body>
  <header class="titlebar">
    <div class="inner">
      <h1 class="grad-text">🦷 Dentistry 3rd year</h1>
      <p class="subtitle">Test based on Lecture 4</p>
    </div>
  </header>

  <main class="wrap">

    <h2 class="section-h"><span class="grad-text">اللَّهُمَّ لا سَهْلَ إِلَّا مَا جَعَلْتَهُ سَهْلًا، وَأَنْتَ تَجْعَلُ الحَزْنَ إِذَا شِئْتَ سَهْلًا</span></h2>

    <section class="score" id="scoreTop">
      <div class="part">MCQs: <b><span id="sMcq">0</span>/30</b></div>
      <div class="part">True/False: <b><span id="sTf">0</span>/9</b></div>
      <div class="part">SAQs: <b><span id="sSaq">0</span>/6</b></div>
      <div class="part">Total: <b><span id="sTotal">0</span>/45</b></div>
      <div class="btnrow">
        <button class="ghost" id="resetAll">Reset</button>
      </div>
    </section>

    <h2 class="section-h"><span class="grad-text">MCQs</span></h2>
    <div class="grid mcq" id="mcqGrid"></div>

    <h2 class="section-h"><span class="grad-text">True / False</span></h2>
    <div class="grid tf" id="tfGrid"></div>

    <h2 class="section-h"><span class="grad-text">Short Answer Questions</span></h2>
    <div class="grid" id="saqGrid"></div>

    <section class="score" id="scoreBottom">
      <div class="part">MCQs: <b><span id="sMcq2">0</span>/30</b></div>
      <div class="part">True/False: <b><span id="sTf2">0</span>/9</b></div>
      <div class="part">SAQs: <b><span id="sSaq2">0</span>/6</b></div>
      <div class="part">Total: <b><span id="sTotal2">0</span>/45</b></div>
    </section>
  </main>

<script>
// ----------- Data -----------
const mcqs = [
    {
        q: "Which type of radiation effect is characterized by cell death and is dependent on the radiation dose?",
        opts: ["Stochastic Effect", "Deterministic Effect", "Heritable Effect", "Carcinogenic Effect"],
        correct: 1,
        explain: "Deterministic effects are definitive damaging effects to the body from high-dose radiation, causing outcomes like organ damage (Slide 4)."
    },
    {
        q: "What does the ALARA principle, a cornerstone of radiation protection, stand for?",
        opts: ["As Long As Reasonably Attainable", "All Levels Are Readily Accessible", "As Low As Reasonably Achievable", "Always Lower All Radiation Annually"],
        correct: 2,
        explain: "The ALARA principle stands for 'As Low As Reasonably Achievable', acknowledging that even small doses may have stochastic effects (Slide 10)."
    },
    {
        q: "Which of the following is considered a source of natural background radiation?",
        opts: ["Medical X-rays", "Nuclear Medicine", "Consumer Products", "Cosmic Rays"],
        correct: 3,
        explain: "Cosmic (space) radiation is a form of external, natural background radiation (Slide 5)."
    },
    {
        q: "In dental radiology, radiation emitted from the substance through which X-rays pass is known as:",
        opts: ["Primary Beam", "Radiation Leakage", "Secondary and Scattered Radiation", "Focal Spot Radiation"],
        correct: 2,
        explain: "Secondary and Scattered Radiation is emitted by the substance (e.g., patient's head) that the primary X-ray beam passes through (Slide 8)."
    },
    {
        q: "According to the NCRP, what is the annual occupational effective dose limit for stochastic effects?",
        opts: ["100 mSv", "50 mSv", "20 mSv", "5 mSv"],
        correct: 1,
        explain: "The NCRP recommends a 50mSv annual effective dose limit for occupational exposure relative to stochastic effects (Slide 12)."
    },
    {
        q: "Which intra-oral dental film speed group is the fastest, requiring the least radiation exposure?",
        opts: ["Speed D", "Speed E", "Speed F", "Speed A"],
        correct: 2,
        explain: "Film speed is alphabetical, with F being the fastest. Speed F is twice as fast as E, which is twice as fast as D (Slide 17)."
    },
    {
        q: "What is the primary benefit of using a long Focal Spot-to-Film Distance (FSFD)?",
        opts: ["It increases film fog", "It reduces image resolution", "It reduces patient exposure", "It requires a faster film"],
        correct: 2,
        explain: "A long FSFD reduces patient exposure because the X-ray beam is less divergent (Slide 19)."
    },
    {
        q: "According to federal regulations, the X-ray beam for intra-oral radiography should not expose a skin surface area greater than:",
        opts: ["5 cm", "6 cm", "7 cm", "8 cm"],
        correct: 2,
        explain: "The patient skin surface exposed by X-rays should not be more than 7 cm when the machine operates above 50 kVp (Slide 21)."
    },
    {
        q: "Which type of Position Indicating Device (PID) is most effective at reducing patient exposure?",
        opts: ["Short, pointed cone", "Long, circular PID", "Short, circular PID", "Long, rectangular PID"],
        correct: 3,
        explain: "A rectangular PID reduces patient exposure by 71%-80%, which is better than a circular PID (Slide 24)."
    },
    {
        q: "What is the minimum aluminum filtration required for an X-ray machine operating at 70 kVp or below?",
        opts: ["1.0 mm", "1.5 mm", "2.0 mm", "2.5 mm"],
        correct: 1,
        explain: "Federal regulations require a minimum of 1.5 mm of aluminum filtration for X-ray machines operating at or below 70 kVp (Slide 26)."
    },
    {
        q: "The 'Position Distance Rule' for operator safety advises standing at what angle to the primary beam?",
        opts: ["0-45 degrees", "45-90 degrees", "90-135 degrees", "135-180 degrees"],
        correct: 2,
        explain: "The operator should be positioned at an angle of 90 to 135 degrees relative to the primary X-ray beam (Slide 29)."
    },
    {
        q: "Which device is used to monitor low levels of radiation exposure to personnel over time?",
        opts: ["Ionization Chamber", "Thermoluminescent Dosimeter (TLD)", "Film Badge", "Geiger Counter"],
        correct: 2,
        explain: "Film badges are used to monitor exposure to low levels of radiation received over time and evaluate safety practices (Slide 36)."
    },
    {
        q: "What material is most commonly used in thermoluminescent dosimetry (TLD)?",
        opts: ["Aluminum Oxide", "Calcium Tungstate", "Lithium Fluoride", "Gadolinium Oxide"],
        correct: 2,
        explain: "Lithium Fluoride (LiF) is the most widely used crystal for thermoluminescent radiation dosimetry (Slide 37)."
    },
    {
        q: "Which component of an X-ray machine head serves as a form of filtration?",
        opts: ["Cathode", "Metal Target", "Lead Collimator", "Aluminum disc"],
        correct: 3,
        explain: "An aluminum disc is placed in the path of the X-ray beam to filter out long-wavelength, less penetrating X-rays (Slide 26)."
    },
    {
        q: "An effect that 'may' develop when exposed to radiation, and does not depend on the dose amount, is called:",
        opts: ["Deterministic Effect", "Acute Radiation Syndrome", "Stochastic Effect", "Organ Damage"],
        correct: 2,
        explain: "Stochastic effects, like radiation carcinogenesis, are probabilistic and do not have a dose threshold (Slide 4)."
    },
    {
        q: "Combining a rare-earth screen with X-ray film can reduce radiation exposure by approximately:",
        opts: ["15%", "25%", "40%", "55%"],
        correct: 3,
        explain: "The combination of a rare-earth intensifying screen and X-ray film results in a 55% reduction of radiation exposure (Slide 18)."
    },
    {
        q: "What is the main purpose of a lead collimator in an X-ray machine?",
        opts: ["To filter the beam", "To increase the beam size", "To restrict the beam size", "To measure the radiation dose"],
        correct: 2,
        explain: "A lead collimator is a method used to limit or restrict the size of the X-ray beam, thereby reducing patient exposure (Slide 22-23)."
    },
    {
        q: "For non-occupational (public) exposure, the ICRP recommends an annual effective dose limit of:",
        opts: ["1 mSv", "5 mSv", "15 mSv", "50 mSv"],
        correct: 0,
        explain: "The ICRP recommends a 1 mSv annual effective dose limit for the public (Slide 12)."
    },
    {
        q: "Radiation that is emitted from the focal spot of the target is called:",
        opts: ["Scattered Radiation", "Leakage Radiation", "Secondary Radiation", "Primary Beam"],
        correct: 3,
        explain: "The Primary Beam is the useful radiation emitted directly from the focal spot of the target (Slide 8)."
    },
    {
        q: "The Victoreen condenser r-meter is a type of:",
        opts: ["Film Badge", "Ionization Chamber", "TLD Badge", "Ring Dosimeter"],
        correct: 1,
        explain: "The Victoreen condenser r-meter is a frequently used type of ionization chamber for measuring X-ray exposure (Slide 39)."
    },
    {
        q: "What is the recommended minimum distance an operator should maintain from the X-ray machine?",
        opts: ["3 feet", "4 feet", "5 feet", "6 feet"],
        correct: 3,
        explain: "The 'Position Distance Rule' specifies that the operator should maintain a distance of at least 6 feet from the machine (Slide 29)."
    },
    {
        q: "Which of these is NOT a method of reducing dental exposure during the conduct of an examination?",
        opts: ["Using a fast image receptor", "Using a lead apron", "Using a short FSFD", "Using beam collimation"],
        correct: 2,
        explain: "Using a long FSFD, not a short one, reduces patient exposure. All other options are valid methods of dose reduction (Slide 13, 19)."
    },
    {
        q: "Rare-earth elements like Gadolinium and Lanthanum, when used in intensifying screens, emit what color light?",
        opts: ["Blue Light", "Green Light", "Red Light", "Ultraviolet Light"],
        correct: 1,
        explain: "Gadolinium and Lanthanum are rare-earth elements that emit green light when exposed to X-rays (Slide 18)."
    },
    {
        q: "The primary aim of radiation protection, according to the ICRP/NCRP, is to protect humans without:",
        opts: ["Incurring any cost", "Using lead shielding", "Unduly limiting beneficial practices", "Exceeding background levels"],
        correct: 2,
        explain: "The aim is to provide protection without 'unduly limiting the beneficial practices giving rise to radiation exposure' (Slide 9)."
    },
    {
        q: "Which dosimetry method relies on heating a crystal to measure the amount of absorbed radiation?",
        opts: ["Film Badge Dosimetry", "Ionization Chamber", "Thermoluminescent Dosimetry (TLD)", "Pocket Dosimetry"],
        correct: 2,
        explain: "In TLD, a crystal (like LiF) is heated, causing trapped electrons to release visible light proportional to the absorbed energy (Slide 37)."
    },
    {
        q: "Which of the following is an example of an artificial source of radiation?",
        opts: ["Cosmic radiation", "Terrestrial radiation", "Radon", "Nuclear medicine"],
        correct: 3,
        explain: "Nuclear medicine is listed under 'Medical [Artificial]' sources of radiation, as opposed to natural background sources (Slide 5)."
    },
    {
        q: "Decreased film fog and increased image quality are beneficial effects of:",
        opts: ["Using a slow film", "Collimation", "Decreasing FSFD", "Removing filtration"],
        correct: 1,
        explain: "Beneficial effects of collimation include less patient exposure, decreased scattered radiation, decreased film fog, and increased image quality (Slide 21)."
    },
    {
        q: "What is the ICRP recommended equivalent dose limit for the lens of the eye for an occupational worker?",
        opts: ["50 mSv", "100 mSv", "150 mSv", "500 mSv"],
        correct: 2,
        explain: "Both ICRP and NCRP recommend a 150 mSv annual equivalent dose limit to the lens of the eye for occupational workers (Slide 12)."
    },
    {
        q: "Xenolite alloy sheeting is used in what type of protective equipment?",
        opts: ["Lead-free aprons", "Standard lead aprons", "Thyroid collars", "Lead-lined PIDs"],
        correct: 0,
        explain: "Xenolite is a lead-free alloy used in lightweight aprons that offer the same protection as traditional lead (Slide 33)."
    },
    {
        q: "Diagnostic radiographs should be prescribed:",
        opts: ["As a routine part of every check-up", "As an alternative to a clinical exam", "Only after a clinical examination", "For all new patients regardless of need"],
        correct: 2,
        explain: "Patient selection guidelines state that a diagnostic radiograph should be advised only after a clinical examination has been performed (Slide 14)."
    }
];

const tfs = [
    {
        q: "Stochastic effects of radiation have a clear dose threshold below which they do not occur.",
        answer: false,
        explain: "Stochastic effects do not have a dose threshold; they are probabilistic and can 'May' occur at any dose (Slide 4)."
    },
    {
        q: "The majority of human radiation exposure comes from artificial sources like medical X-rays.",
        answer: false,
        explain: "Approximately 83% of radiation exposure comes from natural sources, with only 17% from artificial sources (Slide 7)."
    },
    {
        q: "A longer Focal Spot-to-Film Distance (FSFD) increases the resolution of the resulting radiograph.",
        answer: true,
        explain: "In addition to reducing patient exposure, a longer FSFD also increases the resolution of the radiograph (Slide 19)."
    },
    {
        q: "Using a film holder can reduce patient exposure by up to 60%.",
        answer: true,
        explain: "Film holders help align the beam and film, reducing patient exposure by 60% (Slide 25)."
    },
    {
        q: "Federal regulations require a minimum of 2.5 mm of aluminum filtration for machines operating above 70 kVp.",
        answer: false,
        explain: "The regulation requires 2.0 mm of aluminum filtration for machines operating above 70 kVp, not 2.5 mm (Slide 26)."
    },
    {
        q: "Calcium Tungstate is a rare-earth element used in intensifying screens that emits green light.",
        answer: false,
        explain: "Calcium Tungstate emits blue light. Rare-earth elements like Gadolinium emit green light (Slide 18)."
    },
    {
        q: "Radiation Leakage refers to radiation emitted from the patient after exposure.",
        answer: false,
        explain: "Radiation Leakage is radiation emitted by any part of the X-ray tube other than the focal spot (Slide 8)."
    },
    {
        q: "A lead thyroid collar is an example of a protective barrier for the patient.",
        answer: true,
        explain: "A lead thyroid collar, along with a lead apron, is a protective barrier used to shield sensitive organs during radiography (Slide 30)."
    },
    {
        q: "The atomic number of Lithium Fluoride (LiF) makes it a poor choice for dosimetry in soft tissue.",
        answer: false,
        explain: "LiF has a low atomic number, and its radiation absorption characteristics are similar to that of soft tissue, making it ideal for dosimetry (Slide 38)."
    }
];

const saqs = [
    {
        q: "According to the lecture, what are the three main sources of radiation in dental radiology?",
        a: "1. <b>Primary Beam:</b> Emitted by the focal spot.<br>2. <b>Radiation Leakage:</b> Emitted by other parts of the X-ray tube.<br>3. <b>Secondary and Scattered Radiation:</b> Emitted by the substance through which X-rays are passing (e.g., the patient)."
    },
    {
        q: "Explain the 'Position Distance Rule' for an operator's safety during an X-ray exposure.",
        a: "The operator must stand at a minimum distance of <b>6 feet</b> from the X-ray machine and position themselves at an angle between <b>90 and 135 degrees</b> to the primary beam to minimize exposure to scattered radiation."
    },
    {
        q: "A dental office is upgrading its X-ray machine. The new unit operates at 85 kVp. What is the minimum thickness of aluminum filtration required by federal regulations, and what is the purpose of this filtration?",
        a: "The minimum required filtration is <b>2.0 mm of aluminum</b>. Its purpose is to absorb the low-energy, long-wavelength X-rays that have little diagnostic value and would otherwise be absorbed by the patient's skin, increasing their radiation dose."
    },
    {
        q: "List three distinct methods or devices used for X-ray beam collimation to reduce patient exposure.",
        a: "1. <b>Lead Collimator:</b> A lead disc placed at the exit port of the X-ray head.<br>2. <b>Position Indicating Device (PID):</b> An open-ended, lead-lined cone (rectangular is more effective than round).<br>3. <b>Film Holders:</b> Devices that align the film with the beam."
    },
    {
        q: "In a numbered table, compare Deterministic and Stochastic radiation effects based on their relationship with the dose and provide one example for each.",
        a: `<table style="width:100%; border-collapse: collapse; text-align: left;">
            <thead>
                <tr>
                    <th style="border: 1px solid var(--card-border); padding: 8px;">Feature</th>
                    <th style="border: 1px solid var(--card-border); padding: 8px;">Deterministic Effects</th>
                    <th style="border: 1px solid var(--card-border); padding: 8px;">Stochastic Effects</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td style="border: 1px solid var(--card-border); padding: 8px;">1. Dose Relationship</td>
                    <td style="border: 1px solid var(--card-border); padding: 8px;">Has a threshold; severity depends on dose.</td>
                    <td style="border: 1px solid var(--card-border); padding: 8px;">No threshold; probability depends on dose.</td>
                </tr>
                <tr>
                    <td style="border: 1px solid var(--card-border); padding: 8px;">2. Example</td>
                    <td style="border: 1px solid var(--card-border); padding: 8px;">Organ Damage / Acute Radiation Syndrome</td>
                    <td style="border: 1px solid var(--card-border); padding: 8px;">Radiation Carcinogenesis / Mutation</td>
                </tr>
            </tbody>
           </table>`
    },
    {
        q: "Describe the process by which a Thermoluminescent Dosimeter (TLD) measures radiation exposure.",
        a: "A TLD contains a crystal like Lithium Fluoride (LiF). When exposed to ionizing radiation, electrons in the crystal are raised to a higher energy state and become trapped. To get a reading, the crystal is heated. This heat causes the trapped electrons to fall back to their normal state, releasing the stored energy as visible light. The total amount of light emitted is directly proportional to the radiation dose absorbed by the crystal."
    }
];

// ----------- State -----------
const state = {
  mcq: Array(mcqs.length).fill(null), // null | selectedIndex
  tf: Array(tfs.length).fill(null),   // null | boolean
  saq: Array(saqs.length).fill(false) // self-marked
};

function shuffleIndices(n){
  const arr = Array.from({length:n}, (_,i)=>i);
  for(let i=n-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}

// ----------- Render MCQs -----------
const mcqGrid = document.getElementById('mcqGrid');
mcqs.forEach((item, idx)=>{
  const map = shuffleIndices(4);
  const visualToOriginal = map;
  const originalToVisual = Array(4);
  map.forEach((orig, v)=>{ originalToVisual[orig] = v; });
  const correctVisualIndex = originalToVisual[item.correct];

  const card = document.createElement('article');
  card.className='card qcard';
  card.dataset.type='mcq';
  card.dataset.index = idx;
  card.dataset.locked = 'false';
  card.innerHTML = `
    <p class="meta">Question ${idx+1} of ${mcqs.length}</p>
    <h3 class="qtitle">${item.q}</h3>
    <div class="opts">
      ${[0,1,2,3].map(v=>`
        <button class="opt-btn" data-v="${v}" aria-label="Answer option ${String.fromCharCode(65+v)}">
          <span class="key">${String.fromCharCode(65+v)}</span>
          <span class="label">${item.opts[ visualToOriginal[v] ]}</span>
        </button>
      `).join('')}
    </div>
    <div class="feedback" hidden></div>
  `;

  const buttons = card.querySelectorAll('.opt-btn');
  const feedback = card.querySelector('.feedback');

  function lock(){
    card.dataset.locked = 'true';
    buttons.forEach(b=>b.setAttribute('disabled',''));
  }

  buttons.forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(card.dataset.locked === 'true') return; // one attempt
      const v = Number(btn.dataset.v);
      state.mcq[idx] = v;

      // clear classes
      buttons.forEach(b=>b.classList.remove('correct','wrong'));

      // Always mark the correct option (green)
      const correctBtn = buttons[correctVisualIndex];
      correctBtn.classList.add('correct');

      if(v !== correctVisualIndex){
        // Mark chosen wrong option (red)
        btn.classList.add('wrong');
        feedback.hidden=false;
        feedback.innerHTML = `<b>Wrong ✖</b><br>Correct answer: <b>${String.fromCharCode(65+correctVisualIndex)}</b><br>${item.explain}`;
      }else{
        feedback.hidden=false;
        feedback.innerHTML = `<b>Correct ✔</b><br>Answer: <b>${String.fromCharCode(65+correctVisualIndex)}</b><br>${item.explain}`;
      }
      lock();
      recalc();
    });
  });

  mcqGrid.appendChild(card);
});

// ----------- Render True/False -----------
const tfGrid = document.getElementById('tfGrid');
tfs.forEach((item, idx)=>{
  const card = document.createElement('article');
  card.className='card qcard';
  card.dataset.type='tf';
  card.dataset.index = idx;
  card.dataset.locked = 'false';
  card.innerHTML = `
    <p class="meta">Statement ${idx+1} of ${tfs.length}</p>
    <h3 class="qtitle">${item.q}</h3>
    <div class="opts">
      <button class="opt-btn" data-v="true">
        <span class="key">T</span><span class="label">True</span>
      </button>
      <button class="opt-btn" data-v="false">
        <span class="key">F</span><span class="label">False</span>
      </button>
    </div>
    <div class="feedback" hidden></div>
  `;

  const buttons = card.querySelectorAll('.opt-btn');
  const feedback = card.querySelector('.feedback');

  function lock(){
    card.dataset.locked = 'true';
    buttons.forEach(b=>b.setAttribute('disabled',''));
  }

  buttons.forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(card.dataset.locked === 'true') return; // one attempt
      const val = btn.dataset.v === "true";
      state.tf[idx] = val;

      // clear classes
      buttons.forEach(b=>b.classList.remove('correct','wrong'));

      // Always mark the correct button (green)
      const correctBtn = Array.from(buttons).find(b => (b.dataset.v === (item.answer ? "true" : "false")));
      correctBtn.classList.add('correct');

      const isCorrect = (val === item.answer);
      if(!isCorrect){
        // mark chosen wrong (red)
        btn.classList.add('wrong');
        feedback.hidden=false;
        feedback.innerHTML = `<b>Wrong ✖</b><br>Correct answer: <b>${item.answer ? 'True' : 'False'}</b><br>${item.explain}`;
      }else{
        feedback.hidden=false;
        feedback.innerHTML = `<b>Correct ✔</b><br>Answer: <b>${item.answer ? 'True' : 'False'}</b><br>${item.explain}`;
      }

      lock();
      recalc();
    });
  });

  tfGrid.appendChild(card);
});

// ----------- Render SAQs -----------
const saqGrid = document.getElementById('saqGrid');
saqs.forEach((item, idx)=>{
  const card = document.createElement('article');
  card.className='card qcard';
  card.dataset.type='saq';
  card.dataset.index = idx;
  card.innerHTML = `
  <p class="meta">Question ${idx + 1} of ${saqs.length}</p>
  <h3 class="qtitle">${item.q}</h3>
  <textarea rows="4" placeholder="Type your answer..." style="width:100%;padding:12px;border-radius:12px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.14);color:var(--text);font-family:inherit;font-size:inherit;"></textarea>
  <div class="btnrow" style="margin-top:10px">
    <button class="primary" data-act="reveal">Reveal Answer</button>
    <button class="ghost" data-act="toggle">I was correct</button>
  </div>
  <div class="answer" hidden>${item.a}</div>
`;


  const revealBtn = card.querySelector('[data-act="reveal"]');
  const toggleBtn = card.querySelector('[data-act="toggle"]');
  const answer = card.querySelector('.answer');

  revealBtn.addEventListener('click', ()=>{
    answer.hidden = !answer.hidden;
    revealBtn.textContent = answer.hidden ? "Reveal Answer" : "Hide Answer";
  });

  toggleBtn.addEventListener('click', ()=>{
    const now = !state.saq[idx];
    state.saq[idx] = now;
    toggleBtn.textContent = now ? "✓ Counted as correct" : "I was correct";
    toggleBtn.style.outline = now ? "2px solid rgba(34,197,94,.7)" : "none";
    recalc();
  });

  saqGrid.appendChild(card);
});

// ----------- Score + Reset -----------
function recalc(){
  const mcqScore = state.mcq.reduce((s,v,i)=>{
    if(v===null) return s;
    const card = document.querySelector(`.qcard[data-type="mcq"][data-index="${i}"]`);
    const feedback = card.querySelector('.feedback').innerHTML;
    return s + (feedback.startsWith("<b>Correct") ? 1 : 0);
  },0);
  const tfScore = state.tf.reduce((s,v,i)=>{
    if(v===null) return s;
    const card = document.querySelector(`.qcard[data-type="tf"][data-index="${i}"]`);
    const feedback = card.querySelector('.feedback').innerHTML;
    return s + (feedback.startsWith("<b>Correct") ? 1 : 0);
  },0);
  const saqScore = state.saq.filter(Boolean).length;
  const total = mcqScore + tfScore + saqScore;

  const ids = ["sMcq","sTf","sSaq","sTotal","sMcq2","sTf2","sSaq2","sTotal2"];
  ids.forEach(id=>{
    const el = document.getElementById(id);
    if(!el) return;
    if(id.includes('Mcq')) el.textContent = mcqScore;
    if(id.includes('Tf')) el.textContent = tfScore;
    if(id.includes('Saq')) el.textContent = saqScore;
    if(id.includes('Total')) el.textContent = total;
  });
}

document.getElementById('resetAll').addEventListener('click', ()=>{
  document.querySelectorAll('.qcard .feedback').forEach(f=>{f.hidden=true; f.textContent=''; f.innerHTML='';});
  document.querySelectorAll('.opt-btn').forEach(b=>{
    b.classList.remove('correct','wrong');
    b.removeAttribute('disabled');
  });
  document.querySelectorAll('.qcard[data-type="mcq"], .qcard[data-type="tf"]').forEach(c=>{c.dataset.locked='false';});
  document.querySelectorAll('.qcard[data-type="saq"] textarea').forEach(t=>t.value="");
  document.querySelectorAll('.qcard[data-type="saq"] .answer').forEach(a=>a.hidden=true);
  document.querySelectorAll('.qcard[data-type="saq"] [data-act="reveal"]').forEach(b=>b.textContent="Reveal Answer");
  document.querySelectorAll('.qcard[data-type="saq"] [data-act="toggle"]').forEach(b=>{b.textContent="I was correct"; b.style.outline="none";});

  state.mcq.fill(null); state.tf.fill(null); state.saq.fill(false);
  recalc();
});

recalc();
</script>
