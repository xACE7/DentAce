<!DOCTYPE html>
<html lang="en" style="direction:ltr;">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Interactive Exam • Radiographic Image Receptors</title>
<meta name="color-scheme" content="dark" />
<style>
  :root{
    --bg:#0b0b12;
    --text:#f6f7fb;
    --muted:#a6afc6;
    --card:rgba(255,255,255,0.05);
    --card-border:rgba(255,255,255,0.12);
    --glass:rgba(255,255,255,0.04);
    --glass-border:rgba(255,255,255,0.10);
    --glow-cyan:#06b6d4;
    --glow-cyan-outer:rgba(6,182,212,0.40);
    --glow-purple:#8b5cf6;
    --glow-purple-outer:rgba(139,92,246,0.35);
    --white-haze:rgba(255,255,255,0.08);
    --white-outer:rgba(255,255,255,0.15);
    --radius:16px;
    --gap:1.25rem;
    --pad:1.5rem;
    --ok:#22c55e;  /* green */
    --bad:#ef4444; /* red */
  }

  *{box-sizing:border-box}
  body{margin:0;font:16px/1.65 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto;color:var(--text);background:var(--bg);min-height:100dvh;}
  .wrap{max-width:1100px;margin:0 auto;padding:24px;}

  .titlebar{
    position: static;z-index:10;
    backdrop-filter:saturate(140%) blur(8px);
    background:linear-gradient(180deg,rgba(11,11,18,0.75),rgba(11,11,18,0.35));
    border-bottom:1px solid var(--glass-border);
  }
  .titlebar .inner{max-width:1100px;margin:0 auto;padding:16px 24px;display:grid;gap:8px;align-items:center;}
  .grad-text{
    font-weight:800;
    letter-spacing:.3px;
    background:linear-gradient(90deg,var(--glow-cyan),var(--glow-purple));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 0 10px var(--glow-cyan-outer), 0 0 14px var(--glow-purple-outer);
  }
  h1.grad-text{font-size:clamp(1.6rem,2vw+1rem,2.6rem);margin:0;text-align:center;}
  .subtitle{margin:0;text-align:center;color:var(--muted);font-size:0.95rem}

  .section-h{
    margin:28px 0 14px;
    padding:12px 16px;
    border-radius:var(--radius);
    background:var(--glass);
    border:1px solid var(--glass-border);
    box-shadow: 0 2px 10px var(--white-haze), 0 0 18px rgba(255,255,255,0.06), 0 0 30px var(--white-outer);
    text-align:center;
    font-weight:750;
    font-size:1.15rem;
  }
  .section-h .grad-text{font-size:1.3rem;}

  .grid{display:grid;gap:var(--gap)}
  @media (min-width:800px){
    .grid.mcq{grid-template-columns:repeat(2,minmax(0,1fr));}
    .grid.tf {grid-template-columns:repeat(3,minmax(0,1fr));}
  }

  .card{
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:var(--radius);
    padding:var(--pad);
    box-shadow: 0 2px 8px var(--white-haze), 0 0 0 1px rgba(255,255,255,0.02), 0 0 24px rgba(255,255,255,0.06);
    position:relative;
  }

  .qtitle{font-weight:650;margin:0 0 12px}
  .meta{color:var(--muted);font-size:0.88rem;margin-bottom:10px}

  .opts{display:grid;gap:10px}
  .opt-btn{
    all:unset;cursor:pointer;display:flex;gap:10px;align-items:center;
    padding:12px 14px;border-radius:12px;
    background:rgba(255,255,255,0.03);
    border:1px solid rgba(255,255,255,0.10);
    transition:transform .06s ease, background .15s ease, border-color .15s ease;
  }
  .opt-btn .key{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-weight:700;
    background:linear-gradient(90deg,var(--glow-cyan),var(--glow-purple));color:#0b0b12;
    box-shadow:0 0 10px var(--glow-cyan-outer),0 0 10px var(--glow-purple-outer) inset;
  }
  .opt-btn:hover{transform:translateY(-1px);border-color:rgba(255,255,255,0.22);}

  .opt-btn.correct{
    border-left:6px solid var(--ok);
    outline:none;
    background:rgba(255,255,255,0.03);
  }
  .opt-btn.wrong{
    border-left:6px solid var(--bad);
    outline:none;
    background:rgba(255,255,255,0.03);
  }
  .opt-btn[disabled]{opacity:.85;cursor:not-allowed;pointer-events:none;}

  .feedback{margin-top:10px;border-radius:12px;padding:10px 12px;border:1px dashed rgba(255,255,255,0.18);background:rgba(255,255,255,0.03);color:var(--muted);}
  .feedback[hidden]{display:none;}
  .feedback b{color:var(--text)}

  .answer{margin-top:10px;padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,0.14);background:rgba(255,255,255,0.04)}
  .answer[hidden]{display:none;}
  .btnrow{display:flex;gap:10px;flex-wrap:wrap}
  .ghost, .primary{
    all:unset;cursor:pointer;border-radius:12px;padding:10px 14px;font-weight:650;border:1px solid rgba(255,255,255,0.18);
    background:rgba(255,255,255,0.03);
  }
  .primary{background:linear-gradient(90deg,var(--glow-cyan),var(--glow-purple));color:#0b0b12;border-color:transparent;}

  .score{
    margin:16px 0;padding:12px 14px;border-radius:14px;
    background:var(--glass);border:1px solid var(--glass-border);box-shadow: 0 2px 10px var(--white-haze), 0 0 18px rgba(255,255,255,0.06), 0 0 30px var(--white-outer);
    display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
  }
  .score .part{color:var(--muted);font-weight:600}
  .score b{color:var(--text)}

  table { width: 100%; border-collapse: collapse; margin-top: 10px; background: rgba(0,0,0,0.2); border-radius: 8px; overflow: hidden; }
  th, td { padding: 8px 12px; border: 1px solid rgba(255,255,255,0.1); text-align: left; font-size: 0.9rem; }
  th { background: rgba(255,255,255,0.05); color: var(--glow-cyan); }
</style>
</head>
<body>
  <header class="titlebar">
    <div class="inner">
      <h1 class="grad-text">🦷 Dentistry 3rd year</h1>
      <p class="subtitle">Test based on Lecture 8</p>
    </div>
  </header>

  <main class="wrap">
    <h2 class="section-h"><span class="grad-text">اللَّهُمَّ لا سَهْلَ إِلَّا مَا جَعَلْتَهُ سَهْلًا، وَأَنْتَ تَجْعَلُ الحَزْنَ إِذَا شِئْتَ سَهْلًا</span></h2>

    <section class="score" id="scoreTop">
      <div class="part">MCQs: <b><span id="sMcq">0</span>/30</b></div>
      <div class="part">True/False: <b><span id="sTf">0</span>/9</b></div>
      <div class="part">SAQs: <b><span id="sSaq">0</span>/6</b></div>
      <div class="part">Total: <b><span id="sTotal">0</span>/45</b></div>
      <div class="btnrow">
        <button class="ghost" id="resetAll">Reset Exam</button>
      </div>
    </section>

    <h2 class="section-h"><span class="grad-text">MCQs</span></h2>
    <div class="grid mcq" id="mcqGrid"></div>

    <h2 class="section-h"><span class="grad-text">True / False</span></h2>
    <div class="grid tf" id="tfGrid"></div>

    <h2 class="section-h"><span class="grad-text">Short Answer Questions</span></h2>
    <div class="grid" id="saqGrid"></div>

    <section class="score" id="scoreBottom">
      <div class="part">MCQs: <b><span id="sMcq2">0</span>/30</b></div>
      <div class="part">True/False: <b><span id="sTf2">0</span>/9</b></div>
      <div class="part">SAQs: <b><span id="sSaq2">0</span>/6</b></div>
      <div class="part">Total: <b><span id="sTotal2">0</span>/45</b></div>
    </section>
  </main>

<script>
const mcqs = [
  {
    q: "Which of the following is an analogue image receptor primarily sensitive to X-ray photons?",
    opts: ["Direct-action film", "Indirect-action film", "CCD sensor", "PSP plate"],
    correct: 0,
    explain: "Direct-action (non-screen) films are sensitive primarily to X-ray photons directly."
  },
  {
    q: "Indirect-action films are used in combination with what component?",
    opts: ["Intensifying screens", "Silicon crystals", "Photoconductor selenium", "Lead foil"],
    correct: 0,
    explain: "Indirect-action films are sensitive primarily to light photons emitted by adjacent intensifying screens."
  },
  {
    q: "The first digital image receptor adapted for intraoral imaging in 1987 was:",
    opts: ["CMOS", "CCD", "PSP", "Flat-panel detector"],
    correct: 1,
    explain: "CCD (Charge-Coupled Device) was introduced to dentistry in 1987."
  },
  {
    q: "Which intraoral film size is considered 'universal' for adults?",
    opts: ["Size #0", "Size #1", "Size #2", "Size #4"],
    correct: 2,
    explain: "Size #2 is the universal size for adults."
  },
  {
    q: "What component of the radiographic film acts as a support for the emulsion but does not contribute to the final image?",
    opts: ["Adhesive layer", "Plastic Base (Cellulose Acetate)", "Protective layer", "Silver halide crystals"],
    correct: 1,
    explain: "The plastic base (cellulose acetate) acts as a support and is clear and transparent."
  },
  {
    q: "The emulsion in direct-action film is typically composed of:",
    opts: ["Gadolinium Oxybromide", "Silver halide in gelatin", "Europium-doped barium", "Amorphous selenium"],
    correct: 1,
    explain: "Radiographic film emulsion consists of silver halide crystals."
  },
  {
    q: "CCD sensors are more sensitive to light than to x-rays. What material is coated on them to improve capture efficiency?",
    opts: ["Lead foil", "Gadolinium Oxybromide", "Cellulose Acetate", "Amorphous Silicon"],
    correct: 1,
    explain: "A layer of scintillating material (Gadolinium Oxybromide) is used to convert X-rays to light for the CCD."
  },
  {
    q: "How does CMOS technology differ fundamentally from CCD?",
    opts: ["It uses film packets", "Each pixel is isolated and connected to its own transistor", "It requires chemical processing", "It is sensitive to X-ray photons only"],
    correct: 1,
    explain: "In CMOS, each pixel is directly connected to a transistor, unlike the charge-shifting read method of CCD."
  },
  {
    q: "Which digital technology uses a 'photostimulable phosphor plate'?",
    opts: ["Solid-state technology", "CMOS", "PSP", "Flat-panel detectors"],
    correct: 2,
    explain: "PSP stands for Photostimulable Phosphor technology."
  },
  {
    q: "The phosphor material used in PSP plates is:",
    opts: ["Silver Bromide", "Gadolinium Oxybromide", "Europium-doped barium fluorohalide", "Cellulose Acetate"],
    correct: 2,
    explain: "PSP material is europium-doped barium fluorohalide."
  },
  {
    q: "In flat-panel detectors used for CBCT, what material is used as a photoconductor?",
    opts: ["Silicon", "Phosphor", "Selenium", "Silver"],
    correct: 2,
    explain: "Flat-panel detectors use a photoconductor material like selenium."
  },
  {
    q: "What is the primary function of the 'Adhesive' layer in an analogue film?",
    opts: ["Provides support", "Protects against mechanical damage", "Fixes the emulsion to the base", "Produces the image"],
    correct: 2,
    explain: "The adhesive fixes the emulsion to the plastic base."
  },
  {
    q: "The formation of a 'latent image' on analogue film involves:",
    opts: ["Electrical charging", "Chemical reaction", "Phosphorescence", "Silicon crystal excitation"],
    correct: 1,
    explain: "Analogue image formation involves a chemical reaction creating a latent image."
  },
  {
    q: "Which processing method is associated with 'wet processing'?",
    opts: ["Automatic processing", "Manual developing", "Digital enhancement", "Scanner processing"],
    correct: 1,
    explain: "Manual processing is often referred to as wet processing."
  },
  {
    q: "What is the recommended minimum distance for a safelight from the working area in a darkroom?",
    opts: ["0.5 meters", "1.2 meters (4 feet)", "2.0 meters", "3.0 meters"],
    correct: 1,
    explain: "Safelights should be positioned 1.2 m (4 feet) from the work surfaces."
  },
  {
    q: "The 'Time Temperature Method' is a type of:",
    opts: ["Automatic processing", "Manual developing", "Digital restoration", "PSP scanning"],
    correct: 1,
    explain: "Time Temperature and Visual methods are types of manual developing."
  },
  {
    q: "Which component of the manual processing requirements is used to recycle specific parts of the film packet?",
    opts: ["Biohazard container", "Recycle container for lead foil", "Washing tank", "Thermometer"],
    correct: 1,
    explain: "Lead foil should not be thrown in trash and requires a recycle container."
  },
  {
    q: "Which digital image processing operation acts to improve, restore, or analyze an image?",
    opts: ["Brightness and Contrast adjustment", "Image Restoration", "Sharpening and Smoothing", "All of the above"],
    correct: 3,
    explain: "Restoration, enhancement (brightness/contrast, sharpening), and color are all forms of digital processing."
  },
  {
    q: "Which intraoral film size is designated for 'Narrow anterior' use?",
    opts: ["Size #0", "Size #1", "Size #2", "Size #3"],
    correct: 1,
    explain: "Size #1 is for narrow anterior teeth."
  },
  {
    q: "In digital film, the formation of the latent image involves:",
    opts: ["Chemical reaction", "Electrically charged pixels", "Gelatin melting", "Silver halide precipitation"],
    correct: 1,
    explain: "Digital film/sensors form a latent image through electrical charging."
  },
  {
    q: "Which of the following is NOT a requirement for a darkroom?",
    opts: ["Absolute light-tightness", "Adequate washing facilities", "25W bulb with suitable filters", "Computer with image processing software"],
    correct: 3,
    explain: "A darkroom is for manual/analogue processing; a computer is for digital."
  },
  {
    q: "What is the purpose of the 'Protective layer' in radiographic film?",
    opts: ["Contains silver halide", "Supports the emulsion", "Shields emulsion from mechanical damage", "Filters X-ray photons"],
    correct: 2,
    explain: "The protective layer (clear gelatin) shields the emulsion from scratches/damage."
  },
  {
    q: "PSP plates release stored energy as light when stimulated by:",
    opts: ["X-rays", "Chemicals", "Another light of appropriate wavelength", "Heat"],
    correct: 2,
    explain: "PSP plates are 'photostimulable' meaning they are stimulated by light (usually a laser) to release the image."
  },
  {
    q: "The term 'Non-screen film' refers to:",
    opts: ["Indirect-action film", "Direct-action film", "CCD sensors", "CMOS sensors"],
    correct: 1,
    explain: "Direct-action film is also known as non-screen film."
  },
  {
    q: "Which digital receptor is described as 'reusable film' in the lecture slides?",
    opts: ["CCD", "CMOS", "PSP plate", "Flat-panel detector"],
    correct: 2,
    explain: "PSP plates are often described as reusable digital 'films'."
  },
  {
    q: "What happens to electrical charges in digital receptors before image formation?",
    opts: ["Converted to chemical energy", "Conveyed to computer and converted to digital signals", "Washed away in fixer solution", "Stored in lead foil"],
    correct: 1,
    explain: "Electrical charges are conveyed to the computer and converted to digital signals."
  },
  {
    q: "Which of the following is considered 'Solid state technology'?",
    opts: ["Direct-action film", "Indirect-action film", "CCD/CMOS sensors", "PSP plates"],
    correct: 2,
    explain: "CCD and CMOS are solid-state sensors."
  },
  {
    q: "Size #4 intraoral film is used for:",
    opts: ["Children", "Narrow anterior", "Adult bitewings", "Occlusal radiographs"],
    correct: 3,
    explain: "Size #4 is the occlusal film."
  },
  {
    q: "What is the maximum wattage recommended for a darkroom safelight bulb?",
    opts: ["15 W", "25 W", "60 W", "100 W"],
    correct: 1,
    explain: "A 25 W bulb is recommended for safelights."
  },
  {
    q: "Automatic processing differs from manual processing primarily by:",
    opts: ["Using different chemicals", "Automating the movement of film through solutions", "Not requiring a darkroom ever", "Only being used for digital films"],
    correct: 1,
    explain: "Automatic processing automates the sequence of development, fixing, and washing."
  }
];

const tfs = [
  {
    q: "Indirect-action film is sensitive primarily to X-ray photons rather than light photons.",
    answer: false,
    explain: "Indirect-action film is sensitive primarily to light photons emitted by intensifying screens."
  },
  {
    q: "Size #0 intraoral film is used for pediatric (child) patients.",
    answer: true,
    explain: "Size #0 is specifically designed for children."
  },
  {
    q: "The plastic base of a radiographic film contributes significantly to the final image density.",
    answer: false,
    explain: "The base does not contribute to the final image; it acts as a support."
  },
  {
    q: "CCD sensors were introduced to dentistry in 1987.",
    answer: true,
    explain: "This was the first digital image receptor adapted for intraoral imaging."
  },
  {
    q: "CMOS pixels are read using a charge-shifting mechanism similar to CCD.",
    answer: false,
    explain: "CMOS pixels are read individually via directly connected transistors."
  },
  {
    q: "Flat-panel detectors are currently limited to specialized tasks such as CBCT due to cost.",
    answer: true,
    explain: "They are relatively expensive compared to standard sensors."
  },
  {
    q: "PSP plates use silver halide crystals to store energy from X-rays.",
    answer: false,
    explain: "PSP plates use europium-doped barium fluorohalide phosphor."
  },
  {
    q: "Manual processing requires absolute light-tightness in the darkroom.",
    answer: true,
    explain: "Total darkness is required to prevent fogging/exposing the film before development."
  },
  {
    q: "Lead foil from film packets can be safely disposed of in regular household trash.",
    answer: false,
    explain: "Lead foil must be placed in a recycle container and not thrown in the trash."
  }
];

const saqs = [
  {
    q: "Describe the four basic components of a radiographic direct-action film.",
    a: "1. Plastic Base (Cellulose Acetate): Clear support for emulsion.<br>2. Adhesive: Fixes emulsion to the base.<br>3. Emulsion: Sensitive layer on both sides (silver halide).<br>4. Protective Layer: Clear gelatin to prevent mechanical damage."
  },
  {
    q: "List the requirements for a manual processing darkroom.",
    a: "<table><tr><th>#</th><th>Requirement</th></tr><tr><td>1</td><td>Absolute light-tightness</td></tr><tr><td>2</td><td>Adequate washing facilities</td></tr><tr><td>3</td><td>Infection control items (gloves, disinfectant)</td></tr><tr><td>4</td><td>Biohazard/Recycle containers</td></tr><tr><td>5</td><td>White light and Safelights (1.2m away)</td></tr></table>"
  },
  {
    q: "Compare Analogue and Digital image formation principles.",
    a: "<table><tr><th>Feature</th><th>Analogue Film</th><th>Digital Sensor</th></tr><tr><td>Latent Image</td><td>Chemical Reaction</td><td>Electrical Charge</td></tr><tr><td>Processing</td><td>Chemical Solutions</td><td>Signal conversion by computer</td></tr><tr><td>Visual Output</td><td>Developed film</td><td>Computer Screen</td></tr></table>"
  },
  {
    q: "A clinician is choosing between CCD and CMOS for a new clinic. Explain the fundamental architectural difference between these two technologies.",
    a: "In a CCD, the charges of the pixels are shifted across the chip to be read at one corner. In CMOS, each pixel is isolated from its neighbors and is directly connected to its own transistor for immediate reading."
  },
  {
    q: "What are the two types of manual developing methods?",
    a: "1. Time Temperature Method<br>2. Visual Method"
  },
  {
    q: "List the specific intraoral film packet sizes and their typical uses.",
    a: "<table><tr><th>Size</th><th>Application</th></tr><tr><td>#0</td><td>Child</td></tr><tr><td>#1</td><td>Narrow anterior</td></tr><tr><td>#2</td><td>Adult (universal)</td></tr><tr><td>#3</td><td>Preformed bitewing</td></tr><tr><td>#4</td><td>Occlusal</td></tr></table>"
  }
];

const state = {
  mcq: Array(mcqs.length).fill(null),
  tf: Array(tfs.length).fill(null),
  saq: Array(saqs.length).fill(false)
};

function shuffleIndices(n){
  const arr = Array.from({length:n}, (_,i)=>i);
  for(let i=n-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}

const mcqGrid = document.getElementById('mcqGrid');
mcqs.forEach((item, idx)=>{
  const map = shuffleIndices(4);
  const visualToOriginal = map;
  const originalToVisual = Array(4);
  map.forEach((orig, v)=>{ originalToVisual[orig] = v; });
  const correctVisualIndex = originalToVisual[item.correct];

  const card = document.createElement('article');
  card.className='card qcard';
  card.dataset.type='mcq';
  card.dataset.index = idx;
  card.dataset.locked = 'false';
  card.innerHTML = `
    <p class="meta">Question ${idx+1} of ${mcqs.length}</p>
    <h3 class="qtitle">${item.q}</h3>
    <div class="opts">
      ${[0,1,2,3].map(v=>`
        <button class="opt-btn" data-v="${v}" aria-label="Answer option ${String.fromCharCode(65+v)}">
          <span class="key">${String.fromCharCode(65+v)}</span>
          <span class="label">${item.opts[ visualToOriginal[v] ]}</span>
        </button>
      `).join('')}
    </div>
    <div class="feedback" hidden></div>
  `;

  const buttons = card.querySelectorAll('.opt-btn');
  const feedback = card.querySelector('.feedback');

  function lock(){
    card.dataset.locked = 'true';
    buttons.forEach(b=>b.setAttribute('disabled',''));
  }

  buttons.forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(card.dataset.locked === 'true') return;
      const v = Number(btn.dataset.v);
      state.mcq[idx] = v;

      buttons.forEach(b=>b.classList.remove('correct','wrong'));
      const correctBtn = buttons[correctVisualIndex];
      correctBtn.classList.add('correct');

      if(v !== correctVisualIndex){
        btn.classList.add('wrong');
        feedback.hidden=false;
        feedback.innerHTML = `<b>Wrong ✖</b><br>Correct answer: <b>${String.fromCharCode(65+correctVisualIndex)}</b><br>${item.explain}`;
      }else{
        feedback.hidden=false;
        feedback.innerHTML = `<b>Correct ✔</b><br>Answer: <b>${String.fromCharCode(65+correctVisualIndex)}</b><br>${item.explain}`;
      }
      lock();
      recalc();
    });
  });

  mcqGrid.appendChild(card);
});

const tfGrid = document.getElementById('tfGrid');
tfs.forEach((item, idx)=>{
  const card = document.createElement('article');
  card.className='card qcard';
  card.dataset.type='tf';
  card.dataset.index = idx;
  card.dataset.locked = 'false';
  card.innerHTML = `
    <p class="meta">Statement ${idx+1} of ${tfs.length}</p>
    <h3 class="qtitle">${item.q}</h3>
    <div class="opts">
      <button class="opt-btn" data-v="true">
        <span class="key">T</span><span class="label">True</span>
      </button>
      <button class="opt-btn" data-v="false">
        <span class="key">F</span><span class="label">False</span>
      </button>
    </div>
    <div class="feedback" hidden></div>
  `;

  const buttons = card.querySelectorAll('.opt-btn');
  const feedback = card.querySelector('.feedback');

  function lock(){
    card.dataset.locked = 'true';
    buttons.forEach(b=>b.setAttribute('disabled',''));
  }

  buttons.forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(card.dataset.locked === 'true') return;
      const val = btn.dataset.v === "true";
      state.tf[idx] = val;

      buttons.forEach(b=>b.classList.remove('correct','wrong'));
      const correctBtn = Array.from(buttons).find(b => (b.dataset.v === (item.answer ? "true" : "false")));
      correctBtn.classList.add('correct');

      const isCorrect = (val === item.answer);
      if(!isCorrect){
        btn.classList.add('wrong');
        feedback.hidden=false;
        feedback.innerHTML = `<b>Wrong ✖</b><br>Correct answer: <b>${item.answer ? 'True' : 'False'}</b><br>${item.explain}`;
      }else{
        feedback.hidden=false;
        feedback.innerHTML = `<b>Correct ✔</b><br>Answer: <b>${item.answer ? 'True' : 'False'}</b><br>${item.explain}`;
      }

      lock();
      recalc();
    });
  });

  tfGrid.appendChild(card);
});

const saqGrid = document.getElementById('saqGrid');
saqs.forEach((item, idx)=>{
  const card = document.createElement('article');
  card.className='card qcard';
  card.dataset.type='saq';
  card.dataset.index = idx;
  card.innerHTML = `
    <p class="meta">Question ${idx + 1} of ${saqs.length}</p>
    <h3 class="qtitle">${item.q}</h3>
    <textarea rows="4" placeholder="Type your answer here..." style="width:100%;padding:12px;border-radius:12px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.14);color:var(--text);font-family:inherit;"></textarea>
    <div class="btnrow" style="margin-top:10px">
      <button class="primary" data-act="reveal">Reveal Answer</button>
      <button class="ghost" data-act="toggle">I was correct</button>
    </div>
    <div class="answer" hidden>${item.a}</div>
  `;

  const revealBtn = card.querySelector('[data-act="reveal"]');
  const toggleBtn = card.querySelector('[data-act="toggle"]');
  const answer = card.querySelector('.answer');

  revealBtn.addEventListener('click', ()=>{
    answer.hidden = !answer.hidden;
    revealBtn.textContent = answer.hidden ? "Reveal Answer" : "Hide Answer";
  });

  toggleBtn.addEventListener('click', ()=>{
    const now = !state.saq[idx];
    state.saq[idx] = now;
    toggleBtn.textContent = now ? "✓ Counted as correct" : "I was correct";
    toggleBtn.style.outline = now ? "2px solid rgba(34,197,94,.7)" : "none";
    recalc();
  });

  saqGrid.appendChild(card);
});

function recalc(){
  const mcqScore = state.mcq.reduce((s,v,i)=>{
    if(v===null) return s;
    const card = document.querySelector(`.qcard[data-type="mcq"][data-index="${i}"]`);
    const fb = card.querySelector('.feedback').textContent;
    return s + (fb.startsWith("Correct") ? 1 : 0);
  },0);
  const tfScore = state.tf.reduce((s,v,i)=>{
    if(v===null) return s;
    const card = document.querySelector(`.qcard[data-type="tf"][data-index="${i}"]`);
    const fb = card.querySelector('.feedback').textContent;
    return s + (fb.startsWith("Correct") ? 1 : 0);
  },0);
  const saqScore = state.saq.filter(Boolean).length;
  const total = mcqScore + tfScore + saqScore;

  const ids = ["sMcq","sTf","sSaq","sTotal","sMcq2","sTf2","sSaq2","sTotal2"];
  ids.forEach(id=>{
    const el = document.getElementById(id);
    if(!el) return;
    if(id.includes('Mcq')) el.textContent = mcqScore;
    if(id.includes('Tf')) el.textContent = tfScore;
    if(id.includes('Saq')) el.textContent = saqScore;
    if(id.includes('Total')) el.textContent = total;
  });
}

document.getElementById('resetAll').addEventListener('click', ()=>{
  document.querySelectorAll('.qcard .feedback').forEach(f=>{f.hidden=true; f.textContent=''; f.innerHTML='';});
  document.querySelectorAll('.opt-btn').forEach(b=>{
    b.classList.remove('correct','wrong');
    b.removeAttribute('disabled');
  });
  document.querySelectorAll('.qcard[data-type="mcq"], .qcard[data-type="tf"]').forEach(c=>{c.dataset.locked='false';});
  document.querySelectorAll('.qcard[data-type="saq"] textarea').forEach(t=>t.value="");
  document.querySelectorAll('.qcard[data-type="saq"] .answer').forEach(a=>a.hidden=true);
  document.querySelectorAll('.qcard[data-type="saq"] [data-act="reveal"]').forEach(b=>b.textContent="Reveal Answer");
  document.querySelectorAll('.qcard[data-type="saq"] [data-act="toggle"]').forEach(b=>{b.textContent="I was correct"; b.style.outline="none";});

  state.mcq.fill(null); state.tf.fill(null); state.saq.fill(false);
  recalc();
});

window.onload = recalc;
</script>
</body>
</html>
