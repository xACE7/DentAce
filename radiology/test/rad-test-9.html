<!DOCTYPE html>
<html lang="en" style="direction:ltr;">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Interactive Exam • Panoramic Radiography</title>
<meta name="color-scheme" content="dark" />
<style>
  :root{
    --bg:#0b0b12;
    --text:#f6f7fb;
    --muted:#a6afc6;
    --card:rgba(255,255,255,0.05);
    --card-border:rgba(255,255,255,0.12);
    --glass:rgba(255,255,255,0.04);
    --glass-border:rgba(255,255,255,0.10);
    --glow-cyan:#06b6d4;
    --glow-cyan-outer:rgba(6,182,212,0.40);
    --glow-purple:#8b5cf6;
    --glow-purple-outer:rgba(139,92,246,0.35);
    --white-haze:rgba(255,255,255,0.08);
    --white-outer:rgba(255,255,255,0.15);
    --radius:16px;
    --gap:1.25rem;
    --pad:1.5rem;
    --ok:#22c55e;
    --bad:#ef4444;
  }

  *{box-sizing:border-box}
  body{margin:0;font:16px/1.65 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto;color:var(--text);background:var(--bg);min-height:100dvh;}
  .wrap{max-width:1100px;margin:0 auto;padding:24px;}

  .titlebar{
    position: static;z-index:10;
    backdrop-filter:saturate(140%) blur(8px);
    background:linear-gradient(180deg,rgba(11,11,18,0.75),rgba(11,11,18,0.35));
    border-bottom:1px solid var(--glass-border);
  }
  .titlebar .inner{max-width:1100px;margin:0 auto;padding:16px 24px;display:grid;gap:8px;align-items:center;}
  .grad-text{
    font-weight:800;
    letter-spacing:.3px;
    background:linear-gradient(90deg,var(--glow-cyan),var(--glow-purple));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 0 10px var(--glow-cyan-outer), 0 0 14px var(--glow-purple-outer);
  }
  h1.grad-text{font-size:clamp(1.6rem,2vw+1rem,2.6rem);margin:0;text-align:center;}
  .subtitle{margin:0;text-align:center;color:var(--muted);font-size:0.95rem}

  .section-h{
    margin:28px 0 14px;
    padding:12px 16px;
    border-radius:var(--radius);
    background:var(--glass);
    border:1px solid var(--glass-border);
    box-shadow: 0 2px 10px var(--white-haze), 0 0 18px rgba(255,255,255,0.06), 0 0 30px var(--white-outer);
    text-align:center;
    font-weight:750;
    font-size:1.15rem;
  }
  .section-h .grad-text{font-size:1.3rem;}

  .grid{display:grid;gap:var(--gap)}
  @media (min-width:800px){
    .grid.mcq{grid-template-columns:repeat(2,minmax(0,1fr));}
    .grid.tf {grid-template-columns:repeat(3,minmax(0,1fr));}
  }

  .card{
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:var(--radius);
    padding:var(--pad);
    box-shadow: 0 2px 8px var(--white-haze), 0 0 0 1px rgba(255,255,255,0.02), 0 0 24px rgba(255,255,255,0.06);
    position:relative;
  }

  .qtitle{font-weight:650;margin:0 0 12px}
  .meta{color:var(--muted);font-size:0.88rem;margin-bottom:10px}

  .opts{display:grid;gap:10px}
  .opt-btn{
    all:unset;cursor:pointer;display:flex;gap:10px;align-items:center;
    padding:12px 14px;border-radius:12px;
    background:rgba(255,255,255,0.03);
    border:1px solid rgba(255,255,255,0.10);
    transition:transform .06s ease, background .15s ease, border-color .15s ease;
  }
  .opt-btn .key{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-weight:700;
    background:linear-gradient(90deg,var(--glow-cyan),var(--glow-purple));color:#0b0b12;
    box-shadow:0 0 10px var(--glow-cyan-outer),0 0 10px var(--glow-purple-outer) inset;
  }
  .opt-btn:hover{transform:translateY(-1px);border-color:rgba(255,255,255,0.22);}

  .opt-btn.correct{
    border-left:6px solid var(--ok);
    outline:none;
    background:rgba(255,255,255,0.03);
  }
  .opt-btn.wrong{
    border-left:6px solid var(--bad);
    outline:none;
    background:rgba(255,255,255,0.03);
  }
  .opt-btn[disabled]{opacity:.85;cursor:not-allowed;pointer-events:none;}

  .feedback{margin-top:10px;border-radius:12px;padding:10px 12px;border:1px dashed rgba(255,255,255,0.18);background:rgba(255,255,255,0.03);color:var(--muted);}
  .feedback[hidden]{display:none;}
  .feedback b{color:var(--text)}

  .answer{margin-top:10px;padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,0.14);background:rgba(255,255,255,0.04)}
  .answer[hidden]{display:none;}
  .btnrow{display:flex;gap:10px;flex-wrap:wrap}
  .ghost, .primary{
    all:unset;cursor:pointer;border-radius:12px;padding:10px 14px;font-weight:650;border:1px solid rgba(255,255,255,0.18);
    background:rgba(255,255,255,0.03);
  }
  .primary{background:linear-gradient(90deg,var(--glow-cyan),var(--glow-purple));color:#0b0b12;border-color:transparent;}

  .score{
    margin:16px 0;padding:12px 14px;border-radius:14px;
    background:var(--glass);border:1px solid var(--glass-border);box-shadow: 0 2px 10px var(--white-haze), 0 0 18px rgba(255,255,255,0.06), 0 0 30px var(--white-outer);
    display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
  }
  .score .part{color:var(--muted);font-weight:600}
  .score b{color:var(--text)}
</style>
</head>
<body>
  <header class="titlebar">
    <div class="inner">
      <h1 class="grad-text">🦷 Dentistry 3rd year</h1>
      <p class="subtitle">Test based on Lecture 9</p>
    </div>
  </header>

  <main class="wrap">
    <h2 class="section-h"><span class="grad-text">اللَّهُمَّ لا سَهْلَ إِلَّا مَا جَعَلْتَهُ سَهْلًا، وَأَنْتَ تَجْعَلُ الحَزْنَ إِذَا شِئْتَ سَهْلًا</span></h2>

    <section class="score" id="scoreTop">
      <div class="part">MCQs: <b><span id="sMcq">0</span>/30</b></div>
      <div class="part">True/False: <b><span id="sTf">0</span>/9</b></div>
      <div class="part">SAQs: <b><span id="sSaq">0</span>/6</b></div>
      <div class="part">Total: <b><span id="sTotal">0</span>/45</b></div>
      <div class="btnrow">
        <button class="ghost" id="resetAll">Reset</button>
      </div>
    </section>

    <h2 class="section-h"><span class="grad-text">MCQs</span></h2>
    <div class="grid mcq" id="mcqGrid"></div>

    <h2 class="section-h"><span class="grad-text">True / False</span></h2>
    <div class="grid tf" id="tfGrid"></div>

    <h2 class="section-h"><span class="grad-text">Short Answer Questions</span></h2>
    <div class="grid" id="saqGrid"></div>

    <section class="score" id="scoreBottom">
      <div class="part">MCQs: <b><span id="sMcq2">0</span>/30</b></div>
      <div class="part">True/False: <b><span id="sTf2">0</span>/9</b></div>
      <div class="part">SAQs: <b><span id="sSaq2">0</span>/6</b></div>
      <div class="part">Total: <b><span id="sTotal2">0</span>/45</b></div>
    </section>
  </main>

<script>
const mcqs = [
  {
    q: "What is the primary definition of 'Tomography' in radiography?",
    opts: ["Imaging one layer while blurring others", "Producing a 3D reconstruction of the skull", "Using ultrasonic waves for dental mapping", "Measuring the density of the alveolar bone"],
    correct: 0,
    explain: "Tomography allows imaging of one specific section while blurring structures in other planes."
  },
  {
    q: "The term 'OPG' stands for which of the following?",
    opts: ["Oral Panoramic Graph", "OrthoPantomoGram", "Optical Periapical Gauge", "Occlusal Planar Geometry"],
    correct: 1,
    explain: "OPG is the abbreviation for OrthoPantomoGram."
  },
  {
    q: "Which sensor types are commonly used in digital panoramic machines?",
    opts: ["PSP and CCD", "CMOS and PSP", "CCD and CMOS", "Direct and Indirect Se sensors"],
    correct: 2,
    explain: "The lecture specifies CCD (Charged Couple Device) and CMOS (Complementary Metal Oxide Semiconductor)."
  },
  {
    q: "What is the typical kVp range for a panoramic radiograph?",
    opts: ["40-50 kVp", "50-60 kVp", "60-80 kVp", "90-110 kVp"],
    correct: 2,
    explain: "Appropriate exposure settings are typically in the range of 60-80 kVp."
  },
  {
    q: "Which parameter remains fixed and cannot be changed on panoramic machines?",
    opts: ["Voltage (kVp)", "Current (mA)", "Exposure time", "Collimator width"],
    correct: 2,
    explain: "The lecture notes that exposure time cannot be changed."
  },
  {
    q: "What is the standard exposure dose range for a panoramic radiograph?",
    opts: ["1-5 μSv", "9-26 μSv", "40-60 μSv", "100-200 μSv"],
    correct: 1,
    explain: "The typical exposure is 9-26 μSv."
  },
  {
    q: "Why is a thyroid collar contraindicated during panoramic radiography?",
    opts: ["It causes allergic skin reactions", "It interferes with the head positioner", "It might block part of the x-ray beam", "It increases secondary radiation scatter"],
    correct: 2,
    explain: "A thyroid collar might block the beam as it rotates around the patient's neck area."
  },
  {
    q: "How many light beam marker guides are used for head positioning?",
    opts: ["1", "2", "3", "4"],
    correct: 2,
    explain: "There are 3 light beam guides: Mid-sagittal, Frankfurt, and Canine."
  },
  {
    q: "The 'Focal Trough' is best described as having what shape?",
    opts: ["Rectangular", "Spherical", "Horse shoe shaped", "Linear"],
    correct: 2,
    explain: "The focal trough corresponds to the shape of the dental arches, which is horse shoe shaped."
  },
  {
    q: "What happens to the anterior teeth on the image if the patient is positioned too far forward (Anterior to focal trough)?",
    opts: ["Wide and blurred", "Narrow and blurred", "Shifted to the right", "Appears as a ghost image"],
    correct: 1,
    explain: "Teeth too anterior results in narrowing and blurring of the anterior teeth."
  },
  {
    q: "If the patient's head is tipped down (Frankfurt plane down), what is the characteristic appearance?",
    opts: ["Frown-like appearance", "Straight occlusal line", "Smiling appearance", "Double image of the spine"],
    correct: 2,
    explain: "Tipping the head down results in an exaggerated 'smiling' appearance."
  },
  {
    q: "Which condition results in a 'frown' or reversed smile on an OPG?",
    opts: ["Head tipped down", "Head tipped up", "Head turned to the left", "Teeth too posterior"],
    correct: 1,
    explain: "Head tipped up (Frankfurt plane up) results in a flat or reversed 'smiling' (downward) curve."
  },
  {
    q: "Where is an object located if it produces a 'Ghost Image'?",
    opts: ["Inside the focal trough", "Between x-ray source and center of rotation", "Behind the receptor", "At the midline of the patient"],
    correct: 1,
    explain: "Ghost images form when an object is between the source and the center of rotation."
  },
  {
    q: "What is a characteristic of a Ghost Image?",
    opts: ["Found on the same side", "Sharper than the real image", "Appears higher up on the radiograph", "Smaller than the real image"],
    correct: 2,
    explain: "Ghost images appear on the opposite side, are blurred, and appear higher up."
  },
  {
    q: "In panoramic units, how many collimators are used?",
    opts: ["One circular collimator", "One rectangular collimator", "Two collimators", "None (uses a slit source)"],
    correct: 2,
    explain: "Panoramic units use two collimators (one at the source, one at the receptor)."
  },
  {
    q: "The DICOM standard is primarily used for:",
    opts: ["Dental insurance coding", "Handling and transmitting medical images", "Sterilizing radiographic equipment", "Patient scheduling"],
    correct: 1,
    explain: "DICOM is the standard for handling, storage, and transmission of medical images."
  },
  {
    q: "Which anatomical structure is a common source of a ghost image?",
    opts: ["Incisive foramen", "Hyoid bone", "Nasal septum", "Genial tubercles"],
    correct: 1,
    explain: "Common ghost images include the hyoid bone and cervical spine."
  },
  {
    q: "What is a 'Double Image' in panoramic radiography?",
    opts: ["An artifact from patient movement", "A pair of real images of a midline object", "A ghost image that looks identical to the real one", "Two different exposures on one film"],
    correct: 1,
    explain: "Double images occur with midline objects intercepted twice by the beam."
  },
  {
    q: "Which indication is specifically mentioned for OPG in children?",
    opts: ["Caries detection in primary teeth", "Mixed dentition analysis", "Checking for tongue tie", "Monitoring fluoride levels"],
    correct: 1,
    explain: "OPG is used for mixed dentition analysis to check development."
  },
  {
    q: "During the exposure cycle, the center of rotation in modern machines:",
    opts: ["Remains fixed at one point", "Moves in a straight line", "Continuously changes/moves", "Is located at the sensor"],
    correct: 2,
    explain: "Popular mechanical patterns use a continuously moving rotation center."
  },
  {
    q: "How should the patient's teeth be positioned on the bite block?",
    opts: ["Mandibular teeth behind maxillary teeth", "Maxillary teeth behind mandibular teeth", "Edge to edge in the grooves", "Widely separated"],
    correct: 2,
    explain: "Incisors should be placed edge to edge in the grooves of the bite block."
  },
  {
    q: "If the patient's head is turned to the right, how do the teeth on the right side appear?",
    opts: ["Larger", "Smaller", "Higher", "Disappear"],
    correct: 1,
    explain: "The teeth are smaller on the side to which the head is turned (and larger on the opposite side)."
  },
  {
    q: "What dimension of the focal trough is associated with the 'Green arrows' in the lecture diagram?",
    opts: ["Front-to-back", "Side-to-side (Bucolingual)", "Up-and-down (Vertical)", "Time-of-exposure"],
    correct: 1,
    explain: "Green arrows represent the side-to-side or bucolingual dimension."
  },
  {
    q: "The movement of the x-ray tube and the receptor is described as:",
    opts: ["Stationary", "Synchronized in opposite directions", "Rotating in the same direction", "Random oscillation"],
    correct: 1,
    explain: "As the tube head moves in one direction, the receptor moves in the opposite direction synchronously."
  },
  {
    q: "Which is a major disadvantage of panoramic radiography?",
    opts: ["High radiation dose compared to CT", "High cost of consumables", "Geometric distortion and magnification", "Very long exposure time"],
    correct: 2,
    explain: "Disadvantages include poor image sharpness, magnification, and geometric distortion."
  },
  {
    q: "What happens if the patient is too far back (Posterior to focal trough)?",
    opts: ["Narrowing of teeth", "Widening/horizontal elongation of teeth", "Vertical foreshortening", "Ghosting of the palate"],
    correct: 1,
    explain: "Teeth too posterior result in horizontally elongated (increased width) images."
  },
  {
    q: "Panoramic radiography is contraindicated for examining which region according to the 'Note' on page 5?",
    opts: ["TMJ", "Mandibular molars", "Anterior teeth", "Maxillary tuberosity"],
    correct: 2,
    explain: "The notes mention that OPG is often avoided for anterior teeth due to the spine/vertebra shadow."
  },
  {
    q: "Which component of the panoramic unit helps stabilize the patient?",
    opts: ["Exposure control", "Head positioner", "Collimator", "X-ray tube head"],
    correct: 1,
    explain: "The head positioner (including guides/bite blocks) stabilizes the patient."
  },
  {
    q: "What determines the width of the focal trough in a specific area?",
    opts: ["The kVp used", "The speed of the sensor", "The distance from rotation center to teeth", "The patient's age"],
    correct: 2,
    explain: "The closer the rotation center is to the teeth, the narrower the focal trough."
  },
  {
    q: "Double images only occur with objects falling in which zone?",
    opts: ["Lateral ramus area", "Posterior to the sensor", "Diamond shaped zone in the midline", "The hyoid bone"],
    correct: 2,
    explain: "Double images occur with midline objects falling in the diamond shaped zone."
  }
];

const tfs = [
  {
    q: "Panoramic radiography provides an unobstructed view in every direction.",
    answer: true,
    explain: "The term 'panoramic' literally means an unobstructed view of a region in every direction."
  },
  {
    q: "Digital panoramic machines do not allow for contrast and density adjustments after acquisition.",
    answer: false,
    explain: "Digital software allows for modification of image characteristics like contrast and density."
  },
  {
    q: "A lead apron with a thyroid collar should always be used for OPG.",
    answer: false,
    explain: "A thyroid collar is avoided because it can block the beam."
  },
  {
    q: "The Frankfurt plane should be positioned perpendicular to the floor.",
    answer: false,
    explain: "The Frankfurt plane should be roughly parallel to the floor; the Mid-sagittal plane is perpendicular."
  },
  {
    q: "A ghost image appears on the same side as the real object.",
    answer: false,
    explain: "Ghost images appear on the opposite side of the radiograph."
  },
  {
    q: "Double images are always blurred.",
    answer: true,
    explain: "According to the lecture, both ghost images and double images are characteristically blurred."
  },
  {
    q: "Patient acceptance for panoramic radiography is generally high.",
    answer: true,
    explain: "This is listed as one of the primary advantages of the technique."
  },
  {
    q: "The exposure time in panoramic radiography is easily adjustable by the operator.",
    answer: false,
    explain: "The lecture explicitly states that exposure time cannot be changed."
  },
  {
    q: "The focal trough is a two-dimensional flat plane.",
    answer: false,
    explain: "The focal trough is a three-dimensional curved zone."
  }
];

const saqs = [
  {
    q: "Describe the characteristics of a ghost image as seen on a panoramic radiograph.",
    a: "1. Appears on the opposite side of the film.<br>2. Has the same morphology as its real counterpart.<br>3. Appears higher up on the radiograph.<br>4. Is more blurred than the real image.<br>5. It is reversed (left to right shifted)."
  },
  {
    q: "List four indications for performing a panoramic radiograph.",
    a: "1. Evaluation of pathology (impacted teeth, cysts, tumors).<br>2. Mixed dentition analysis.<br>3. TMJ disorders.<br>4. Alveolar bone levels in periodontal disease."
  },
  {
    q: "Provide a comparison between Intraoral and Panoramic collimation in a table format.",
    a: `<table border="1" style="width:100%; border-collapse: collapse; margin-top:10px;">
        <tr><th>Feature</th><th>Intraoral</th><th>Panoramic</th></tr>
        <tr><td>Number</td><td>One Collimator</td><td>Two Collimators</td></tr>
        <tr><td>Shape</td><td>Round or Rectangular</td><td>Narrow Rectangular Slit</td></tr>
      </table>`
  },
  {
    q: "A patient presents for an OPG wearing large metal earrings. Explain what will appear on the resulting radiograph and why.",
    a: "The earrings will produce both 'Real Images' and 'Ghost Images'. The ghost image will appear on the opposite side of the film, higher up, and more blurred than the real earring, because the object (earring) is located between the x-ray source and the center of rotation."
  },
  {
    q: "List the components of the three-dimensional focal trough.",
    a: "1. Front-to-back (Anterior-posterior).<br>2. Side-to-side (Bucolingual).<br>3. Up-and-down (Vertical)."
  },
  {
    q: "Explain the basic working principle of tomography used in OPG.",
    a: "Tomography allows imaging of one layer while blurring others. In OPG, this is achieved by the synchronized movement of the X-ray tube and the receptor in opposite directions around the patient's head, keeping the focal trough in sharp focus while blurring out other planes."
  }
];

const state = {
  mcq: Array(mcqs.length).fill(null),
  tf: Array(tfs.length).fill(null),
  saq: Array(saqs.length).fill(false)
};

function shuffleIndices(n){
  const arr = Array.from({length:n}, (_,i)=>i);
  for(let i=n-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}

const mcqGrid = document.getElementById('mcqGrid');
mcqs.forEach((item, idx)=>{
  const map = shuffleIndices(4);
  const visualToOriginal = map;
  const originalToVisual = Array(4);
  map.forEach((orig, v)=>{ originalToVisual[orig] = v; });
  const correctVisualIndex = originalToVisual[item.correct];

  const card = document.createElement('article');
  card.className='card qcard';
  card.dataset.type='mcq';
  card.dataset.index = idx;
  card.dataset.locked = 'false';
  card.innerHTML = `
    <p class="meta">Question ${idx+1} of ${mcqs.length}</p>
    <h3 class="qtitle">${item.q}</h3>
    <div class="opts">
      ${[0,1,2,3].map(v=>`
        <button class="opt-btn" data-v="${v}" aria-label="Answer option ${String.fromCharCode(65+v)}">
          <span class="key">${String.fromCharCode(65+v)}</span>
          <span class="label">${item.opts[ visualToOriginal[v] ]}</span>
        </button>
      `).join('')}
    </div>
    <div class="feedback" hidden></div>
  `;

  const buttons = card.querySelectorAll('.opt-btn');
  const feedback = card.querySelector('.feedback');

  function lock(){
    card.dataset.locked = 'true';
    buttons.forEach(b=>b.setAttribute('disabled',''));
  }

  buttons.forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(card.dataset.locked === 'true') return;
      const v = Number(btn.dataset.v);
      state.mcq[idx] = v;
      buttons.forEach(b=>b.classList.remove('correct','wrong'));
      const correctBtn = buttons[correctVisualIndex];
      correctBtn.classList.add('correct');
      if(v !== correctVisualIndex){
        btn.classList.add('wrong');
        feedback.hidden=false;
        feedback.innerHTML = `<b>Wrong ✖</b><br>Correct answer: <b>${String.fromCharCode(65+correctVisualIndex)}</b><br>${item.explain}`;
      }else{
        feedback.hidden=false;
        feedback.innerHTML = `<b>Correct ✔</b><br>Answer: <b>${String.fromCharCode(65+correctVisualIndex)}</b><br>${item.explain}`;
      }
      lock();
      recalc();
    });
  });
  mcqGrid.appendChild(card);
});

const tfGrid = document.getElementById('tfGrid');
tfs.forEach((item, idx)=>{
  const card = document.createElement('article');
  card.className='card qcard';
  card.dataset.type='tf';
  card.dataset.index = idx;
  card.dataset.locked = 'false';
  card.innerHTML = `
    <p class="meta">Statement ${idx+1} of ${tfs.length}</p>
    <h3 class="qtitle">${item.q}</h3>
    <div class="opts">
      <button class="opt-btn" data-v="true">
        <span class="key">T</span><span class="label">True</span>
      </button>
      <button class="opt-btn" data-v="false">
        <span class="key">F</span><span class="label">False</span>
      </button>
    </div>
    <div class="feedback" hidden></div>
  `;

  const buttons = card.querySelectorAll('.opt-btn');
  const feedback = card.querySelector('.feedback');

  function lock(){
    card.dataset.locked = 'true';
    buttons.forEach(b=>b.setAttribute('disabled',''));
  }

  buttons.forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(card.dataset.locked === 'true') return;
      const val = btn.dataset.v === "true";
      state.tf[idx] = val;
      buttons.forEach(b=>b.classList.remove('correct','wrong'));
      const correctBtn = Array.from(buttons).find(b => (b.dataset.v === (item.answer ? "true" : "false")));
      correctBtn.classList.add('correct');
      const isCorrect = (val === item.answer);
      if(!isCorrect){
        btn.classList.add('wrong');
        feedback.hidden=false;
        feedback.innerHTML = `<b>Wrong ✖</b><br>Correct answer: <b>${item.answer ? 'True' : 'False'}</b><br>${item.explain}`;
      }else{
        feedback.hidden=false;
        feedback.innerHTML = `<b>Correct ✔</b><br>Answer: <b>${item.answer ? 'True' : 'False'}</b><br>${item.explain}`;
      }
      lock();
      recalc();
    });
  });
  tfGrid.appendChild(card);
});

const saqGrid = document.getElementById('saqGrid');
saqs.forEach((item, idx)=>{
  const card = document.createElement('article');
  card.className='card qcard';
  card.dataset.type='saq';
  card.dataset.index = idx;
  card.innerHTML = `
  <p class="meta">Question ${idx + 1} of ${saqs.length}</p>
  <h3 class="qtitle">${item.q}</h3>
  <textarea rows="4" placeholder="Type your answer..." style="width:100%;padding:12px;border-radius:12px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.14);color:var(--text);"></textarea>
  <div class="btnrow" style="margin-top:10px">
    <button class="primary" data-act="reveal">Reveal Answer</button>
    <button class="ghost" data-act="toggle">I was correct</button>
  </div>
  <div class="answer" hidden>${item.a}</div>
`;
  const revealBtn = card.querySelector('[data-act="reveal"]');
  const toggleBtn = card.querySelector('[data-act="toggle"]');
  const answer = card.querySelector('.answer');

  revealBtn.addEventListener('click', ()=>{
    answer.hidden = !answer.hidden;
    revealBtn.textContent = answer.hidden ? "Reveal Answer" : "Hide Answer";
  });

  toggleBtn.addEventListener('click', ()=>{
    const now = !state.saq[idx];
    state.saq[idx] = now;
    toggleBtn.textContent = now ? "✓ Counted as correct" : "I was correct";
    toggleBtn.style.outline = now ? "2px solid rgba(34,197,94,.7)" : "none";
    recalc();
  });
  saqGrid.appendChild(card);
});

function recalc(){
  const mcqScore = state.mcq.reduce((s,v,i)=>{
    if(v===null) return s;
    const card = document.querySelector(`.qcard[data-type="mcq"][data-index="${i}"]`);
    const feedback = card.querySelector('.feedback').textContent;
    return s + (feedback.startsWith("Correct") ? 1 : 0);
  },0);
  const tfScore = state.tf.reduce((s,v,i)=>{
    if(v===null) return s;
    const card = document.querySelector(`.qcard[data-type="tf"][data-index="${i}"]`);
    const feedback = card.querySelector('.feedback').textContent;
    return s + (feedback.startsWith("Correct") ? 1 : 0);
  },0);
  const saqScore = state.saq.filter(Boolean).length;
  const total = mcqScore + tfScore + saqScore;

  const ids = ["sMcq","sTf","sSaq","sTotal","sMcq2","sTf2","sSaq2","sTotal2"];
  ids.forEach(id=>{
    const el = document.getElementById(id);
    if(!el) return;
    if(id.includes('Mcq')) el.textContent = mcqScore;
    if(id.includes('Tf')) el.textContent = tfScore;
    if(id.includes('Saq')) el.textContent = saqScore;
    if(id.includes('Total')) el.textContent = total;
  });
}

document.getElementById('resetAll').addEventListener('click', ()=>{
  document.querySelectorAll('.qcard .feedback').forEach(f=>{f.hidden=true; f.textContent=''; f.innerHTML='';});
  document.querySelectorAll('.opt-btn').forEach(b=>{
    b.classList.remove('correct','wrong');
    b.removeAttribute('disabled');
  });
  document.querySelectorAll('.qcard[data-type="mcq"], .qcard[data-type="tf"]').forEach(c=>{c.dataset.locked='false';});
  document.querySelectorAll('.qcard[data-type="saq"] textarea').forEach(t=>t.value="");
  document.querySelectorAll('.qcard[data-type="saq"] .answer').forEach(a=>a.hidden=true);
  document.querySelectorAll('.qcard[data-type="saq"] [data-act="reveal"]').forEach(b=>b.textContent="Reveal Answer");
  document.querySelectorAll('.qcard[data-type="saq"] [data-act="toggle"]').forEach(b=>{b.textContent="I was correct"; b.style.outline="none";});
  state.mcq.fill(null); state.tf.fill(null); state.saq.fill(false);
  recalc();
});

recalc();
</script>
</body>
</html>
