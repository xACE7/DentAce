<!DOCTYPE html>
<html lang="en" style="direction:ltr;">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Lecture 7: Advanced Imaging Modalities - Test</title>
<meta name="color-scheme" content="dark" />
<style>
  :root{
    --bg:#0b0b12;
    --text:#f6f7fb;
    --muted:#a6afc6;
    --card:rgba(255,255,255,0.05);
    --card-border:rgba(255,255,255,0.12);
    --glass:rgba(255,255,255,0.04);
    --glass-border:rgba(255,255,255,0.10);
    --glow-cyan:#06b6d4;
    --glow-cyan-outer:rgba(6,182,212,0.40);
    --glow-purple:#8b5cf6;
    --glow-purple-outer:rgba(139,92,246,0.35);
    --white-haze:rgba(255,255,255,0.08);
    --white-outer:rgba(255,255,255,0.15);
    --radius:16px;
    --gap:1.25rem;
    --pad:1.5rem;
    --ok:#22c55e;
    --bad:#ef4444;
  }

  *{box-sizing:border-box}
  body{margin:0;font:16px/1.65 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto;color:var(--text);background:var(--bg);min-height:100dvh;}
  .wrap{max-width:1100px;margin:0 auto;padding:24px;}

  .titlebar{
    position: static;z-index:10;
    backdrop-filter:saturate(140%) blur(8px);
    background:linear-gradient(180deg,rgba(11,11,18,0.75),rgba(11,11,18,0.35));
    border-bottom:1px solid var(--glass-border);
  }
  .titlebar .inner{max-width:1100px;margin:0 auto;padding:16px 24px;display:grid;gap:8px;align-items:center;}
  .grad-text{
    font-weight:800;
    letter-spacing:.3px;
    background:linear-gradient(90deg,var(--glow-cyan),var(--glow-purple));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 0 10px var(--glow-cyan-outer), 0 0 14px var(--glow-purple-outer);
  }
  h1.grad-text{font-size:clamp(1.6rem,2vw+1rem,2.6rem);margin:0;text-align:center;}
  .subtitle{margin:0;text-align:center;color:var(--muted);font-size:0.95rem}

  .section-h{
    margin:28px 0 14px;
    padding:12px 16px;
    border-radius:var(--radius);
    background:var(--glass);
    border:1px solid var(--glass-border);
    box-shadow: 0 2px 10px var(--white-haze), 0 0 18px rgba(255,255,255,0.06), 0 0 30px var(--white-outer);
    text-align:center;
    font-weight:750;
    font-size:1.15rem;
  }
  .section-h .grad-text{font-size:1.3rem;}

  .grid{display:grid;gap:var(--gap)}
  @media (min-width:800px){
    .grid.mcq{grid-template-columns:repeat(2,minmax(0,1fr));}
    .grid.tf {grid-template-columns:repeat(3,minmax(0,1fr));}
  }

  .card{
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:var(--radius);
    padding:var(--pad);
    box-shadow: 0 2px 8px var(--white-haze), 0 0 0 1px rgba(255,255,255,0.02), 0 0 24px rgba(255,255,255,0.06);
    position:relative;
  }

  .qtitle{font-weight:650;margin:0 0 12px}
  .meta{color:var(--muted);font-size:0.88rem;margin-bottom:10px}

  .opts{display:grid;gap:10px}
  .opt-btn{
    all:unset;cursor:pointer;display:flex;gap:10px;align-items:center;
    padding:12px 14px;border-radius:12px;
    background:rgba(255,255,255,0.03);
    border:1px solid rgba(255,255,255,0.10);
    transition:transform .06s ease, background .15s ease, border-color .15s ease;
  }
  .opt-btn .key{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-weight:700;
    background:linear-gradient(90deg,var(--glow-cyan),var(--glow-purple));color:#0b0b12;
    box-shadow:0 0 10px var(--glow-cyan-outer),0 0 10px var(--glow-purple-outer) inset;
  }
  .opt-btn:hover{transform:translateY(-1px);border-color:rgba(255,255,255,0.22);}

  .opt-btn.correct{
    border-left:6px solid var(--ok);
    outline:none;
    background:rgba(255,255,255,0.03);
  }
  .opt-btn.wrong{
    border-left:6px solid var(--bad);
    outline:none;
    background:rgba(255,255,255,0.03);
  }
  .opt-btn[disabled]{opacity:.85;cursor:not-allowed;pointer-events:none;}

  .feedback{margin-top:10px;border-radius:12px;padding:10px 12px;border:1px dashed rgba(255,255,255,0.18);background:rgba(255,255,255,0.03);color:var(--muted);}
  .feedback[hidden]{display:none;}
  .feedback b{color:var(--text)}

  .answer{margin-top:10px;padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,0.14);background:rgba(255,255,255,0.04)}
  .answer[hidden]{display:none;}
  .btnrow{display:flex;gap:10px;flex-wrap:wrap}
  .ghost, .primary{
    all:unset;cursor:pointer;border-radius:12px;padding:10px 14px;font-weight:650;border:1px solid rgba(255,255,255,0.18);
    background:rgba(255,255,255,0.03);
  }
  .primary{background:linear-gradient(90deg,var(--glow-cyan),var(--glow-purple));color:#0b0b12;border-color:transparent;}

  .score{
    margin:16px 0;padding:12px 14px;border-radius:14px;
    background:var(--glass);border:1px solid var(--glass-border);box-shadow: 0 2px 10px var(--white-haze), 0 0 18px rgba(255,255,255,0.06), 0 0 30px var(--white-outer);
    display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
  }
  .score .part{color:var(--muted);font-weight:600}
  .score b{color:var(--text)}
  
  table { width: 100%; border-collapse: collapse; margin-top: 10px; }
  th, td { border: 1px solid var(--glass-border); padding: 8px; text-align: left; }
  th { background: var(--glass); }
</style>
</head>
<body>
  <header class="titlebar">
    <div class="inner">
      <h1 class="grad-text">🦷 Dentistry 3rd year</h1>
      <p class="subtitle">Test based on Lecture 7</p>
    </div>
  </header>

  <main class="wrap">
    <h2 class="section-h"><span class="grad-text">اللَّهُمَّ لا سَهْلَ إِلَّا مَا جَعَلْتَهُ سَهْلًا، وَأَنْتَ تَجْعَلُ الحَزْنَ إِذَا شِئْتَ سَهْلًا</span></h2>

    <section class="score" id="scoreTop">
      <div class="part">MCQs: <b><span id="sMcq">0</span>/30</b></div>
      <div class="part">True/False: <b><span id="sTf">0</span>/9</b></div>
      <div class="part">SAQs: <b><span id="sSaq">0</span>/6</b></div>
      <div class="part">Total: <b><span id="sTotal">0</span>/45</b></div>
      <div class="btnrow">
        <button class="ghost" id="resetAll">Reset</button>
      </div>
    </section>

    <h2 class="section-h"><span class="grad-text">MCQs</span></h2>
    <div class="grid mcq" id="mcqGrid"></div>

    <h2 class="section-h"><span class="grad-text">True / False</span></h2>
    <div class="grid tf" id="tfGrid"></div>

    <h2 class="section-h"><span class="grad-text">Short Answer Questions</span></h2>
    <div class="grid" id="saqGrid"></div>

    <section class="score" id="scoreBottom">
      <div class="part">MCQs: <b><span id="sMcq2">0</span>/30</b></div>
      <div class="part">True/False: <b><span id="sTf2">0</span>/9</b></div>
      <div class="part">SAQs: <b><span id="sSaq2">0</span>/6</b></div>
      <div class="part">Total: <b><span id="sTotal2">0</span>/45</b></div>
    </section>
  </main>

<script>
const mcqs = [
  {
    q: "Who introduced the first CT scanner in 1967?",
    opts: ["Wilhelm Röntgen", "Sir Godfrey N. Hounsfield", "Nikola Tesla", "Allan MacLeod Cormack"],
    correct: 1,
    explain: "Sir Godfrey N. Hounsfield introduced the CT scanner in 1967."
  },
  {
    q: "What is the Hounsfield Unit (CT Number) for dense bone?",
    opts: ["0", "-1000", "+400 to +1000", "+40 to +80"],
    correct: 2,
    explain: "Dense bone typically ranges from +400 to +1000 HU."
  },
  {
    q: "In CT imaging, which component converts light emitted by scintillators into electrical signals?",
    opts: ["X-ray Tube", "Rotating Gantry", "Photodetector/Photodiode", "Collimator"],
    correct: 2,
    explain: "Photodetectors convert the visible light from scintillators into electrical signals for the computer."
  },
  {
    q: "What is the typical voltage range used in CT X-ray tubes?",
    opts: ["10-20 kVp", "50-70 kVp", "80-120 kVp", "200-800 kVp"],
    correct: 2,
    explain: "CT tubes typically operate at 80-120 kVp."
  },
  {
    q: "Which imaging modality is described as using a cone-shaped beam to capture a volume in a single rotation?",
    opts: ["Conventional CT", "CBCT", "MRI", "PET"],
    correct: 1,
    explain: "CBCT uses a cone-shaped beam compared to the fan beam of traditional CT."
  },
  {
    q: "What is the primary contraindication for using Iodine-based contrast in CT?",
    opts: ["Pregnancy", "Cardiac pacemakers", "Kidney disease", "Dental implants"],
    correct: 2,
    explain: "Iodine contrast is toxic to patients with kidney disease."
  },
  {
    q: "Which terminology describes a region with no echoes in ultrasonography (appearing dark)?",
    opts: ["Hyperechoic", "Hypoechoic", "Anechoic", "Isoechoic"],
    correct: 2,
    explain: "Anechoic means no echoes, which appears dark on the monitor."
  },
  {
    q: "MRI works primarily by manipulating which atoms in the human body?",
    opts: ["Oxygen", "Carbon", "Hydrogen (Protons)", "Calcium"],
    correct: 2,
    explain: "MRI relies on the magnetic properties of hydrogen protons, which are abundant in body water."
  },
  {
    q: "In MRI, which pulse sequence is specifically used to evaluate pathology?",
    opts: ["T1 weighted", "T2 weighted", "CT weighted", "Proton Density"],
    correct: 1,
    explain: "T1 is for normal anatomy; T2 is typically used to evaluate pathology."
  },
  {
    q: "What is the most common radiotracer used in PET scans?",
    opts: ["Iodine-131", "Gadolinium", "Fluorodeoxyglucose (FDG)", "Technetium-99m"],
    correct: 2,
    explain: "FDG is the most common tracer, absorbed by metabolically active cells like cancer."
  },
  {
    q: "Which imaging modality provides the highest effective radiation dose?",
    opts: ["Panoramic Radiograph", "CBCT (Large FOV)", "Medical CT", "PET Scan (Whole Body)"],
    correct: 3,
    explain: "PET Scan (Whole Body) has the highest dose, ranging from 4000-7000 µSv."
  },
  {
    q: "What does 'Tomo' mean in the word Tomography?",
    opts: ["Light", "Slice", "Circle", "Bone"],
    correct: 1,
    explain: "Tomo means 'Slice' and Graphia means 'writing/describing'."
  },
  {
    q: "Which of the following is an advantage of CBCT over traditional CT?",
    opts: ["Better soft tissue detail", "Higher radiation dose", "Lower radiation dose (up to 40% less)", "Longer scan time"],
    correct: 2,
    explain: "CBCT offers a lower radiation dose compared to traditional medical CT."
  },
  {
    q: "Ultrasonography uses sound waves in which frequency range for diagnostics?",
    opts: ["1500 to 20,000 Hz", "1 to 20 MHz", "80 to 120 kHz", "200 to 800 MHz"],
    correct: 1,
    explain: "Diagnostic ultrasound typically uses 1 to 20 MHz."
  },
  {
    q: "Which imaging technique is ideal for visualizing the TMJ disc?",
    opts: ["CT", "Panoramic", "MRI", "PET"],
    correct: 2,
    explain: "MRI is the gold standard for soft tissue evaluation, including the TMJ disc."
  },
  {
    q: "In PET scanning, what is produced when a positron collides with an electron?",
    opts: ["X-rays", "Alpha particles", "Gamma rays", "Radio waves"],
    correct: 2,
    explain: "The collision creates gamma rays which are detected by the PET scanner's camera."
  },
  {
    q: "Which factor limits the use of MRI in certain patients?",
    opts: ["Kidney disease", "Cardiac pacemakers", "Thyroid disorders", "Asthma"],
    correct: 1,
    explain: "Strong magnetic fields prohibit MRI for patients with cardiac pacemakers or ferromagnetic implants."
  },
  {
    q: "What is 'Claustrophobia' in the context of MRI?",
    opts: ["Fear of radiation", "Fear of loud noises", "Fear of enclosed spaces", "Fear of magnets"],
    correct: 2,
    explain: "MRI machines are enclosed tubes, which can trigger claustrophobia."
  },
  {
    q: "What does a 'Hyperechoic' area represent in an ultrasound scan?",
    opts: ["No echoes", "Weak echoes", "Strong echoes (appearing bright)", "Intermediate echoes"],
    correct: 2,
    explain: "Hyperechoic means strong echoes, resulting in a bright image."
  },
  {
    q: "Which detector material is commonly used as a scintillator in CT machines?",
    opts: ["Silver Halide", "Gadolinium oxysulfide (Gd2S2O)", "Tungsten", "Lead"],
    correct: 1,
    explain: "Gd2S2O is a common solid-state scintillator crystal."
  },
  {
    q: "CT imaging is based on the principle that different tissues ____ X-rays differently.",
    opts: ["Emit", "Reflect", "Absorb", "Refract"],
    correct: 2,
    explain: "Density differences lead to different levels of X-ray absorption."
  },
  {
    q: "What is the CT number (HU) for water?",
    opts: ["+1000", "+40", "0", "-1000"],
    correct: 2,
    explain: "Water is the reference point for the Hounsfield scale at 0 HU."
  },
  {
    q: "Which plane of imaging divides the body into front and back sections?",
    opts: ["Axial", "Sagittal", "Coronal", "Transverse"],
    correct: 2,
    explain: "Coronal plane divides the body into anterior and posterior parts."
  },
  {
    q: "What is a major disadvantage of CBCT in tumor evaluation?",
    opts: ["High cost", "Metallic artifacts", "Limited soft tissue detail", "Slow rotation"],
    correct: 2,
    explain: "CBCT is excellent for bone but has limited soft tissue contrast."
  },
  {
    q: "Which modality is best for evaluating salivary gland stones (sialolithiasis) via sound waves?",
    opts: ["MRI", "Medical CT", "Ultrasonography", "PET"],
    correct: 2,
    explain: "Ultrasound is widely used for evaluating salivary glands and detecting stones."
  },
  {
    q: "How many degrees does the CT gantry typically rotate during an exposure series?",
    opts: ["90 degrees", "180 or 360 degrees", "45 degrees", "Fixed position"],
    correct: 1,
    explain: "Exposures are made over an arc of 180 or 360 degrees."
  },
  {
    q: "In MRI, energy is released in the form of signals when protons:",
    opts: ["Align with the field", "Are hit by X-rays", "Return to original position after radio waves stop", "Are removed from the body"],
    correct: 2,
    explain: "When RF pulses stop, protons relax and release energy as MR signals."
  },
  {
    q: "Which imaging technique uses a 'Gamma Camera'?",
    opts: ["CT", "MRI", "PET", "Ultrasound"],
    correct: 2,
    explain: "PET scanners use gamma detectors (cameras) to capture rays from positron-electron annihilation."
  },
  {
    q: "What is the typical mA range for a CT X-ray tube?",
    opts: ["2-10 mA", "20-50 mA", "200-800 mA", "1000-2000 mA"],
    correct: 2,
    explain: "CT operates at high currents, typically 200 to 800 mA."
  },
  {
    q: "Which is a clinical indication for advanced imaging in trauma cases?",
    opts: ["Simple caries", "Craniofacial reconstruction", "Routine prophylaxis", "Gingivitis assessment"],
    correct: 1,
    explain: "CT and CBCT are vital for assessing complex trauma and planning reconstruction."
  }
];

const tfs = [
  { q: "Tomography allows imaging of one layer while blurring others.", answer: true, explain: "This is the core definition of tomography." },
  { q: "The Hounsfield unit for Air is +1000.", answer: false, explain: "Air is -1000; Bone is +1000." },
  { q: "MRI uses ionizing radiation to create images.", answer: false, explain: "MRI uses magnetic fields and radio waves, not ionizing radiation." },
  { q: "CT is ideal for soft tissue contrast compared to MRI.", answer: false, explain: "MRI has superior soft tissue contrast; CT is better for hard tissue." },
  { q: "CBCT uses a linear fan beam of X-rays.", answer: false, explain: "CBCT uses a cone-shaped beam; traditional CT uses a fan beam." },
  { q: "Ultrasound is non-invasive and painless.", answer: true, explain: "It is a safe, non-invasive imaging modality." },
  { q: "PET scans are primarily structural imaging techniques.", answer: false, explain: "PET is functional/metabolic imaging, showing how tissues function." },
  { q: "Iodine contrast can be safely given to patients with severe kidney disease.", answer: false, explain: "It is contraindicated or used with extreme caution due to toxicity." },
  { q: "Metallic restorations can produce artifacts in CT images.", answer: true, explain: "Metal causes streaking artifacts in CT scans." }
];

const saqs = [
  {
    q: "Define Tomography and explain its basic working principle.",
    a: "Tomography is a radiographic technique that allows the imaging of one layer or section of the body while blurring images from structures in other planes. The word comes from 'Tomo' (slice) and 'Graphia' (writing)."
  },
  {
    q: "Enumerate at least four advanced imaging techniques used in maxillofacial tissues.",
    a: "1. Computed Tomography (CT)<br>2. Magnetic Resonance Imaging (MRI)<br>3. Ultrasonography<br>4. Positron Emission Tomography (PET)<br>5. Cone Beam CT (CBCT)"
  },
  {
    q: "Compare the beam geometry and typical radiation dose between Medical CT and CBCT.",
    a: "<table><thead><tr><th>Feature</th><th>Medical CT</th><th>CBCT</th></tr></thead><tbody><tr><td>Beam Geometry</td><td>Linear Fan Beam</td><td>Cone-shaped Beam</td></tr><tr><td>Radiation Dose</td><td>High (600-2000 µSv)</td><td>Lower (19-600 µSv)</td></tr></tbody></table>"
  },
  {
    q: "A patient presents with a suspected TMJ disc displacement. Which advanced imaging modality is most appropriate, and why?",
    a: "MRI (Magnetic Resonance Imaging) is the most appropriate. It provides superior soft tissue contrast, allowing for the clear visualization of the articular disc and surrounding soft tissues without using ionizing radiation."
  },
  {
    q: "List the four Hounsfield Unit (HU) values for Air, Fat, Water, and Bone as provided in the lecture.",
    a: "1. Air: -1000<br>2. Fat: -60 to -100<br>3. Water: 0<br>4. Bone: +400 to +1000"
  },
  {
    q: "Explain the role of the transducer in Ultrasonography.",
    a: "The transducer acts as both a transmitter and a receiver. It sends high-frequency sound waves into the body and captures the echoes that bounce back from tissues. These echoes are then converted into electrical signals to create real-time images."
  }
];

const state = {
  mcq: Array(mcqs.length).fill(null),
  tf: Array(tfs.length).fill(null),
  saq: Array(saqs.length).fill(false)
};

function shuffleIndices(n){
  const arr = Array.from({length:n}, (_,i)=>i);
  for(let i=n-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}

const mcqGrid = document.getElementById('mcqGrid');
mcqs.forEach((item, idx)=>{
  const map = shuffleIndices(4);
  const visualToOriginal = map;
  const originalToVisual = Array(4);
  map.forEach((orig, v)=>{ originalToVisual[orig] = v; });
  const correctVisualIndex = originalToVisual[item.correct];

  const card = document.createElement('article');
  card.className='card qcard';
  card.dataset.type='mcq';
  card.dataset.index = idx;
  card.dataset.locked = 'false';
  card.innerHTML = `
    <p class="meta">Question ${idx+1} of ${mcqs.length}</p>
    <h3 class="qtitle">${item.q}</h3>
    <div class="opts">
      ${[0,1,2,3].map(v=>`
        <button class="opt-btn" data-v="${v}">
          <span class="key">${String.fromCharCode(65+v)}</span>
          <span class="label">${item.opts[ visualToOriginal[v] ]}</span>
        </button>
      `).join('')}
    </div>
    <div class="feedback" hidden></div>
  `;

  const buttons = card.querySelectorAll('.opt-btn');
  const feedback = card.querySelector('.feedback');

  buttons.forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(card.dataset.locked === 'true') return;
      const v = Number(btn.dataset.v);
      state.mcq[idx] = v;
      buttons.forEach(b=>b.classList.remove('correct','wrong'));
      const correctBtn = buttons[correctVisualIndex];
      correctBtn.classList.add('correct');
      if(v !== correctVisualIndex){
        btn.classList.add('wrong');
        feedback.hidden=false;
        feedback.innerHTML = `<b>Wrong ✖</b><br>Correct: <b>${String.fromCharCode(65+correctVisualIndex)}</b><br>${item.explain}`;
      }else{
        feedback.hidden=false;
        feedback.innerHTML = `<b>Correct ✔</b><br>${item.explain}`;
      }
      card.dataset.locked = 'true';
      buttons.forEach(b=>b.setAttribute('disabled',''));
      recalc();
    });
  });
  mcqGrid.appendChild(card);
});

const tfGrid = document.getElementById('tfGrid');
tfs.forEach((item, idx)=>{
  const card = document.createElement('article');
  card.className='card qcard';
  card.dataset.type='tf';
  card.dataset.index = idx;
  card.dataset.locked = 'false';
  card.innerHTML = `
    <p class="meta">Statement ${idx+1} of ${tfs.length}</p>
    <h3 class="qtitle">${item.q}</h3>
    <div class="opts">
      <button class="opt-btn" data-v="true"><span class="key">T</span><span class="label">True</span></button>
      <button class="opt-btn" data-v="false"><span class="key">F</span><span class="label">False</span></button>
    </div>
    <div class="feedback" hidden></div>
  `;
  const buttons = card.querySelectorAll('.opt-btn');
  const feedback = card.querySelector('.feedback');
  buttons.forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(card.dataset.locked === 'true') return;
      const val = btn.dataset.v === "true";
      state.tf[idx] = val;
      buttons.forEach(b=>b.classList.remove('correct','wrong'));
      const correctBtn = Array.from(buttons).find(b => (b.dataset.v === (item.answer ? "true" : "false")));
      correctBtn.classList.add('correct');
      if(val !== item.answer){
        btn.classList.add('wrong');
        feedback.hidden=false;
        feedback.innerHTML = `<b>Wrong ✖</b><br>${item.explain}`;
      }else{
        feedback.hidden=false;
        feedback.innerHTML = `<b>Correct ✔</b><br>${item.explain}`;
      }
      card.dataset.locked = 'true';
      buttons.forEach(b=>b.setAttribute('disabled',''));
      recalc();
    });
  });
  tfGrid.appendChild(card);
});

const saqGrid = document.getElementById('saqGrid');
saqs.forEach((item, idx)=>{
  const card = document.createElement('article');
  card.className='card qcard';
  card.dataset.type='saq';
  card.dataset.index = idx;
  card.innerHTML = `
    <p class="meta">Question ${idx + 1} of ${saqs.length}</p>
    <h3 class="qtitle">${item.q}</h3>
    <textarea rows="4" placeholder="Type your answer here..." style="width:100%;padding:12px;border-radius:12px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.14);color:var(--text);font-family:inherit;"></textarea>
    <div class="btnrow" style="margin-top:10px">
      <button class="primary" data-act="reveal">Reveal Answer</button>
      <button class="ghost" data-act="toggle">I was correct</button>
    </div>
    <div class="answer" hidden>${item.a}</div>
  `;
  const revealBtn = card.querySelector('[data-act="reveal"]');
  const toggleBtn = card.querySelector('[data-act="toggle"]');
  const answer = card.querySelector('.answer');
  revealBtn.addEventListener('click', ()=>{
    answer.hidden = !answer.hidden;
    revealBtn.textContent = answer.hidden ? "Reveal Answer" : "Hide Answer";
  });
  toggleBtn.addEventListener('click', ()=>{
    state.saq[idx] = !state.saq[idx];
    toggleBtn.textContent = state.saq[idx] ? "✓ Counted as correct" : "I was correct";
    toggleBtn.style.outline = state.saq[idx] ? "2px solid var(--ok)" : "none";
    recalc();
  });
  saqGrid.appendChild(card);
});

function recalc(){
  const mcqScore = state.mcq.reduce((s,v,i)=>{
    if(v===null) return s;
    const card = document.querySelector(`.qcard[data-type="mcq"][data-index="${i}"]`);
    return s + (card.querySelector('.feedback').textContent.startsWith("Correct") ? 1 : 0);
  },0);
  const tfScore = state.tf.reduce((s,v,i)=>{
    if(v===null) return s;
    const card = document.querySelector(`.qcard[data-type="tf"][data-index="${i}"]`);
    return s + (card.querySelector('.feedback').textContent.startsWith("Correct") ? 1 : 0);
  },0);
  const saqScore = state.saq.filter(Boolean).length;
  const total = mcqScore + tfScore + saqScore;

  ["sMcq","sTf","sSaq","sTotal","sMcq2","sTf2","sSaq2","sTotal2"].forEach(id=>{
    const el = document.getElementById(id);
    if(!el) return;
    if(id.includes('Mcq')) el.textContent = mcqScore;
    else if(id.includes('Tf')) el.textContent = tfScore;
    else if(id.includes('Saq')) el.textContent = saqScore;
    else if(id.includes('Total')) el.textContent = total;
  });
}

document.getElementById('resetAll').addEventListener('click', ()=>{
  document.querySelectorAll('.feedback').forEach(f=>{f.hidden=true; f.innerHTML='';});
  document.querySelectorAll('.opt-btn').forEach(b=>{b.classList.remove('correct','wrong'); b.removeAttribute('disabled');});
  document.querySelectorAll('.qcard').forEach(c=>{ if(c.dataset.locked) c.dataset.locked='false'; });
  document.querySelectorAll('textarea').forEach(t=>t.value="");
  document.querySelectorAll('.answer').forEach(a=>a.hidden=true);
  document.querySelectorAll('[data-act="reveal"]').forEach(b=>b.textContent="Reveal Answer");
  document.querySelectorAll('[data-act="toggle"]').forEach(b=>{b.textContent="I was correct"; b.style.outline="none";});
  state.mcq.fill(null); state.tf.fill(null); state.saq.fill(false);
  recalc();
});
</script>
</body>
</html>
