<!DOCTYPE html>
<html lang="en" style="direction:ltr;">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Interactive Exam • Glowing Dark Theme</title>
<meta name="color-scheme" content="dark" />
<style>
  :root{
    --bg:#0b0b12;
    --text:#f6f7fb;
    --muted:#a6afc6;
    --card:rgba(255,255,255,0.05);
    --card-border:rgba(255,255,255,0.12);
    --glass:rgba(255,255,255,0.04);
    --glass-border:rgba(255,255,255,0.10);
    --glow-cyan:#06b6d4;
    --glow-cyan-outer:rgba(6,182,212,0.40);
    --glow-purple:#8b5cf6;
    --glow-purple-outer:rgba(139,92,246,0.35);
    --white-haze:rgba(255,255,255,0.08);
    --white-outer:rgba(255,255,255,0.15);
    --radius:16px;
    --gap:1.25rem;
    --pad:1.5rem;
    --ok:#22c55e;  /* green */
    --bad:#ef4444; /* red */
  }

  *{box-sizing:border-box}
  body{margin:0;font:16px/1.65 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto;color:var(--text);background:var(--bg);min-height:100dvh;}
  .wrap{max-width:1100px;margin:0 auto;padding:24px;}

  .titlebar{
    position: static;z-index:10;
    backdrop-filter:saturate(140%) blur(8px);
    background:linear-gradient(180deg,rgba(11,11,18,0.75),rgba(11,11,18,0.35));
    border-bottom:1px solid var(--glass-border);
  }
  .titlebar .inner{max-width:1100px;margin:0 auto;padding:16px 24px;display:grid;gap:8px;align-items:center;}
  .grad-text{
    font-weight:800;
    letter-spacing:.3px;
    background:linear-gradient(90deg,var(--glow-cyan),var(--glow-purple));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 0 10px var(--glow-cyan-outer), 0 0 14px var(--glow-purple-outer);
  }
  h1.grad-text{font-size:clamp(1.6rem,2vw+1rem,2.6rem);margin:0;text-align:center;}
  .subtitle{margin:0;text-align:center;color:var(--muted);font-size:0.95rem}

  .section-h{
    margin:28px 0 14px;
    padding:12px 16px;
    border-radius:var(--radius);
    background:var(--glass);
    border:1px solid var(--glass-border);
    box-shadow: 0 2px 10px var(--white-haze), 0 0 18px rgba(255,255,255,0.06), 0 0 30px var(--white-outer);
    text-align:center;
    font-weight:750;
    font-size:1.15rem;
  }
  .section-h .grad-text{font-size:1.3rem;}

  .grid{display:grid;gap:var(--gap)}
  @media (min-width:800px){
    .grid.mcq{grid-template-columns:repeat(2,minmax(0,1fr));}
    .grid.tf {grid-template-columns:repeat(3,minmax(0,1fr));}
  }

  .card{
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:var(--radius);
    padding:var(--pad);
    box-shadow: 0 2px 8px var(--white-haze), 0 0 0 1px rgba(255,255,255,0.02), 0 0 24px rgba(255,255,255,0.06);
    position:relative;
  }

  .qtitle{font-weight:650;margin:0 0 12px}
  .meta{color:var(--muted);font-size:0.88rem;margin-bottom:10px}

  .opts{display:grid;gap:10px}
  .opt-btn{
    all:unset;cursor:pointer;display:flex;gap:10px;align-items:center;
    padding:12px 14px;border-radius:12px;
    background:rgba(255,255,255,0.03);
    border:1px solid rgba(255,255,255,0.10);
    transition:transform .06s ease, background .15s ease, border-color .15s ease;
  }
  .opt-btn .key{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-weight:700;
    background:linear-gradient(90deg,var(--glow-cyan),var(--glow-purple));color:#0b0b12;
    box-shadow:0 0 10px var(--glow-cyan-outer),0 0 10px var(--glow-purple-outer) inset;
  }
  .opt-btn:hover{transform:translateY(-1px);border-color:rgba(255,255,255,0.22);}

  .opt-btn.correct{
    border-left:6px solid var(--ok);
    outline:none;
    background:rgba(255,255,255,0.03);
  }
  .opt-btn.wrong{
    border-left:6px solid var(--bad);
    outline:none;
    background:rgba(255,255,255,0.03);
  }
  .opt-btn[disabled]{opacity:.85;cursor:not-allowed;pointer-events:none;}

  .feedback{margin-top:10px;border-radius:12px;padding:10px 12px;border:1px dashed rgba(255,255,255,0.18);background:rgba(255,255,255,0.03);color:var(--muted);}
  .feedback[hidden]{display:none;}
  .feedback b{color:var(--text)}

  .answer{margin-top:10px;padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,0.14);background:rgba(255,255,255,0.04)}
  .answer[hidden]{display:none;}
  .answer table {width:100%;border-collapse:collapse;margin-top:8px;}
  .answer th, .answer td {border:1px solid var(--glass-border);padding:8px;text-align:left;}
  .answer th {background-color:rgba(255,255,255,0.05);}
  .btnrow{display:flex;gap:10px;flex-wrap:wrap}
  .ghost, .primary{
    all:unset;cursor:pointer;border-radius:12px;padding:10px 14px;font-weight:650;border:1px solid rgba(255,255,255,0.18);
    background:rgba(255,255,255,0.03);
  }
  .primary{background:linear-gradient(90deg,var(--glow-cyan),var(--glow-purple));color:#0b0b12;border-color:transparent;}

  .score{
    margin:16px 0;padding:12px 14px;border-radius:14px;
    background:var(--glass);border:1px solid var(--glass-border);box-shadow: 0 2px 10px var(--white-haze), 0 0 18px rgba(255,255,255,0.06), 0 0 30px var(--white-outer);
    display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
  }
  .score .part{color:var(--muted);font-weight:600}
  .score b{color:var(--text)}
</style>
</head>
<body>
  <header class="titlebar">
    <div class="inner">
      <h1 class="grad-text">🦷 Dentistry 3rd year</h1>
      <p class="subtitle">Test based on Lecture 4</p>
    </div>
  </header>

  <main class="wrap">

    <h2 class="section-h"><span class="grad-text">اللَّهُمَّ لا سَهْلَ إِلَّا مَا جَعَلْتَهُ سَهْلًا، وَأَنْتَ تَجْعَلُ الحَزْنَ إِذَا شِئْتَ سَهْلًا</span></h2>

    <section class="score" id="scoreTop">
      <div class="part">MCQs: <b><span id="sMcq">0</span>/30</b></div>
      <div class="part">True/False: <b><span id="sTf">0</span>/9</b></div>
      <div class="part">SAQs: <b><span id="sSaq">0</span>/6</b></div>
      <div class="part">Total: <b><span id="sTotal">0</span>/45</b></div>
      <div class="btnrow">
        <button class="ghost" id="resetAll">Reset</button>
      </div>
    </section>

    <h2 class="section-h"><span class="grad-text">MCQs</span></h2>
    <div class="grid mcq" id="mcqGrid"></div>

    <h2 class="section-h"><span class="grad-text">True / False</span></h2>
    <div class="grid tf" id="tfGrid"></div>

    <h2 class="section-h"><span class="grad-text">Short Answer Questions</span></h2>
    <div class="grid" id="saqGrid"></div>

    <section class="score" id="scoreBottom">
      <div class="part">MCQs: <b><span id="sMcq2">0</span>/30</b></div>
      <div class="part">True/False: <b><span id="sTf2">0</span>/9</b></div>
      <div class="part">SAQs: <b><span id="sSaq2">0</span>/6</b></div>
      <div class="part">Total: <b><span id="sTotal2">0</span>/45</b></div>
    </section>
  </main>

<script>
// ----------- Data -----------
const mcqs = [
    {q:"What is the primary molecular nature of most drug receptors?", opts:["Proteins", "Lipids", "Carbohydrates", "Nucleic acids"], correct:0, explain:"Receptors are primarily protein molecules, which can include enzymes, transporters, and ion channels."},
    {q:"A drug that binds to a receptor and prevents its activation by other agents is known as a(n):", opts:["Antagonist", "Agonist", "Ligand", "Neurotransmitter"], correct:0, explain:"An antagonist prevents receptor activation, whereas an agonist causes activation."},
    {q:"Which type of drug-receptor bond is typically considered irreversible?", opts:["Covalent bond", "Ionic interaction", "Hydrogen bonding", "Lipophilic interaction"], correct:0, explain:"Covalent bonds are very strong and not easily broken, leading to an irreversible interaction."},
    {q:"An adverse drug reaction that is dose-dependent and predictable is classified as:", opts:["Type A (Augmented)", "Type B (Bizarre)", "Type C (Chronic)", "Type D (Delayed)"], correct:0, explain:"Type A reactions are augmented pharmacological effects, making them predictable and dependent on the dose."},
    {q:"Hypoglycemia resulting from an insulin overdose is an example of which type of adverse drug reaction?", opts:["Type A", "Type B", "Type E", "Type D"], correct:0, explain:"This is a predictable, dose-dependent (augmented) effect of insulin, fitting the Type A classification."},
    {q:"Urticaria (hives) from aspirin, which is not related to its known pharmacological effect, is an example of a:", opts:["Type B reaction", "Type A reaction", "Type C reaction", "Type E reaction"], correct:0, explain:"Type B reactions are bizarre, unpredictable, and not explained by the drug's primary pharmacology, like an allergic reaction."},
    {q:"What is the term for a receptor for which the natural ligand has not yet been identified?", opts:["Orphan Receptor", "Silent Receptor", "Inactive Receptor", "Target Receptor"], correct:0, explain:"Orphan Receptors are receptors whose endogenous ligand remains unknown."},
    {q:"Which of the following is an example of an endogenous ligand?", opts:["Acetylcholine", "Aspirin", "Penicillin", "Cortisone"], correct:0, explain:"Acetylcholine is a neurotransmitter produced by the body, making it an endogenous ligand."},
    {q:"According to the lecture, what is the most critical first-line treatment for a severe allergic reaction (anaphylaxis)?", opts:["Adrenaline (IM injection)", "High-dose oral antihistamine", "Intravenous glucocorticoid", "High-flow oxygen only"], correct:0, explain:"The slides specify administering oxygen AND adrenaline (0.5 mg IM) injection. Adrenaline is the most critical life-saving component."},
    {q:"What is required before a drug allergy can occur?", opts:["Prior sensitization", "A very high dose of the drug", "Genetic predisposition", "Concurrent use of another drug"], correct:0, explain:"A latent period (typically 1-2 weeks) is needed after the first exposure for the immune system to become sensitized to the drug."},
    {q:"A Type C adverse drug reaction is characterized by being:", opts:["Dose and time-dependent", "Dose-independent", "Time-independent", "Unpredictable"], correct:0, explain:"Type C reactions are chronic and depend on both the dose and the duration of drug exposure."},
    {q:"Withdrawal effects after stopping opioids are classified as which type of ADR?", opts:["Type E (End of treatment)", "Type A", "Type B", "Type D"], correct:0, explain:"Type E reactions occur at the end of treatment and include withdrawal and relapse phenomena."},
    {q:"Which of the following is NOT a type of drug-receptor binding force mentioned in the lecture?", opts:["Gravitational pull", "Ionic interaction", "Hydrogen bonding", "Covalent bond"], correct:0, explain:"The lecture lists ionic, hydrogen, lipophilic, and covalent interactions as binding forces."},
    {q:"A drug that activates a receptor to produce a cellular response is called a(n):", opts:["Agonist", "Antagonist", "Blocker", "Inhibitor"], correct:0, explain:"An agonist binds to and activates a receptor to elicit a biological response."},
    {q:"The 'lock and key' model is a metaphor used to describe the:", opts:["Specificity of a drug for its receptor", "Rate of drug metabolism", "Drug's half-life", "Process of drug absorption"], correct:0, explain:"The model illustrates how a specific drug (the key) is structurally complementary to its specific receptor (the lock)."},
    {q:"Kidney disease resulting from long-term use of NSAIDs is an example of which ADR type?", opts:["Type D (Delayed)", "Type A", "Type B", "Type C"], correct:0, explain:"This is a time-dependent, delayed reaction that manifests after long-term exposure to the drug."},
    {q:"In the management of drug allergy, what is the role of chlorpheniramine?", opts:["It is an H1 antihistaminic", "It is a glucocorticoid", "It is a vasoconstrictor", "It is a bronchodilator"], correct:0, explain:"Chlorpheniramine is listed as the H1 antihistaminic to be administered to counter the effects of histamine release."},
    {q:"A ligand is best defined as a molecule that:", opts:["Forms a complex with a biomolecule", "Only transports other molecules", "Is always a protein", "Only exists outside the body"], correct:0, explain:"A ligand is any ion or molecule that binds to a biomolecule (like a receptor) to serve a specific biological purpose."},
    {q:"Which of these is a key characteristic of a Type B (Bizarre) reaction?", opts:["Unpredictable", "Dose-dependent", "Frequent", "Common"], correct:0, explain:"Type B reactions are rare, not explained by the drug's pharmacology, and therefore unpredictable."},
    {q:"Cushing syndrome from long-term cortisone use is a classic example of a:", opts:["Type C reaction", "Type D reaction", "Type A reaction", "Type E reaction"], correct:0, explain:"This is a well-known example of a chronic, dose-and-time-dependent adverse reaction from long-term steroid therapy."},
    {q:"Which chemical messengers signal across a synaptic cleft?", opts:["Neurotransmitters", "Hormones", "Enzymes", "Transporters"], correct:0, explain:"Neurotransmitters like Acetylcholine and Epinephrine are the chemical messengers that signal across a synapse."},
    {q:"An adverse drug reaction is defined as an effect that occurs at:", opts:["Doses normally used by humans", "Overdoses only", "Sub-therapeutic doses", "Toxic doses only"], correct:0, explain:"ADRs occur at normal therapeutic doses, excluding effects from poisoning or overdose."},
    {q:"What is the recommended route of administration for Hydrocortisone in a severe allergic reaction?", opts:["Intravenous (I.V.)", "Intramuscular (I.M.)", "Oral", "Subcutaneous"], correct:0, explain:"The slide specifies 'Intravenous glucocorticoid (hydrocortisone sod. succinate-200 mg)' for managing drug allergies."},
    {q:"Which type of ADR is described as dose-independent and rare?", opts:["Type B (Bizarre)", "Type A (Augmented)", "Type C (Chronic)", "Type E (End of treatment)"], correct:0, explain:"Type B reactions are characteristic for being rare and independent of the drug's dose."},
    {q:"The interaction between a cation and an anion is an example of which binding force?", opts:["Ionic interaction", "Covalent bond", "Hydrogen bonding", "Lipophilic interaction"], correct:0, explain:"Ionic interaction occurs between oppositely charged ions (a cation and an anion)."},
    {q:"A 'rebound or relapse phenomenon' after stopping a therapy is what type of ADR?", opts:["Type E", "Type D", "Type C", "Type B"], correct:0, explain:"Type E (End of treatment) reactions include relapse or rebound effects when a drug is discontinued."},
    {q:"Drug allergy is a cell-mediated immune reaction producing symptoms that are:", opts:["Unrelated to the drug's pharmacological effects", "Directly related to the drug's primary effect", "Always dose-dependent", "Only caused by drug overdose"], correct:0, explain:"Drug allergy symptoms are due to an immune response, not the intended pharmacological action of the drug."},
    {q:"Which of the following is NOT a type of receptor molecule mentioned in the lecture?", opts:["Mitochondria", "Enzymes", "Transporters", "Ion channels"], correct:0, explain:"The lecture lists enzymes, transporters, and ion channels as examples of protein molecules that act as receptors."},
    {q:"Which of the following is a 'delayed' (Type D) adverse drug reaction example?", opts:["Kidney disease from long-term analgesics", "Bleeding after anticoagulants", "Urticaria from aspirin", "Withdrawal effects from opioids"], correct:0, explain:"Kidney disease from long-term NSAID/analgesic use is the example given for a Type D, time-dependent, very rare reaction."},
    {q:"What is the main purpose of a drug binding to a receptor?", opts:["To alter a specific physiological function", "To be metabolized by the liver", "To be excreted by the kidneys", "To be distributed throughout the body"], correct:0, explain:"Drugs interact with receptors to selectively alter their specific physiological functions, producing a therapeutic effect."}
];

const tfs = [
    {q:"An antagonist activates a receptor to produce a cellular response.", answer:false, explain:"An antagonist prevents activation; an agonist is what causes activation."},
    {q:"All adverse drug reactions are dose-dependent.", answer:false, explain:"Type B (Bizarre) reactions are dose-independent, often resulting from allergic or idiosyncratic responses."},
    {q:"A latent period of at least 1-2 weeks is required after the first drug exposure for sensitization to occur in drug allergy.", answer:true, explain:"Correct. Prior sensitization is necessary for a drug allergy to manifest upon subsequent exposure."},
    {q:"Covalent bonds between a drug and receptor are easily reversible.", answer:false, explain:"Covalent bonds are extremely strong and are generally considered irreversible in a biological context."},
    {q:"Receptors are exclusively made of ion channels.", answer:false, explain:"Receptors are a class of protein molecules that includes enzymes, transporters, and ion channels."},
    {q:"An orphan receptor is a receptor that has been destroyed by a drug.", answer:false, explain:"It is a receptor for which the corresponding endogenous ligand has not yet been discovered."},
    {q:"A Type E adverse reaction occurs during the initial phase of treatment.", answer:false, explain:"It occurs at the 'End of treatment' when the drug is stopped, such as withdrawal effects."},
    {q:"Adrenaline is administered in cases of severe drug allergy.", answer:true, explain:"The slide recommends administering adrenaline 0.5 mg IM as a primary treatment for severe allergic reactions."},
    {q:"Bleeding after taking anticoagulants is considered a predictable, Type A adverse reaction.", answer:true, explain:"This is an augmented (exaggerated) pharmacological effect of the drug, making it a classic Type A ADR."}
];

const saqs = [
    {q:"Define the term 'agonist' as it relates to drug-receptor interactions.", a:"An agonist is a drug or chemical agent that binds to and activates a specific receptor, resulting in a cellular response that can either stimulate or inhibit a cell's function."},
    {q:"List the four types of drug-receptor binding interactions mentioned in the lecture.", a:"1. Ionic interaction<br>2. Hydrogen bonding<br>3. Lipophilic interaction<br>4. Covalent bond"},
    {q:"Compare Type A and Type B adverse drug reactions based on dose-dependency and predictability.", a:"<table><thead><tr><th>Feature</th><th>Type A (Augmented)</th><th>Type B (Bizarre)</th></tr></thead><tbody><tr><td>1. Dose-dependency</td><td>Dose-dependent</td><td>Dose-independent</td></tr><tr><td>2. Predictability</td><td>Predictable</td><td>Unpredictable</td></tr></tbody></table>"},
    {q:"A patient starts taking a new antibiotic. Two weeks later, after a second dose, they develop hives (urticaria). What type of adverse drug reaction is this likely to be, and what is the underlying mechanism?", a:"This is likely a Type B (Bizarre) adverse drug reaction, specifically a drug allergy. The mechanism is a cell-mediated immune reaction that occurred due to prior sensitization to the drug during the initial two-week period."},
    {q:"What are the three main pharmacological interventions listed for managing a severe drug allergy?", a:"1. Adrenaline (0.5 mg IM)<br>2. An H1 antihistaminic (e.g., Chlorpheniramine 10-20 mg)<br>3. An intravenous glucocorticoid (e.g., Hydrocortisone 200 mg)"},
    {q:"What is an 'Adverse Drug Reaction' (ADR)?", a:"An ADR is an undesired or unintended effect of a drug that occurs at doses normally used in humans for prophylaxis, diagnosis, or therapy. It may require treatment or a decrease in dose if it is due to overdose."}
];

// ----------- State -----------
const state = {
  mcq: Array(mcqs.length).fill(null), // null | selectedIndex
  tf: Array(tfs.length).fill(null),   // null | boolean
  saq: Array(saqs.length).fill(false) // self-marked
};

function shuffleIndices(n){
  const arr = Array.from({length:n}, (_,i)=>i);
  for(let i=n-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}

// ----------- Render MCQs -----------
const mcqGrid = document.getElementById('mcqGrid');
mcqs.forEach((item, idx)=>{
  const map = shuffleIndices(4);
  const visualToOriginal = map;
  const originalToVisual = Array(4);
  map.forEach((orig, v)=>{ originalToVisual[orig] = v; });
  const correctVisualIndex = originalToVisual[item.correct];

  const card = document.createElement('article');
  card.className='card qcard';
  card.dataset.type='mcq';
  card.dataset.index = idx;
  card.dataset.locked = 'false';
  card.innerHTML = `
    <p class="meta">Question ${idx+1} of ${mcqs.length}</p>
    <h3 class="qtitle">${item.q}</h3>
    <div class="opts">
      ${[0,1,2,3].map(v=>`
        <button class="opt-btn" data-v="${v}" aria-label="Answer option ${String.fromCharCode(65+v)}">
          <span class="key">${String.fromCharCode(65+v)}</span>
          <span class="label">${item.opts[ visualToOriginal[v] ]}</span>
        </button>
      `).join('')}
    </div>
    <div class="feedback" hidden></div>
  `;

  const buttons = card.querySelectorAll('.opt-btn');
  const feedback = card.querySelector('.feedback');

  function lock(){
    card.dataset.locked = 'true';
    buttons.forEach(b=>b.setAttribute('disabled',''));
  }

  buttons.forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(card.dataset.locked === 'true') return;
      const v = Number(btn.dataset.v);
      const originalSelectionIndex = visualToOriginal[v];
      state.mcq[idx] = originalSelectionIndex;

      buttons.forEach(b=>b.classList.remove('correct','wrong'));

      const correctBtn = buttons[correctVisualIndex];
      correctBtn.classList.add('correct');

      if(v !== correctVisualIndex){
        btn.classList.add('wrong');
        feedback.hidden=false;
        feedback.innerHTML = `<b>Wrong ✖</b><br>Correct answer: <b>${String.fromCharCode(65+correctVisualIndex)}</b><br>${item.explain}`;
      }else{
        feedback.hidden=false;
        feedback.innerHTML = `<b>Correct ✔</b><br>Answer: <b>${String.fromCharCode(65+correctVisualIndex)}</b><br>${item.explain}`;
      }
      lock();
      recalc();
    });
  });

  mcqGrid.appendChild(card);
});

// ----------- Render True/False -----------
const tfGrid = document.getElementById('tfGrid');
tfs.forEach((item, idx)=>{
  const card = document.createElement('article');
  card.className='card qcard';
  card.dataset.type='tf';
  card.dataset.index = idx;
  card.dataset.locked = 'false';
  card.innerHTML = `
    <p class="meta">Statement ${idx+1} of ${tfs.length}</p>
    <h3 class="qtitle">${item.q}</h3>
    <div class="opts">
      <button class="opt-btn" data-v="true">
        <span class="key">T</span><span class="label">True</span>
      </button>
      <button class="opt-btn" data-v="false">
        <span class="key">F</span><span class="label">False</span>
      </button>
    </div>
    <div class="feedback" hidden></div>
  `;

  const buttons = card.querySelectorAll('.opt-btn');
  const feedback = card.querySelector('.feedback');

  function lock(){
    card.dataset.locked = 'true';
    buttons.forEach(b=>b.setAttribute('disabled',''));
  }

  buttons.forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(card.dataset.locked === 'true') return;
      const val = btn.dataset.v === "true";
      state.tf[idx] = val;

      buttons.forEach(b=>b.classList.remove('correct','wrong'));

      const correctBtn = Array.from(buttons).find(b => (b.dataset.v === (item.answer ? "true" : "false")));
      correctBtn.classList.add('correct');

      const isCorrect = (val === item.answer);
      if(!isCorrect){
        btn.classList.add('wrong');
        feedback.hidden=false;
        feedback.innerHTML = `<b>Wrong ✖</b><br>Correct answer: <b>${item.answer ? 'True' : 'False'}</b><br>${item.explain}`;
      }else{
        feedback.hidden=false;
        feedback.innerHTML = `<b>Correct ✔</b><br>Answer: <b>${item.answer ? 'True' : 'False'}</b><br>${item.explain}`;
      }

      lock();
      recalc();
    });
  });

  tfGrid.appendChild(card);
});

// ----------- Render SAQs -----------
const saqGrid = document.getElementById('saqGrid');
saqs.forEach((item, idx)=>{
  const card = document.createElement('article');
  card.className='card qcard';
  card.dataset.type='saq';
  card.dataset.index = idx;
  card.innerHTML = `
  <p class="meta">Question ${idx + 1} of ${saqs.length}</p>
  <h3 class="qtitle">${item.q}</h3>
  <textarea rows="4" placeholder="Type your answer..." style="width:100%;padding:12px;border-radius:12px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.14);color:var(--text);margin-top:10px;"></textarea>
  <div class="btnrow" style="margin-top:10px">
    <button class="primary" data-act="reveal">Reveal Answer</button>
    <button class="ghost" data-act="toggle">I was correct</button>
  </div>
  <div class="answer" hidden>${item.a}</div>
`;

  const revealBtn = card.querySelector('[data-act="reveal"]');
  const toggleBtn = card.querySelector('[data-act="toggle"]');
  const answer = card.querySelector('.answer');

  revealBtn.addEventListener('click', ()=>{
    answer.hidden = !answer.hidden;
    revealBtn.textContent = answer.hidden ? "Reveal Answer" : "Hide Answer";
  });

  toggleBtn.addEventListener('click', ()=>{
    const now = !state.saq[idx];
    state.saq[idx] = now;
    toggleBtn.textContent = now ? "✓ Marked as correct" : "I was correct";
    toggleBtn.style.outline = now ? "2px solid rgba(34,197,94,.7)" : "none";
    if (now) {
        toggleBtn.style.backgroundColor = "rgba(34,197,94,.15)";
    } else {
        toggleBtn.style.backgroundColor = "";
    }
    recalc();
  });

  saqGrid.appendChild(card);
});

// ----------- Score + Reset -----------
function recalc(){
  const mcqScore = state.mcq.reduce((s, selectedOriginalIndex, i) => {
    if (selectedOriginalIndex === null) return s;
    return s + (selectedOriginalIndex === mcqs[i].correct ? 1 : 0);
  }, 0);

  const tfScore = state.tf.reduce((s,v,i)=>{
    if(v === null) return s;
    return s + (v === tfs[i].answer ? 1 : 0);
  },0);

  const saqScore = state.saq.filter(Boolean).length;
  const total = mcqScore + tfScore + saqScore;

  const ids = ["sMcq","sTf","sSaq","sTotal","sMcq2","sTf2","sSaq2","sTotal2"];
  ids.forEach(id=>{
    const el = document.getElementById(id);
    if(!el) return;
    if(id.includes('Mcq')) el.textContent = mcqScore;
    if(id.includes('Tf')) el.textContent = tfScore;
    if(id.includes('Saq')) el.textContent = saqScore;
    if(id.includes('Total')) el.textContent = total;
  });
}

document.getElementById('resetAll').addEventListener('click', ()=>{
    if (!confirm("Are you sure you want to reset all progress?")) {
        return;
    }
  document.querySelectorAll('.qcard .feedback').forEach(f=>{f.hidden=true; f.textContent=''; f.innerHTML='';});
  document.querySelectorAll('.opt-btn').forEach(b=>{
    b.classList.remove('correct','wrong');
    b.removeAttribute('disabled');
  });
  document.querySelectorAll('.qcard[data-type="mcq"], .qcard[data-type="tf"]').forEach(c=>{c.dataset.locked='false';});
  document.querySelectorAll('.qcard[data-type="saq"] textarea').forEach(t=>t.value="");
  document.querySelectorAll('.qcard[data-type="saq"] .answer').forEach(a=>a.hidden=true);
  document.querySelectorAll('.qcard[data-type="saq"] [data-act="reveal"]').forEach(b=>b.textContent="Reveal Answer");
  document.querySelectorAll('.qcard[data-type="saq"] [data-act="toggle"]').forEach(b=>{
      b.textContent="I was correct";
      b.style.outline="none";
      b.style.backgroundColor = "";
  });

  state.mcq.fill(null); state.tf.fill(null); state.saq.fill(false);
  recalc();
});

recalc();
</script>
</body>
</html>
